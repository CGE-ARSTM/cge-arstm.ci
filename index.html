function ContactPage({ user, profile, notify, presetSubject }) {
  const init = {
    name: user ? [profile.prenoms, profile.nom].filter(Boolean).join(" ") : "",
    email: user ? profile.email || user.email || "" : "",
    subject: presetSubject || CONTACT_SUBJECTS[0], body: "", website: "",
  };
  const [f, setF] = useState(init);
  const [busy, setBusy] = useState(false);
  const [sent, setSent] = useState(false);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

  const send = async () => {
    if (f.website) return setSent(true); // champ piège invisible : rempli uniquement par les robots
    if (f.name.trim().length < 2) return notify("Indiquez votre nom.", "error");
    if (!EMAIL_RE.test(f.email.trim())) return notify("Adresse email invalide.", "error");
    if (f.body.trim().length < 5) return notify("Votre message est trop court.", "error");
    setBusy(true);
    const { error } = await sb.from("messages").insert({ name: f.name.trim(), email: f.email.trim(), subject: f.subject, body: f.body.trim().slice(0, 3000) });
    setBusy(false);
    if (error) return notify("Envoi impossible : " + error.message, "error");
    setSent(true);
  };

  const infos = [
    [MapPin, "Adresse", CONTACT.adresse, null],
    [Mail, "Email", CONTACT.email, CONTACT.email && `mailto:${CONTACT.email}`],
    [Phone, "Téléphone", CONTACT.telephone, CONTACT.telephone && `tel:${CONTACT.telephone.replace(/\s/g, "")}`],
    [Globe, "Facebook", CONTACT.facebook && "CGE Côte d'Ivoire", CONTACT.facebook],
  ].filter(([, , v]) => v);

  return (
    <>
      <PageHero kicker="Écrivez-nous" title="Contact" sub="Une question, une proposition de partenariat ou une offre à partager ? Le bureau vous répond." icon={Mail} />
      <main className="max-w-6xl mx-auto px-4 py-16 grid lg:grid-cols-5 gap-6">
        <div className="lg:col-span-2 space-y-4">
          {infos.map(([Icon, label, value, href]) => (
            <div key={label} className="bg-white rounded-3xl p-6 shadow-sm flex items-center gap-4">
              <div className="w-12 h-12 flex-shrink-0 rounded-2xl bg-orange-100 flex items-center justify-center"><Icon size={20} className="text-orange-600" /></div>
              <div className="min-w-0">
                <p className="text-xs font-bold uppercase tracking-wider text-slate-400">{label}</p>
                {href ? <a href={href} target={href.startsWith("http") ? "_blank" : undefined} rel="noopener noreferrer" className="font-semibold text-slate-900 hover:text-orange-600 break-words">{value}</a> : <p className="font-semibold text-slate-900">{value}</p>}
              </div>
            </div>
          ))}
          <div className="rounded-3xl p-6 text-white shadow-xl" style={{ background: NAVY }}>
            <Handshake className="text-orange-400" />
            <p className="font-bold text-lg mt-3">{tx("contact.entreprises_titre")}</p>
            <p className="text-sm text-slate-300 mt-2 whitespace-pre-line">{tx("contact.entreprises_texte")}</p>
          </div>
        </div>

        <div className="lg:col-span-3">
          <Panel title="Envoyer un message" Icon={Send}>
            {sent ? (
              <div className="text-center py-10">
                <div className="w-16 h-16 mx-auto rounded-2xl bg-emerald-100 flex items-center justify-center"><CheckCircle2 className="text-emerald-600" /></div>
                <p className="font-bold text-slate-900 text-lg mt-5">Message envoyé, merci !</p>
                <p className="text-sm text-slate-600 mt-2">Le bureau de la CGE vous répondra à l'adresse indiquée.</p>
                <button onClick={() => { setF(init); setSent(false); }} className="mt-6 px-5 py-2.5 rounded-xl bg-white border border-slate-300 font-semibold text-sm">Écrire un autre message</button>
              </div>

                <label className="block"><span className="text-xs font-semibold text-slate-600">Sujet</span>
                  <select value={f.subject} onChange={set("subject")} className={inputCls}>{CONTACT_SUBJECTS.map((s) => <option key={s}>{s}</option>)}</select>
                </label>
                <label className="block"><span className="text-xs font-semibold text-slate-600">Message ({f.body.length}/3000)</span>
                  <textarea rows={6} maxLength={3000} value={f.body} onChange={set("body")} className={inputCls} />

// =====================================================================
// COTISATIONS : suivi personnel (Mon espace) et badge « en retard » pour le bureau
// =====================================================================
// Membres en retard : chargé une fois puis gardé 2 minutes (évite une requête par badge).
let retardsCache = { at: 0, data: null, promise: null };
const chargerRetards = () => {
  if (retardsCache.data && Date.now() - retardsCache.at < 120000) return Promise.resolve(retardsCache.data);
  if (!retardsCache.promise) {
    retardsCache.promise = sb.rpc("retards_cotisations").then(({ data }) => {
      retardsCache = { at: Date.now(), data: Object.fromEntries((data || []).map((r) => [r.user_id, r.reste])), promise: null };
      return retardsCache.data;
    }, () => { retardsCache.promise = null; return {}; });
  }
  return retardsCache.promise;
};
function RetardBadge({ uid }) {
  const [reste, setReste] = useState(0);
  useEffect(() => { let ok = true; chargerRetards().then((d) => { if (ok) setReste((d && d[uid]) || 0); }); return () => { ok = false; }; }, [uid]);
  if (!reste) return null;
  return <span className="text-xs px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 font-semibold" title={`Reste à payer : ${fcfa(reste)}`}>Cotisation en retard</span>;
}

const useMesCotisations = () => {
  const [d, setD] = useState(null);
  useEffect(() => {
    let ok = true;
    Promise.all([sb.rpc("mes_cotisations"), sb.rpc("mes_versements")])
      .then(([c, v]) => { if (ok) setD({ cot: c.data || [], vers: v.data || [], err: c.error }); }, () => { if (ok) setD({ cot: [], vers: [], err: true }); });
    return () => { ok = false; };
  }, []);
  return d;
};
const statutCotisation = (c) => {
  const reste = Math.max(c.montant_du - c.paye, 0);
  return c.montant_du === 0 ? "dispense" : reste === 0 ? "ajour" : (c.echeance && daysUntil(c.echeance) < 0) ? "retard" : c.paye > 0 ? "partiel" : "attente";
};

// Rappel affiché en haut de Mon espace quand une cotisation est en retard.
function RappelCotisations({ onOpen }) {
  const d = useMesCotisations();
  if (!d || d.err) return null;
  const retard = d.cot.filter((c) => statutCotisation(c) === "retard");
  const reste = retard.reduce((s, c) => s + Math.max(c.montant_du - c.paye, 0), 0);
  if (!reste) return null;
  return (
    <div className="mb-6 rounded-2xl bg-rose-50 border border-rose-200 p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <p className="text-sm text-rose-800"><strong>Rappel : cotisation en retard.</strong> Il vous reste {fcfa(reste)} à régler ({retard.length} cotisation{retard.length > 1 ? "s" : ""}). Rapprochez-vous de la Trésorerie de la CGE.</p>
      <button onClick={onOpen} className="px-4 py-2 rounded-xl bg-rose-600 text-white text-sm font-semibold whitespace-nowrap">Voir mes cotisations</button>
    </div>
  );
}

function MesCotisations() {
  const d = useMesCotisations();
  if (!d) return <Panel title="Mes cotisations" Icon={BarChart3}><p className="text-sm text-slate-500">Chargement...</p></Panel>;
  if (d.err) return <Panel title="Mes cotisations" Icon={BarChart3}><p className="text-sm text-slate-500">Le suivi des cotisations n'est pas encore disponible.</p></Panel>;
  const reste = d.cot.reduce((s, c) => s + Math.max(c.montant_du - c.paye, 0), 0);
  const groupes = [["annuelle", "Cotisations annuelles"], ["bureau", "Cotisation du bureau"], ["exceptionnelle", "Cotisations exceptionnelles"]];
  return (
    <div className="space-y-6">
      <Panel title="Mes cotisations" Icon={BarChart3}>
        <div className="grid grid-cols-2 gap-3 mb-5">
          <div className={`rounded-2xl p-4 ${reste ? "bg-amber-50 text-amber-800" : "bg-emerald-50 text-emerald-700"}`}><p className="text-xs font-semibold opacity-70">Reste à payer</p><p className="text-2xl font-extrabold">{fcfa(reste)}</p></div>
          <div className="rounded-2xl p-4 bg-slate-50 text-slate-900"><p className="text-xs font-semibold opacity-70">Total versé</p><p className="text-2xl font-extrabold">{fcfa(somme(d.vers))}</p></div>
        </div>
        <p className="text-sm text-slate-600 mb-5">Les paiements se font auprès de la Trésorerie, en espèces ou par Mobile Money. Si vous payez par Mobile Money, envoyez la capture du reçu à la Trésorerie par WhatsApp : elle enregistrera votre versement.</p>
        {d.cot.length === 0 ? <p className="text-sm text-slate-500">Aucune cotisation pour le moment.</p> : groupes.map(([type, titre]) => {
          const list = d.cot.filter((c) => c.type === type);
          if (!list.length) return null;
          return (
            <div key={type} className="mb-5">
              <p className="font-bold text-slate-900 mb-2">{titre}</p>
              <ul className="divide-y divide-slate-100">
                {list.map((c) => { const s = statutCotisation(c); return (
                  <li key={c.du_id} className="py-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-1 text-sm">
                    <span className="text-slate-900">{c.titre}{c.echeance && <span className="text-slate-500"> · avant le {fmtDate(c.echeance)}</span>}</span>
                    <span className="flex items-center gap-2">
                      <span className="text-slate-600">{fcfa(c.paye)} / {fcfa(c.montant_du)}</span>
                      <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${FIN_STATUTS[s][1]}`}>{FIN_STATUTS[s][0]}</span>
                    </span>
                  </li>
                ); })}
              </ul>
            </div>
          );
        })}
      </Panel>
      {d.vers.length > 0 && (
        <Panel title="Mes versements" Icon={CheckCircle2}>
          <ul className="divide-y divide-slate-100">{d.vers.map((v, i) => (
            <li key={i} className="py-2 flex justify-between gap-3 text-sm"><span><span className="text-slate-500">{fmtDate(v.date)} · </span>{v.libelle}{v.mode && <span className="text-slate-400"> · {v.mode}</span>}</span><span className="font-bold text-emerald-700 whitespace-nowrap">{fcfa(v.montant)}</span></li>
          ))}</ul>
        </Panel>
      )}
    </div>
  );
}

// Onglet « Mentorat » de l'espace personnel (élèves et anciens).

  return (

function MentoratItem({ m, onUpdate }) {
  const [reply, setReply] = useState("");
  const [busy, setBusy] = useState(false);
  const [label, cls] = MENTORAT_STATUS[m.statut] || MENTORAT_STATUS.en_attente;
  const isMentor = m.sens === "mentor";
  const act = async (patch, msg) => { setBusy(true); await onUpdate(m.id, patch, msg); setBusy(false); };
  return (
    <li className={`p-5 rounded-2xl border ${isMentor && m.statut === "en_attente" ? "border-orange-300 bg-orange-50" : "border-slate-200"}`}>
      <div className="flex items-start gap-3">
        <Avatar photo={m.autre_photo} name={m.autre_nom} size="w-11 h-11" text="text-sm" />
        <div className="flex-1 min-w-0">
          <div className="flex flex-wrap items-center gap-2"><p className="font-bold text-slate-900">{m.autre_nom}</p><span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${cls}`}>{label}</span></div>
          {m.autre_infos && <p className="text-xs text-slate-500 mt-0.5">{m.autre_infos}</p>}
          <p className="text-xs text-slate-400 mt-0.5">{isMentor ? "Demande reçue" : "Demande envoyée"} le {fmtDate(m.created_at)}</p>
        </div>
      </div>
      <p className="text-sm text-slate-700 mt-3 p-3 rounded-xl bg-white border border-slate-100 whitespace-pre-line">{m.message}</p>
      {m.reponse && <p className="text-sm text-slate-700 mt-2 p-3 rounded-xl bg-orange-50 whitespace-pre-line"><strong>{isMentor ? "Votre réponse" : "Réponse du mentor"} :</strong> {m.reponse}</p>}
      {m.statut === "acceptee" && (m.autre_email || m.autre_telephone) && (
        <div className="mt-3 p-3 rounded-xl bg-emerald-50 text-sm text-emerald-800 flex flex-wrap items-center gap-x-4 gap-y-1">
          <span className="font-semibold">Pour poursuivre l'échange :</span>
          {m.autre_email && <a href={`mailto:${m.autre_email}`} className="flex items-center gap-1 underline"><Mail size={14} /> {m.autre_email}</a>}
          {m.autre_telephone && <a href={`tel:${m.autre_telephone.replace(/\s/g, "")}`} className="flex items-center gap-1 underline"><Phone size={14} /> {m.autre_telephone}</a>}
        </div>
      )}
      {isMentor && m.statut === "en_attente" && (
        <div className="mt-4 space-y-2">
          <textarea rows={2} maxLength={1500} value={reply} onChange={(e) => setReply(e.target.value)} placeholder="Un petit mot pour l'élève (facultatif) : vos disponibilités, comment vous joindre..." className={inputCls} />
          <p className="text-xs text-slate-500">En acceptant, votre email et votre téléphone de contact sont communiqués à l'élève (et les siens à vous).</p>
          <div className="flex gap-2 justify-end">
            <button disabled={busy} onClick={() => act({ statut: "refusee", reponse: reply.trim() || null }, "Demande déclinée.")} className="px-4 py-2 rounded-xl bg-white border border-slate-300 text-sm font-semibold text-slate-600 disabled:opacity-60">Décliner</button>
            <button disabled={busy} onClick={() => act({ statut: "acceptee", reponse: reply.trim() || null }, "Demande acceptée ! Vos coordonnées sont maintenant partagées.")} className="px-4 py-2 rounded-xl bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700 disabled:opacity-60 flex items-center gap-1"><CheckCircle2 size={15} /> Accepter</button>
          </div>
        </div>
      )}
      <div className="mt-3 flex justify-end gap-2">
        {!isMentor && m.statut === "en_attente" && <ConfirmButton onConfirm={() => act({ statut: "annulee" }, "Demande annulée.")} confirmLabel="Annuler ?" className="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-rose-600">Annuler la demande</ConfirmButton>}
        {m.statut === "acceptee" && <ConfirmButton onConfirm={() => act({ statut: "terminee" }, "Mentorat marqué comme terminé. Merci !")} confirmLabel="Terminer ?" className="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-orange-600">Marquer comme terminé</ConfirmButton>}
      </div>
    </li>
  );
}

// Profil professionnel d'un ancien + choix d'être mentor.
function AncienPanel({ profile, update, notify }) {
  const keys = ["poste", "entreprise", "pays", "annuaire", "mentor", "mentor_domaines", "mentor_presentation"];
  const [d, setD] = useState(Object.fromEntries(keys.map((k) => [k, profile[k]])));
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setD({ ...d, [k]: e.target.value });
  const save = async () => {
    const patch = { ...d, annuaire: d.annuaire !== false, mentor: d.annuaire !== false && !!d.mentor };
    setSaving(true);
    const ok = await update(patch);
    setSaving(false);
    if (ok) notify("Profil d'ancien enregistré.");
  };
  return (
    <Panel title="Mon profil d'ancien" Icon={GraduationCap}>
      <div className="grid sm:grid-cols-3 gap-4">
        <label className="block"><span className="text-xs font-semibold text-slate-600">Poste actuel</span><input value={d.poste || ""} onChange={set("poste")} placeholder="ex. Officier mécanicien" className={inputCls} /></label>
        <label className="block"><span className="text-xs font-semibold text-slate-600">Entreprise</span><input value={d.entreprise || ""} onChange={set("entreprise")} placeholder="ex. Compagnie maritime" className={inputCls} /></label>
        <label className="block"><span className="text-xs font-semibold text-slate-600">Pays</span><input value={d.pays || ""} onChange={set("pays")} placeholder="ex. Côte d'Ivoire" className={inputCls} /></label>
      </div>
      <p className="text-xs text-slate-500 mt-2">La ville et le lien LinkedIn se règlent dans « Informations personnelles ».</p>
      <div className="mt-6 space-y-3">
        <label className={`flex items-start gap-3 p-4 rounded-2xl border cursor-pointer transition ${d.annuaire !== false ? "border-orange-300 bg-orange-50" : "border-slate-200"}`}>
          <input type="checkbox" checked={d.annuaire !== false} onChange={(e) => setD({ ...d, annuaire: e.target.checked, mentor: e.target.checked ? d.mentor : false })} className="w-5 h-5 mt-0.5 accent-orange-600" />
          <span><span className="font-semibold text-slate-900 block">Apparaître dans l'annuaire des anciens</span><span className="text-xs text-slate-500">Visible uniquement par les membres connectés : nom, promo, poste, entreprise, ville, pays et LinkedIn. Jamais votre email ni votre téléphone.</span></span>
        </label>
        <label className={`flex items-start gap-3 p-4 rounded-2xl border transition ${d.annuaire === false ? "opacity-50 cursor-not-allowed" : "cursor-pointer"} ${d.mentor && d.annuaire !== false ? "border-emerald-400 bg-emerald-50" : "border-slate-200"}`}>
          <input type="checkbox" disabled={d.annuaire === false} checked={!!d.mentor && d.annuaire !== false} onChange={(e) => setD({ ...d, mentor: e.target.checked })} className="w-5 h-5 mt-0.5 accent-emerald-600" />
          <span><span className="font-semibold text-slate-900 block">Je souhaite être mentor</span><span className="text-xs text-slate-500">Les élèves pourront vous envoyer une demande. Vous choisissez librement d'accepter ou non, et vous pouvez arrêter à tout moment.</span></span>
        </label>
      </div>
      {d.mentor && d.annuaire !== false && (
        <div className="mt-4 space-y-4">
          <label className="block"><span className="text-xs font-semibold text-slate-600">Sujets sur lesquels vous pouvez aider</span><input value={d.mentor_domaines || ""} onChange={set("mentor_domaines")} placeholder="ex. Mécanique navale, offshore, recherche de stage, travail à l'étranger" className={inputCls} /></label>
          <label className="block"><span className="text-xs font-semibold text-slate-600">Quelques mots pour les élèves ({(d.mentor_presentation || "").length}/400)</span>
            <textarea rows={3} maxLength={400} value={d.mentor_presentation || ""} onChange={set("mentor_presentation")} placeholder="ex. 8 ans de navigation, aujourd'hui chef mécanicien. Je peux vous parler du métier et des premières années à bord." className={inputCls} />
          </label>
        </div>
      )}
      <div className="flex justify-end mt-6"><button onClick={save} disabled={saving} className="px-6 py-3 rounded-xl bg-orange-600 text-white font-semibold hover:bg-orange-700 disabled:opacity-60">{saving ? "Enregistrement..." : "Enregistrer"}</button></div>
    </Panel>
  );
}

// Un ancien partage son parcours ; le bureau valide avant publication.
function TemoignagePanel({ mine, onSubmit, onDelete, notify }) {
  const [open, setOpen] = useState(mine.length === 0);
  const [titre, setTitre] = useState("");
  const [texte, setTexte] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (texte.trim().length < 20) return notify("Votre témoignage doit faire au moins 20 caractères.", "error");
    setBusy(true);
    const ok = await onSubmit({ titre: titre.trim(), texte: texte.trim().slice(0, 4000) });
    setBusy(false);
    if (ok) { setTitre(""); setTexte(""); setOpen(false); }
  };
  return (
    <Panel title="Partager mon parcours" Icon={Quote} action={!open && <button onClick={() => setOpen(true)} className="px-4 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold flex items-center gap-1"><Plus size={16} /> Nouveau</button>}>
      <p className="text-sm text-slate-500 -mt-3 mb-5">Votre témoignage inspire les élèves. Il sera publié dans « La parole aux anciens » après relecture par le bureau, avec votre nom, votre photo, votre poste et votre promotion.</p>
      {mine.length > 0 && (
        <ul className="space-y-3 mb-5">
          {mine.map((t) => (
            <li key={t.id} className="p-4 rounded-2xl border border-slate-200 flex items-start justify-between gap-3">
              <div className="min-w-0">
                <div className="flex flex-wrap items-center gap-2">
                  <p className="font-semibold text-slate-900">{t.titre || "Mon parcours"}</p>
                  <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${t.publie ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}`}>{t.publie ? "Publié" : "En attente de validation"}</span>
                </div>
                <p className="text-sm text-slate-600 mt-1">{t.texte.length > 160 ? t.texte.slice(0, 160) + "…" : t.texte}</p>
              </div>
              {!t.publie && <ConfirmButton onConfirm={() => onDelete(t.id)} confirmLabel="Retirer ?" ariaLabel="Retirer ce témoignage" className="p-2 rounded-lg text-rose-600 hover:bg-rose-50"><Trash2 size={16} /></ConfirmButton>}
            </li>
          ))}
        </ul>
      )}
      {open && (
        <div className="space-y-4">
          <label className="block"><span className="text-xs font-semibold text-slate-600">Titre (facultatif)</span><input value={titre} onChange={(e) => setTitre(e.target.value)} maxLength={120} placeholder="ex. De l'ARSTM à l'offshore" className={inputCls} /></label>
          <label className="block"><span className="text-xs font-semibold text-slate-600">Votre parcours ({texte.length}/4000)</span>
            <textarea rows={7} maxLength={4000} value={texte} onChange={(e) => setTexte(e.target.value)} placeholder="Votre filière, vos premiers stages, votre métier aujourd'hui, et le conseil que vous auriez aimé recevoir à l'époque..." className={inputCls} />
          </label>
          <div className="flex justify-end gap-2">
            {mine.length > 0 && <button onClick={() => setOpen(false)} className="px-4 py-2.5 rounded-xl bg-white border border-slate-300 text-sm">Annuler</button>}
            <button onClick={submit} disabled={busy} className="px-5 py-2.5 rounded-xl bg-orange-600 text-white font-semibold text-sm disabled:opacity-60 flex items-center gap-2"><Send size={15} /> {busy ? "Envoi..." : "Envoyer pour publication"}</button>
          </div>
        </div>
      )}
    </Panel>
  );
}

            <p className="text-sm text-slate-500">{l}</p>

        ))}
      </div>
      <Panel title="Pour compléter votre profil" Icon={CheckCircle2}>
        <ul className="grid sm:grid-cols-2 gap-3">
          {checklist.map(([label, t, done]) => (
            <li key={label}>
              <button onClick={() => setTab(t)} className={`w-full flex items-center gap-3 p-3 rounded-xl text-left text-sm transition ${done ? "bg-emerald-50 text-emerald-700" : "bg-slate-50 text-slate-700 hover:bg-orange-50"}`}>
                <CheckCircle2 size={18} className={done ? "text-emerald-600" : "text-slate-300"} /> {label}

          ))}

      </Panel>
      {myEvents.length > 0 && (
        <Panel title="Mes événements" Icon={Calendar}>
          <ul className="space-y-3">{myEvents.map((e) => (

              <span className="text-slate-500 whitespace-nowrap">{fmtDate(e.date)}{daysUntil(e.date) < 0 && " (passé)"}</span>
            </li>
          ))}</ul>
        </Panel>
      )}
    </div>
  );
}

function InfosTab({ uid, profile, update, notify }) {

  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setD({ ...d, [k]: e.target.value });
  const isAncien = d.type === "ancien";
  const onPhoto = async (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    setUploading(true);
    try {
      const url = await uploadPublicImage(`avatars/${uid}`, await compressImage(f, 500));
      setD((x) => ({ ...x, photo: url }));
      if (await update({ photo: url })) notify("Photo mise à jour.");
    } catch (err) { notify(err.message, "error"); }
    finally { setUploading(false); }
  };
  const removePhoto = async () => { setD((x) => ({ ...x, photo: null })); if (await update({ photo: null })) notify("Photo retirée."); };
  const save = async () => {
    if (d.email && !EMAIL_RE.test(d.email)) return notify("Adresse email invalide.", "error");
    if (d.linkedin && !/^https?:\/\//i.test(d.linkedin)) return notify("Le lien LinkedIn doit commencer par https://", "error");
    // On n'envoie que les champs de cet onglet (les autres sont gérés ailleurs).
    const { formations, experiences, competences, langues, cv, poste, entreprise, pays, annuaire, mentor, mentor_domaines, mentor_presentation, cge_ancien, postes_cge, ...infos } = d;
    setSaving(true);
    const ok = await update(infos);
    setSaving(false);
    if (ok) notify(isAncien && profile.type !== "ancien" ? "Vous êtes maintenant « Ancien » : complétez votre profil dans l'onglet Ancien & mentorat." : "Informations enregistrées.");
  };
  const F = ({ label, k, type = "text", placeholder }) => (
    <label className="block"><span className="text-xs font-semibold text-slate-600">{label}</span><input type={type} value={d[k] || ""} onChange={set(k)} placeholder={placeholder} className={inputCls} /></label>
  );
  return (
    <Panel title="Informations personnelles" Icon={User}>
      <div className="flex flex-col sm:flex-row items-center gap-5 mb-8 p-5 rounded-2xl bg-slate-50">
        <Avatar photo={d.photo} name={`${d.prenoms} ${d.nom}`} size="w-24 h-24" text="text-3xl" />
        <div className="text-center sm:text-left">
          <p className="font-semibold text-slate-900">Photo de profil</p>
          <p className="text-xs text-slate-500">Une photo professionnelle, visage bien visible. JPG ou PNG.</p>
          <div className="flex gap-2 mt-3 justify-center sm:justify-start">
            <label className={`cursor-pointer px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 ${uploading ? "bg-slate-200 text-slate-500" : "bg-orange-600 text-white hover:bg-orange-700"}`}>
              <Camera size={16} /> {uploading ? "Envoi..." : "Choisir"}<input type="file" accept="image/*" onChange={onPhoto} disabled={uploading} className="hidden" />
            </label>
            {d.photo && !uploading && <button onClick={removePhoto} className="px-4 py-2 rounded-xl bg-white border border-slate-300 text-sm">Retirer</button>}
          </div>
        </div>
      </div>

      <h3 className="font-bold text-slate-900 mb-3">Statut</h3>
      <div className="grid sm:grid-cols-2 gap-3">
        {[["eleve", "Élève actuel", "Je suis en formation à l'ARSTM"], ["ancien", "Ancien élève", "Je suis diplômé(e) de l'ARSTM"]].map(([v, l, s]) => (
          <button key={v} type="button" onClick={() => setD({ ...d, type: v })} className={`p-4 rounded-2xl border text-left transition ${d.type === v ? "border-orange-500 bg-orange-50 ring-2 ring-orange-200" : "border-slate-200 hover:border-orange-300"}`}>
            <p className="font-semibold text-slate-900">{l}</p><p className="text-xs text-slate-500">{s}</p>
          </button>
        ))}
      </div>

      {!isAncien && (
        <>
          <h3 className="font-bold text-slate-900 mt-8 mb-3">Projet professionnel</h3>
          <div className="space-y-4">
            {F({ label: "Objectif professionnel", k: "objectif", placeholder: "ex. Devenir officier mécanicien dans la marine marchande" })}
            <label className={`flex items-start gap-3 p-4 rounded-2xl border cursor-pointer transition ${d.disponible ? "border-emerald-400 bg-emerald-50" : "border-slate-200 hover:border-orange-300"}`}>
              <input type="checkbox" checked={!!d.disponible} onChange={(e) => setD({ ...d, disponible: e.target.checked })} className="w-5 h-5 mt-0.5 accent-emerald-600" />
              <span>
                <span className="font-semibold text-slate-900 block">Je suis disponible pour un stage</span>
                <span className="text-xs text-slate-500">Le bureau pourra transmettre votre profil aux entreprises qui recherchent des stagiaires.</span>
              </span>

function ListEditor({ title, Icon, fields, items, onChange, render, notify }) {
  const [form, setForm] = useState({});
  const [open, setOpen] = useState(false);
  const add = () => {
    const miss = fields.find(([k, , , req]) => req && !String(form[k] || "").trim());
    if (miss) return notify(`Le champ « ${miss[1]} » est obligatoire.`, "error");
    onChange([...items, { id: Date.now(), ...form }]); setForm({}); setOpen(false); notify("Ajouté.");
  };
  return (
    <Panel title={title} Icon={Icon} action={!open && <button onClick={() => setOpen(true)} className="px-4 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold flex items-center gap-1"><Plus size={16} /> Ajouter</button>}>
      {open && (
        <div className="mb-6 p-5 rounded-2xl bg-orange-50 border border-orange-100 space-y-3">
          {fields.map(([k, label, type]) => (
            <label key={k} className="block"><span className="text-xs font-semibold text-slate-600">{label}</span>
              {type === "textarea" ? <textarea rows={3} value={form[k] || ""} onChange={(e) => setForm({ ...form, [k]: e.target.value })} className={inputCls} />
                : <input value={form[k] || ""} onChange={(e) => setForm({ ...form, [k]: e.target.value })} className={inputCls} />}
            </label>
          ))}
          <div className="flex gap-2 justify-end">
            <button onClick={() => { setOpen(false); setForm({}); }} className="px-4 py-2 rounded-xl bg-white border border-slate-300 text-sm">Annuler</button>
            <button onClick={add} className="px-4 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold">Enregistrer</button>
          </div>
        </div>
      )}
      {items.length === 0 && !open && <p className="text-sm text-slate-500">Rien pour l'instant.</p>}
      <ul className="space-y-3">
        {items.map((it) => (
          <li key={it.id} className="flex items-start justify-between gap-4 p-4 rounded-2xl border border-slate-200 hover:border-orange-300 transition">
            <div className="border-l-4 border-orange-500 pl-4">{render(it)}</div>
            <ConfirmButton onConfirm={() => onChange(items.filter((x) => x.id !== it.id))} confirmLabel="Supprimer ?" ariaLabel="Supprimer" className="p-2 rounded-lg text-rose-600 hover:bg-rose-50"><Trash2 size={16} /></ConfirmButton>
          </li>
        ))}
      </ul>
    </Panel>
  );
}

    <div className="space-y-6">

function CVTab({ uid, profile, update, notify, openPreview }) {
  const [busy, setBusy] = useState(false);
  const onCV = async (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    if (!CV_TYPES[ext]) return notify("Format accepté : PDF, DOC ou DOCX.", "error");
    if (f.size > CV_MAX) return notify(`Fichier trop lourd (${fileSize(CV_MAX)} maximum).`, "error");
    setBusy(true);
    const path = `${uid}/${Date.now()}-${safeFileName(f.name)}`;
    const { error } = await sb.storage.from("cvs").upload(path, f, { contentType: CV_TYPES[ext] });
    if (error) { setBusy(false); return notify("Envoi du CV impossible : " + error.message, "error"); }
    const old = profile.cv?.path;
    const ok = await update({ cv: { name: f.name, size: f.size, path, date: todayISO() } });
    setBusy(false);
    if (ok) { if (old) sb.storage.from("cvs").remove([old]); notify("CV déposé avec succès."); }
  };
  const removeCV = async () => {
    const old = profile.cv?.path;
    if (await update({ cv: null })) { if (old) sb.storage.from("cvs").remove([old]); notify("CV retiré."); }
  };
  return (
    <div className="space-y-6">
      <Panel title="Mon CV" Icon={FileText}>
        {profile.cv && (
          <div className="flex flex-col sm:flex-row sm:items-center gap-4 p-5 rounded-2xl bg-emerald-50 border border-emerald-200">
            <div className="w-14 h-14 rounded-2xl bg-white flex items-center justify-center shadow-sm"><FileText className="text-emerald-600" /></div>
            <div className="flex-1">
              <p className="font-bold text-slate-900 break-all">{profile.cv.name}</p>
              <p className="text-sm text-slate-500">{fileSize(profile.cv.size)} · déposé le {fmtDate(profile.cv.date)}</p>
            </div>
            <div className="flex gap-2">
              <button onClick={() => downloadCV(profile.cv, notify)} className="px-4 py-2 rounded-xl bg-white border border-slate-300 text-sm font-semibold flex items-center gap-1"><Download size={15} /> Télécharger</button>
              <ConfirmButton onConfirm={removeCV} confirmLabel="Retirer ?" ariaLabel="Retirer le CV" className="p-2 rounded-xl text-rose-600 hover:bg-rose-100"><Trash2 size={17} /></ConfirmButton>
            </div>
          </div>
        )}
        <label className={`mt-5 block border-2 border-dashed rounded-3xl p-10 text-center transition ${busy ? "border-slate-200 bg-slate-50 cursor-wait" : "cursor-pointer border-slate-300 hover:border-orange-500 hover:bg-orange-50"}`}>
          <Upload className="mx-auto text-orange-600" size={36} />
          <p className="font-bold text-slate-900 mt-3">{busy ? "Envoi en cours..." : profile.cv ? "Remplacer mon CV" : "Déposer mon CV"}</p>
          <p className="text-sm text-slate-500 mt-1">PDF, DOC ou DOCX · {fileSize(CV_MAX)} maximum · visible uniquement par vous et les administrateurs</p>
          <input type="file" accept=".pdf,.doc,.docx" onChange={onCV} disabled={busy} className="hidden" />
        </label>
      </Panel>
      <div className="relative rounded-3xl overflow-hidden p-8 text-white shadow-xl" style={{ background: NAVY }}>
        <FileText size={140} className="absolute -right-4 -bottom-6 opacity-10" />
        <div className="relative">
          <p className="text-orange-400 text-sm font-bold uppercase tracking-widest flex items-center gap-2"><Sparkles size={15} /> Pas encore de CV ?</p>
          <h3 className="text-2xl font-extrabold mt-2">Générez-le à partir de votre profil</h3>
          <p className="text-slate-300 mt-2 max-w-lg">Vos informations, formations, expériences, compétences et langues sont mises en page automatiquement. Imprimez-le ou enregistrez-le en PDF.</p>
          <button onClick={openPreview} className="mt-6 px-6 py-3 rounded-xl bg-orange-600 font-semibold hover:bg-orange-500 transition flex items-center gap-2"><Printer size={17} /> Voir mon CV généré</button>
        </div>
      </div>
    </div>
  );
}

function LoginModal({ onClose, onLogin, onRegister, onForgot }) {
  const [mode, setMode] = useState("login"); // login | register | forgot | done | sent
  const [email, setEmail] = useState("");
  const [pwd, setPwd] = useState("");
  const [reg, setReg] = useState(EMPTY_REG);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const switchMode = (m) => { setMode(m); setErr(""); };
  const run = async (fn) => {
    if (busy) return;
    setBusy(true); setErr("");
    try { await fn(); } catch (e) { setErr(e.message || "Une erreur est survenue."); }
    finally { setBusy(false); }
  };

  const submit = () => run(async () => {
    if (!email.trim() || !pwd) return setErr("Saisissez votre email et votre mot de passe.");
    const e = await onLogin(email, pwd);
    if (e) setErr(e);
  });

  const register = () => run(async () => {
    const r = { ...reg, prenoms: reg.prenoms.trim(), nom: reg.nom.trim(), matricule: reg.matricule.trim(), email: reg.email.trim(), promotion: reg.promotion.trim() };
    if (!r.prenoms || !r.nom || !r.matricule || !r.email || !r.filiere || !r.promotion) return setErr("Tous les champs sont obligatoires.");
    if (!EMAIL_RE.test(r.email)) return setErr("Adresse email invalide.");
    if (r.type === "ancien" && !r.cge_ancien) return setErr("Indiquez si vous avez occupé un poste à la CGE.");
    if (r.type === "ancien" && r.cge_ancien === "oui") { const ep = erreurPostes(r.postes_cge); if (ep) return setErr(ep); }
    if (r.password.length < 8) return setErr("Le mot de passe doit contenir au moins 8 caractères.");
    if (r.password !== r.confirm) return setErr("Les deux mots de passe ne correspondent pas.");
    const e = await onRegister(r);
    if (e) return setErr(e);
    setEmail(r.email); setPwd(""); setReg(EMPTY_REG); setMode("done");
  });

  const forgot = () => run(async () => {
    if (!EMAIL_RE.test(email.trim())) return setErr("Saisissez l'email de votre compte.");
    const e = await onForgot(email.trim());
    if (e) return setErr(e);
    setMode("sent");
  });

  const regField = (label, k, type = "text", placeholder = "") => (
    <label className="block">
      <span className="text-xs font-semibold text-slate-600">{label}</span>
      <input type={type} value={reg[k]} placeholder={placeholder} onChange={(e) => { setReg({ ...reg, [k]: e.target.value }); setErr(""); }} className={inputCls} />
    </label>
  );

  const titles = {
    login: ["Espace membre", "Connectez-vous avec votre email."],
    register: ["Créer un compte", "Pour les élèves et les anciens de l'ARSTM. Votre demande sera validée par le bureau."],
    forgot: ["Mot de passe oublié", "Recevez un lien pour choisir un nouveau mot de passe."],
    done: ["Demande envoyée", "Plus qu'une étape : la validation."],
    sent: ["Email envoyé", "Consultez votre boîte de réception."],
  };
  const btn = "w-full py-3.5 rounded-xl bg-orange-600 text-white font-bold hover:bg-orange-700 hover:shadow-lg transition disabled:opacity-60 flex items-center justify-center gap-2";

  return (
    <ModalShell onClose={onClose} title={titles[mode][0]} sub={titles[mode][1]}>
      {(mode === "login" || mode === "register") && (
        <div className="grid grid-cols-2 border-b border-slate-200">
          {[["login", "Connexion"], ["register", "Créer un compte"]].map(([m, l]) => (
            <button key={m} onClick={() => switchMode(m)} className={`py-3.5 text-sm font-semibold transition ${mode === m ? "text-orange-600 border-b-2 border-orange-600" : "text-slate-500 hover:text-slate-800"}`}>{l}</button>
          ))}
        </div>
      )}

      {mode === "login" && (
        <div className="p-8">
          <label className="block"><span className="text-xs font-semibold text-slate-600">Email</span><input type="email" autoFocus value={email} onChange={(e) => { setEmail(e.target.value); setErr(""); }} className={inputCls} /></label>
          <label className="block mt-4"><span className="text-xs font-semibold text-slate-600">Mot de passe</span><input type="password" value={pwd} onChange={(e) => { setPwd(e.target.value); setErr(""); }} onKeyDown={(e) => e.key === "Enter" && submit()} className={inputCls} /></label>
          {err && <p className="text-sm text-rose-600 mt-3">{err}</p>}
          <button onClick={submit} disabled={busy} className={btn + " mt-6"}>{busy ? "Connexion..." : "Se connecter"}</button>
          <button onClick={() => switchMode("forgot")} className="w-full text-sm text-slate-500 hover:text-orange-600 mt-4">Mot de passe oublié ?</button>
        </div>
      )}

      {mode === "register" && (
        <div className="p-8 space-y-4">
          <div className="grid grid-cols-2 gap-2">
            {[["eleve", "Élève actuel"], ["ancien", "Ancien élève"]].map(([v, l]) => (
              <button key={v} type="button" onClick={() => setReg({ ...reg, type: v })} className={`py-2.5 rounded-xl text-sm font-semibold border transition ${reg.type === v ? "border-orange-500 bg-orange-50 text-orange-700" : "border-slate-300 text-slate-600"}`}>{l}</button>
            ))}
          </div>
          <div className="grid grid-cols-2 gap-3">{regField("Prénoms", "prenoms", "text", "ex. Kouamé Jean-Marc")}{regField("Nom", "nom", "text", "ex. KOFFI")}</div>
          {regField(reg.type === "ancien" ? "Matricule (lors de votre scolarité)" : "Matricule", "matricule", "text", "ex. 2024-1234")}
          {regField("Email (servira à vous connecter)", "email", "email", "ex. kouamejean@gmail.com")}
          <div className="grid grid-cols-2 gap-3">
            <label className="block"><span className="text-xs font-semibold text-slate-600">Filière</span>
              <select value={reg.filiere} onChange={(e) => { setReg({ ...reg, filiere: e.target.value }); setErr(""); }} className={inputCls}>
                <option value="">Choisir...</option>{FILIERES.map((f) => <option key={f}>{f}</option>)}
              </select>
            </label>
            {regField("Promotion (numéro)", "promotion", "text", "ex. 38")}
            <p className="col-span-2 -mt-1 text-xs text-slate-500">Indiquez le numéro de votre promotion à l'ARSTM (par exemple 38), pas une année.</p>
          </div>
          {reg.type === "ancien" && (
            <div className="p-4 rounded-2xl bg-orange-50 border border-orange-100 space-y-3">
              <p className="text-sm font-semibold text-slate-900">Avez-vous occupé un poste à la CGE pendant votre scolarité ?</p>
              <OuiNon value={reg.cge_ancien} onChange={(v) => { setReg({ ...reg, cge_ancien: v }); setErr(""); }} />
              {reg.cge_ancien === "oui" && <PostesEditor value={reg.postes_cge} onChange={(postes_cge) => { setReg({ ...reg, postes_cge }); setErr(""); }} />}
            </div>
          )}
          {regField("Mot de passe (8 caractères min.)", "password", "password")}
          {regField("Confirmer le mot de passe", "confirm", "password")}
          {err && <p className="text-sm text-rose-600">{err}</p>}
          <button onClick={register} disabled={busy} className={btn}><UserPlus size={18} /> {busy ? "Envoi..." : "Envoyer ma demande"}</button>
        </div>
      )}

      {mode === "forgot" && (
        <div className="p-8">
          <label className="block"><span className="text-xs font-semibold text-slate-600">Email de votre compte</span><input type="email" autoFocus value={email} onChange={(e) => { setEmail(e.target.value); setErr(""); }} onKeyDown={(e) => e.key === "Enter" && forgot()} className={inputCls} /></label>
          {err && <p className="text-sm text-rose-600 mt-3">{err}</p>}
          <button onClick={forgot} disabled={busy} className={btn + " mt-6"}><KeyRound size={18} /> {busy ? "Envoi..." : "Recevoir le lien"}</button>
          <button onClick={() => switchMode("login")} className="w-full text-sm text-slate-500 hover:text-orange-600 mt-4">Retour à la connexion</button>
        </div>
      )}

      {mode === "done" && (
        <div className="p-8 text-center">
          <div className="w-16 h-16 mx-auto rounded-2xl bg-emerald-100 flex items-center justify-center"><Hourglass className="text-emerald-600" /></div>
          <p className="font-bold text-slate-900 mt-5 text-lg">Votre demande a bien été enregistrée !</p>
          <p className="text-sm text-slate-600 mt-2">Un administrateur de la CGE va vérifier vos informations. Vous pourrez ensuite vous connecter avec <strong>{email}</strong>.</p>
          <button onClick={() => switchMode("login")} className="mt-6 px-6 py-3 rounded-xl bg-orange-600 text-white font-semibold hover:bg-orange-700">Retour à la connexion</button>
        </div>
      )}

      {mode === "sent" && (
        <div className="p-8 text-center">
          <div className="w-16 h-16 mx-auto rounded-2xl bg-sky-100 flex items-center justify-center"><Mail className="text-sky-600" /></div>
          <p className="text-sm text-slate-600 mt-5">Si un compte existe pour <strong>{email}</strong>, un email contenant un lien vient de vous être envoyé. Pensez à vérifier vos courriers indésirables.</p>
          <button onClick={() => switchMode("login")} className="mt-6 px-6 py-3 rounded-xl bg-orange-600 text-white font-semibold hover:bg-orange-700">Retour à la connexion</button>
        </div>
      )}
    </ModalShell>
  );
}

// Fenêtre affichée quand on revient sur le site depuis le lien « mot de passe oublié ».
function NewPasswordModal({ onClose, notify }) {
  const [p1, setP1] = useState("");
  const [p2, setP2] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const save = async () => {
    if (p1.length < 8) return setErr("Le mot de passe doit contenir au moins 8 caractères.");
    if (p1 !== p2) return setErr("Les deux mots de passe ne correspondent pas.");
    setBusy(true);
    const { error } = await sb.auth.updateUser({ password: p1 });
    setBusy(false);
    if (error) return setErr(authMessage(error));
    notify("Mot de passe modifié.");
    onClose();
  };
  return (
    <ModalShell onClose={onClose} title="Nouveau mot de passe" sub="Choisissez votre nouveau mot de passe.">
      <div className="p-8 space-y-4">
        <label className="block"><span className="text-xs font-semibold text-slate-600">Nouveau mot de passe</span><input type="password" autoFocus value={p1} onChange={(e) => { setP1(e.target.value); setErr(""); }} className={inputCls} /></label>
        <label className="block"><span className="text-xs font-semibold text-slate-600">Confirmer</span><input type="password" value={p2} onChange={(e) => { setP2(e.target.value); setErr(""); }} onKeyDown={(e) => e.key === "Enter" && save()} className={inputCls} /></label>
        {err && <p className="text-sm text-rose-600">{err}</p>}
        <button onClick={save} disabled={busy} className="w-full py-3.5 rounded-xl bg-orange-600 text-white font-bold hover:bg-orange-700 disabled:opacity-60">{busy ? "Enregistrement..." : "Enregistrer"}</button>
      </div>
    </ModalShell>
  );
}

// Champ « image » : envoi immédiat, puis l'adresse est gardée dans le formulaire.
function ImageField({ label, value, onChange, folder, shape, notify }) {
  const [busy, setBusy] = useState(false);
  const onFile = async (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    setBusy(true);
    try { onChange(await uploadPublicImage(folder, await compressImage(f, shape === "logo" ? 600 : 500))); }
    catch (err) { notify(err.message, "error"); }
    finally { setBusy(false); }
  };
  return (
    <div className="block">
      {label}
      <div className="mt-1 flex items-center gap-3">
        {shape === "logo"
          ? <div className="w-20 h-14 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-center overflow-hidden">{value ? <img src={value} alt="" className="max-w-full max-h-full object-contain" /> : <ImageIcon size={20} className="text-slate-300" />}</div>
          : <Avatar photo={value} name="?" size="w-14 h-14" />}
        <label className={`cursor-pointer px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1 ${busy ? "bg-slate-200 text-slate-500" : "bg-orange-600 text-white hover:bg-orange-700"}`}>
          <Camera size={14} /> {busy ? "Envoi..." : value ? "Changer" : "Ajouter"}
          <input type="file" accept="image/*" onChange={onFile} disabled={busy} className="hidden" />
        </label>
        {value && !busy && <button type="button" onClick={() => onChange(null)} className="px-3 py-2 rounded-xl text-xs font-semibold bg-white border border-slate-300 text-slate-600">Retirer</button>}
      </div>
    </div>
  );
}

// Champ « fichier » des documents : envoi immédiat dans l'espace privé « documents ».
function FileField({ label, form, setForm, notify }) {
  const [busy, setBusy] = useState(false);
  const onFile = async (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    if (f.size > DOC_MAX) return notify(`Fichier trop lourd (${fileSize(DOC_MAX)} maximum).`, "error");
    setBusy(true);
    const path = `${Date.now()}-${safeFileName(f.name)}`;
    const { error } = await sb.storage.from("documents").upload(path, f, { contentType: f.type || "application/octet-stream" });
    setBusy(false);
    if (error) return notify("Envoi du fichier impossible : " + error.message, "error");
    setForm((prev) => ({ ...prev, fichier_path: path, fichier_nom: f.name, taille: f.size }));
  };
  return (
    <div className="block">
      {label}
      <div className="mt-1 flex flex-wrap items-center gap-3 p-3 rounded-xl border border-dashed border-slate-300">
        {form.fichier_nom
          ? <span className="text-sm font-semibold text-slate-800 flex items-center gap-2 min-w-0"><FileText size={16} className="text-orange-600 flex-shrink-0" /> <span className="truncate">{form.fichier_nom}</span> <span className="text-slate-400 font-normal">{fileSize(form.taille)}</span></span>
          : <span className="text-sm text-slate-400">Aucun fichier choisi</span>}
        <label className={`cursor-pointer ml-auto px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1 ${busy ? "bg-slate-200 text-slate-500" : "bg-orange-600 text-white hover:bg-orange-700"}`}>
          <Upload size={14} /> {busy ? "Envoi..." : form.fichier_nom ? "Remplacer" : "Choisir un fichier"}
          <input type="file" onChange={onFile} disabled={busy} className="hidden" />
        </label>
      </div>
    </div>
  );
}

// Une case d'image modifiable : aperçu + bouton « Changer » + bouton « Retirer ».
function ImageSlot({ imgKey, label, sub, round, notify }) {
  const { images, overrides, saveImage } = useContext(ImgCtx);
  const [busy, setBusy] = useState(false);
  const src = images[imgKey];
  const hasOverride = Object.prototype.hasOwnProperty.call(overrides, imgKey);
  const run = async (fn, msg) => {
    setBusy(true);
    try { await fn(); notify(msg); } catch (err) { notify(err.message, "error"); } finally { setBusy(false); }
  };
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    run(async () => saveImage(imgKey, await compressImage(f, round ? 500 : 700)), `Image mise à jour : ${label}`);
  };
  return (
    <div className="flex items-center gap-4 p-4 rounded-2xl border border-slate-200 hover:border-orange-300 transition">
      <div className={`w-16 h-16 flex-shrink-0 overflow-hidden flex items-center justify-center bg-slate-100 ${round ? "rounded-full" : "rounded-xl"}`}>
        <SafeImg src={src} alt={label} className={`w-full h-full ${round ? "object-cover" : "object-contain p-1 bg-white"}`} fallback={<ImageIcon size={22} className="text-slate-400" />} />
      </div>
      <div className="flex-1 min-w-0">
        <p className="font-semibold text-slate-900 text-sm truncate">{label}</p>
        {sub && <p className="text-xs text-slate-500 truncate">{sub}</p>}
        <div className="flex gap-2 mt-2">
          <label className={`cursor-pointer px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition ${busy ? "bg-slate-200 text-slate-500" : "bg-orange-600 text-white hover:bg-orange-700"}`}>
            <Camera size={13} /> {busy ? "Envoi..." : src ? "Changer" : "Ajouter"}
            <input type="file" accept="image/*" onChange={onFile} disabled={busy} className="hidden" />
          </label>
          {hasOverride && !busy && (
            <button onClick={() => run(() => saveImage(imgKey, null), `Image retirée : ${label}`)} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white border border-slate-300 text-slate-600 hover:text-rose-600">
              {DEFAULT_IMAGES[imgKey] ? "Image d'origine" : "Retirer"}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// Galerie : ajout de photos par album (plusieurs à la fois), légendes, suppression.
function AdminGallery({ photos, setPhotos, notify }) {
  const albumNames = [...new Set(photos.map((p) => p.album))];
  const [album, setAlbum] = useState(albumNames[0] || "__new");
  const [newAlbum, setNewAlbum] = useState("");
  const [date, setDate] = useState(todayISO());
  const [progress, setProgress] = useState(null);
  const target = album === "__new" ? newAlbum.trim() : album;

  const onFiles = async (e) => {
    const files = Array.from(e.target.files || []); e.target.value = "";
    if (!files.length) return;
    if (!target) return notify("Choisissez un album ou donnez un nom au nouvel album.", "error");
    const added = []; let fails = 0;
    for (let i = 0; i < files.length; i++) {
      setProgress(`${i + 1} / ${files.length}`);
      try {
        const { url, path } = await uploadImage(`site/galerie/${slugify(target)}`, await compressImage(files[i], 1600, 0.8));
        const { data, error } = await sb.from("photos").insert({ album: target, url, path, date }).select().single();
        if (error) throw error;
        added.push(data);
      } catch (err) { fails++; console.warn(err); }
    }
    setProgress(null);
    setPhotos((list) => [...added, ...list]);
    notify(fails ? `${added.length} photo(s) ajoutée(s), ${fails} échec(s).` : `${added.length} photo(s) ajoutée(s) à « ${target} ».`, fails ? "error" : "success");
    if (album === "__new") { setAlbum(target); setNewAlbum(""); }
  };
  const removePhotos = async (list, msg) => {
    const paths = list.map((p) => p.path).filter(Boolean);
    const { error } = await sb.from("photos").delete().in("id", list.map((p) => p.id));
    if (error) return notify("Suppression impossible : " + error.message, "error");
    if (paths.length) await sb.storage.from("images").remove(paths);
    const ids = new Set(list.map((p) => p.id));
    setPhotos((all) => all.filter((p) => !ids.has(p.id)));
    notify(msg);
  };
  const saveLegende = async (p, legende) => {
    if (legende === p.legende) return;
    const { error } = await sb.from("photos").update({ legende }).eq("id", p.id);
    if (error) return notify("Légende non enregistrée : " + error.message, "error");
    setPhotos((all) => all.map((x) => (x.id === p.id ? { ...x, legende } : x)));
  };

  return (
    <div className="space-y-6">
      <Panel title="Ajouter des photos" Icon={Camera}>
        <div className="grid sm:grid-cols-3 gap-3">
          <label className="block"><span className="text-xs font-semibold text-slate-600">Album</span>
            <select value={album} onChange={(e) => setAlbum(e.target.value)} className={inputCls}>
              {albumNames.map((a) => <option key={a} value={a}>{a}</option>)}
              <option value="__new">+ Nouvel album…</option>
            </select>
          </label>
          {album === "__new" && <label className="block"><span className="text-xs font-semibold text-slate-600">Nom du nouvel album</span><input value={newAlbum} onChange={(e) => setNewAlbum(e.target.value)} placeholder="ex. Journée de l'Ingénieur 2026" className={inputCls} /></label>}
          <label className="block"><span className="text-xs font-semibold text-slate-600">Date de l'événement</span><input type="date" value={date} onChange={(e) => setDate(e.target.value)} className={inputCls} /></label>
        </div>
        <label className={`mt-5 block border-2 border-dashed rounded-3xl p-8 text-center transition ${progress ? "border-slate-200 bg-slate-50 cursor-wait" : "cursor-pointer border-slate-300 hover:border-orange-500 hover:bg-orange-50"}`}>
          <Upload className="mx-auto text-orange-600" size={32} />
          <p className="font-bold text-slate-900 mt-2">{progress ? `Envoi en cours… ${progress}` : "Choisir des photos (plusieurs possibles)"}</p>
          <p className="text-xs text-slate-500 mt-1">Elles sont automatiquement réduites (environ 300 Ko chacune). L'offre gratuite de Supabase offre 1 Go de stockage, soit quelques milliers de photos.</p>
          <input type="file" accept="image/*" multiple onChange={onFiles} disabled={!!progress} className="hidden" />
        </label>
      </Panel>
      {albumNames.map((a) => {
        const list = photos.filter((p) => p.album === a);
        return (
          <Panel key={a} title={`${a} (${list.length})`} Icon={FolderOpen}
            action={<ConfirmButton onConfirm={() => removePhotos(list, `Album « ${a} » supprimé.`)} confirmLabel="Tout supprimer ?" className="px-3 py-1.5 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50">Supprimer l'album</ConfirmButton>}>
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
              {list.map((p) => (
                <div key={p.id} className="space-y-1.5">
                  <div className="relative aspect-square rounded-xl overflow-hidden bg-slate-100">
                    <img src={p.url} alt={p.legende} loading="lazy" className="w-full h-full object-cover" />
                    <div className="absolute top-1.5 right-1.5"><ConfirmButton onConfirm={() => removePhotos([p], "Photo supprimée.")} confirmLabel="Suppr. ?" ariaLabel="Supprimer la photo" className="w-8 h-8 rounded-lg bg-white bg-opacity-90 text-rose-600 flex items-center justify-center shadow"><Trash2 size={15} /></ConfirmButton></div>
                  </div>
                  <input defaultValue={p.legende} onBlur={(e) => saveLegende(p, e.target.value.trim())} placeholder="Légende…" className="w-full px-2 py-1.5 rounded-lg border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-orange-500" />
                </div>
              ))}
            </div>
          </Panel>
        );
      })}
    </div>
  );
}

// Sondages : création, résultats en direct, clôture.
function AdminPolls({ sondages, setSondages, countsFor, notify }) {
  const [question, setQuestion] = useState("");
  const [opts, setOpts] = useState("");
  const [cloture, setCloture] = useState("");
  const [pub, setPub] = useState(true);
  const [busy, setBusy] = useState(false);
  const create = async () => {
    const options = opts.split("\n").map((s) => s.trim()).filter(Boolean);
    if (question.trim().length < 5) return notify("La question est trop courte.", "error");
    if (options.length < 2 || options.length > 10) return notify("Indiquez entre 2 et 10 réponses possibles, une par ligne.", "error");
    setBusy(true);
    const { data, error } = await sb.from("sondages").insert({ question: question.trim(), options, cloture: cloture || null, resultats_publics: pub }).select().single();
    setBusy(false);
    if (error) return notify("Création impossible : " + error.message, "error");
    setSondages((list) => [data, ...list]);
    setQuestion(""); setOpts(""); setCloture(""); setPub(true);
    notify("Sondage publié ! Les membres le verront dans Actualités et sur l'accueil.");
  };
  const closeNow = async (s) => {
    const { data, error } = await sb.from("sondages").update({ cloture: isoOffset(-1) }).eq("id", s.id).select().single();
    if (error) return notify("Action impossible : " + error.message, "error");
    setSondages((list) => list.map((x) => (x.id === s.id ? data : x)));
    notify("Sondage clos.");
  };
  const remove = async (s) => {
    const { error } = await sb.from("sondages").delete().eq("id", s.id);
    if (error) return notify("Suppression impossible : " + error.message, "error");
    setSondages((list) => list.filter((x) => x.id !== s.id));
    notify("Sondage supprimé.");
  };
  return (
    <div className="grid lg:grid-cols-2 gap-6">
      <Panel title="Nouveau sondage" Icon={Plus}>
        <div className="space-y-3">
          <label className="block"><span className="text-xs font-semibold text-slate-600">Question</span><input value={question} onChange={(e) => setQuestion(e.target.value)} maxLength={300} placeholder="ex. Quelle formation voulez-vous en novembre ?" className={inputCls} /></label>
          <label className="block"><span className="text-xs font-semibold text-slate-600">Réponses possibles (une par ligne, de 2 à 10)</span>
            <textarea rows={5} value={opts} onChange={(e) => setOpts(e.target.value)} placeholder={"Prise de parole\nCV & entretien\nLeadership\nAutoCAD"} className={inputCls} />
          </label>
          <label className="block"><span className="text-xs font-semibold text-slate-600">Date de clôture <span className="font-normal text-slate-400">(facultatif)</span></span><input type="date" value={cloture} onChange={(e) => setCloture(e.target.value)} className={inputCls} /></label>
          <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={pub} onChange={(e) => setPub(e.target.checked)} className="w-4 h-4 accent-orange-600" /> Montrer les résultats aux membres après leur vote</label>
          <button onClick={create} disabled={busy} className="w-full py-3 rounded-xl bg-orange-600 text-white font-semibold hover:bg-orange-700 disabled:opacity-60">{busy ? "Publication..." : "Publier le sondage"}</button>
        </div>
      </Panel>
      <Panel title={`Sondages (${sondages.length})`} Icon={Vote}>
        {sondages.length === 0 ? <p className="text-sm text-slate-500">Aucun sondage pour le moment.</p> : (
          <ul className="space-y-5">
            {sondages.map((s) => {
              const counts = countsFor(s.id) || s.options.map(() => 0);
              const total = counts.reduce((a, b) => a + b, 0);
              const open = isOpenPoll(s);
              return (
                <li key={s.id} className="p-4 rounded-2xl border border-slate-200">
                  <div className="flex items-start justify-between gap-2">
                    <p className="font-semibold text-slate-900">{s.question}</p>
                    <span className={`flex-shrink-0 text-xs px-2 py-0.5 rounded-full font-semibold ${open ? "bg-emerald-100 text-emerald-700" : "bg-slate-200 text-slate-600"}`}>{open ? "Ouvert" : "Clos"}</span>
                  </div>
                  <div className="mt-3 space-y-2">
                    {s.options.map((o, i) => {
                      const p = total ? Math.round((counts[i] * 100) / total) : 0;
                      return (
                        <div key={i}>
                          <div className="flex justify-between text-xs"><span className="text-slate-700">{o}</span><span className="font-semibold">{counts[i]} · {p} %</span></div>
                          <div className="mt-1 h-1.5 rounded-full bg-slate-100 overflow-hidden"><div className="h-full rounded-full bg-orange-500" style={{ width: `${p}%` }} /></div>
                        </div>
                      );
                    })}
                  </div>
                  <div className="flex flex-wrap items-center justify-between gap-2 mt-3">
                    <span className="text-xs text-slate-500">{total} vote{total > 1 ? "s" : ""}{s.cloture && ` · clôture ${fmtDate(s.cloture)}`}{!s.resultats_publics && " · résultats privés"}</span>
                    <div className="flex gap-1">
                      {open && <ConfirmButton onConfirm={() => closeNow(s)} confirmLabel="Clore ?" className="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-white border border-slate-300 text-slate-600">Clore</ConfirmButton>}
                      <ConfirmButton onConfirm={() => remove(s)} confirmLabel="Supprimer ?" ariaLabel="Supprimer le sondage" className="p-1.5 rounded-lg text-rose-600 hover:bg-rose-50"><Trash2 size={15} /></ConfirmButton>
                    </div>
                  </div>
                </li>
              );
            })}
          </ul>
        )}
      </Panel>
    </div>
  );
}

const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const linesToList = (s) => String(s || "").split("\n").map((x) => x.trim()).filter(Boolean);

const SaveBar = ({ busy, onSave, onReset, resetLabel = "Revenir aux valeurs de config.js" }) => (
  <div className="flex flex-col sm:flex-row justify-end gap-2">
    {onReset && <ConfirmButton onConfirm={onReset} confirmLabel="Rétablir ?" className="px-5 py-3 rounded-xl bg-white border border-slate-300 text-sm font-semibold text-slate-600 hover:text-rose-600">{resetLabel}</ConfirmButton>}
    <button onClick={onSave} disabled={busy} className="px-6 py-3 rounded-xl bg-orange-600 text-white font-semibold hover:bg-orange-700 disabled:opacity-60">{busy ? "Enregistrement..." : "Enregistrer"}</button>
  </div>
);

function SettingsManager({ settings, saveSettings, notify }) {
  const [sec, setSec] = useState("bureau");
  const cur = (k) => copy(k in settings && settings[k] !== null ? settings[k] : DEFAULTS[k]);
  // Prépare une modification. Une valeur identique à l'origine est supprimée de la base ; rien n'est envoyé si rien ne change.
  const change = (key, val, def) => {
    const want = same(val, def) ? null : val;
    const now = key in settings ? settings[key] : null;
    return same(want, now) ? null : [key, want];
  };
  const commit = async (entries, msg) => {
    const list = entries.filter(Boolean);
    if (!list.length) { notify("Aucune modification à enregistrer."); return true; }
    const ok = await saveSettings(list);
    if (ok) notify(msg);
    return ok;
  };
  const resetKeys = (keys, msg) => commit(keys.map((k) => (k in settings ? [k, null] : null)), msg);
  const props = { settings, cur, change, commit, resetKeys, notify };
  const secs = [["bureau", "Bureau & président", Users], ["textes", "Textes des pages", Pencil], ["contact", "Coordonnées", Phone], ["listes", "Listes", FileText]];
  return (
    <div className="space-y-6">
      <div className="rounded-2xl bg-sky-50 border border-sky-200 p-5 flex gap-3 text-sm text-sky-900">
        <Info size={20} className="flex-shrink-0 text-sky-600 mt-0.5" />
        <p>Les modifications sont visibles immédiatement par tous les visiteurs. Les valeurs d'origine restent dans le fichier config.js et les textes d'origine dans le site : vous pouvez y revenir à tout moment.</p>
      </div>
      <div className="flex flex-wrap gap-2">
        {secs.map(([k, l, I]) => (
          <button key={k} onClick={() => setSec(k)} className={`flex items-center gap-2 px-4 py-2 rounded-full text-sm font-semibold transition ${sec === k ? "bg-slate-900 text-white" : "bg-white shadow-sm text-slate-600 hover:text-orange-600"}`}><I size={15} /> {l}</button>
        ))}
      </div>
      {sec === "bureau" && <BureauSettings {...props} />}
      {sec === "textes" && <div className="space-y-6">{TEXT_GROUPS.map((g) => <TextGroup key={g.titre} g={g} {...props} />)}</div>}
      {sec === "contact" && <ContactSettings {...props} />}
      {sec === "listes" && <ListsSettings {...props} />}
    </div>
  );
}

function BureauSettings({ cur, change, commit, resetKeys, notify }) {
  const [s, setS] = useState(() => ({ mandat: cur("MANDAT"), pres: cur("PRESIDENT"), bureau: cur("BUREAU") }));
  const [busy, setBusy] = useState(false);
  const setBureau = (fn) => setS((x) => ({ ...x, bureau: fn(x.bureau) }));
  const editDept = (i, fn) => setBureau((b) => b.map((d, j) => (j === i ? fn(d) : d)));
  const setMember = (i, j, pos, v) => editDept(i, (d) => ({ ...d, members: d.members.map((m, y) => (y !== j ? m : pos === 0 ? [v, m[1]] : [m[0], v])) }));
  const moveDept = (i, dir) => setBureau((b) => { const j = i + dir; if (j < 0 || j >= b.length) return b; const n = [...b]; [n[i], n[j]] = [n[j], n[i]]; return n; });
  const names = s.bureau.flatMap((d) => d.members.map(([n]) => String(n).trim())).filter(Boolean);
  const save = async () => {
    const bureau = s.bureau
      .map((d) => ({ dept: String(d.dept).trim(), members: d.members.map(([n, r]) => [String(n).trim(), String(r).trim()]).filter(([n]) => n) }))
      .filter((d) => d.dept && d.members.length);
    const pres = { name: String(s.pres.name || "").trim(), message: String(s.pres.message || "").trim() };
    if (!pres.name) return notify("Indiquez le nom du président.", "error");
    if (!bureau.length) return notify("Le bureau doit contenir au moins un département avec un membre.", "error");
    setBusy(true);
    await commit([change("MANDAT", String(s.mandat).trim(), DEFAULTS.MANDAT), change("PRESIDENT", pres, DEFAULTS.PRESIDENT), change("BUREAU", bureau, DEFAULTS.BUREAU)], "Bureau et président enregistrés.");
    setBusy(false);
  };
  const reset = async () => {
    setBusy(true);
    const ok = await resetKeys(["MANDAT", "PRESIDENT", "BUREAU"], "Bureau du fichier config.js rétabli.");
    setBusy(false);
    if (ok) setS({ mandat: DEFAULTS.MANDAT, pres: copy(DEFAULTS.PRESIDENT), bureau: copy(DEFAULTS.BUREAU) });
  };
  return (
    <div className="space-y-6">
      <Panel title="Mandat et président" Icon={Award}>
        <div className="grid sm:grid-cols-2 gap-4">
          <label className="block"><span className="text-xs font-semibold text-slate-600">Mandat</span><input value={s.mandat} onChange={(e) => setS({ ...s, mandat: e.target.value })} placeholder="ex. 2027-2028" className={inputCls} /></label>
          <label className="block"><span className="text-xs font-semibold text-slate-600">Nom du président</span><input list="noms-bureau" value={s.pres.name || ""} onChange={(e) => setS({ ...s, pres: { ...s.pres, name: e.target.value } })} className={inputCls} /></label>
        </div>
        <datalist id="noms-bureau">{names.map((n) => <option key={n} value={n} />)}</datalist>
        {s.pres.name && !names.includes(String(s.pres.name).trim()) && <p className="text-xs text-amber-700 mt-2">Ce nom n'apparaît pas dans le bureau ci-dessous : ajoutez-le (en général dans « Présidence »), écrit exactement de la même façon.</p>}
        <label className="block mt-4"><span className="text-xs font-semibold text-slate-600">Le mot du président</span>
          <textarea rows={5} value={s.pres.message || ""} onChange={(e) => setS({ ...s, pres: { ...s.pres, message: e.target.value } })} className={inputCls} />
        </label>
      </Panel>
      <Panel title="Bureau exécutif" Icon={Users} action={<button onClick={() => setBureau((b) => [...b, { dept: "", members: [["", ""]] }])} className="px-4 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold flex items-center gap-1"><Plus size={16} /> Département</button>}>
        <p className="text-sm text-slate-500 -mt-3 mb-5">Les photos sont liées au nom de chaque membre : si vous changez un nom, ajoutez de nouveau sa photo dans « Images & logos ».</p>
        <div className="space-y-4">
          {s.bureau.map((d, i) => (
            <div key={i} className="p-4 rounded-2xl border border-slate-200">
              <div className="flex gap-2 items-center">
                <input value={d.dept} onChange={(e) => editDept(i, (x) => ({ ...x, dept: e.target.value }))} placeholder="Nom du département" className={inputCls + " mt-0 font-semibold"} />
                <button onClick={() => moveDept(i, -1)} disabled={i === 0} aria-label="Monter" title="Monter" className="p-2 rounded-lg text-slate-500 hover:bg-slate-100 disabled:opacity-30"><ArrowUp size={16} /></button>
                <button onClick={() => moveDept(i, 1)} disabled={i === s.bureau.length - 1} aria-label="Descendre" title="Descendre" className="p-2 rounded-lg text-slate-500 hover:bg-slate-100 disabled:opacity-30"><ArrowDown size={16} /></button>
                <ConfirmButton onConfirm={() => setBureau((b) => b.filter((_, j) => j !== i))} confirmLabel="Retirer ?" ariaLabel="Retirer le département" className="p-2 rounded-lg text-rose-600 hover:bg-rose-50"><Trash2 size={16} /></ConfirmButton>
              </div>
              <div className="mt-3 space-y-2">
                {d.members.map(([n, r], j) => (
                  <div key={j} className="grid grid-cols-[1fr_1fr_auto] gap-2">
                    <input value={n} onChange={(e) => setMember(i, j, 0, e.target.value)} placeholder="NOM Prénom" className={inputCls + " mt-0"} />
                    <input value={r} onChange={(e) => setMember(i, j, 1, e.target.value)} placeholder="Fonction" className={inputCls + " mt-0"} />
                    <button onClick={() => editDept(i, (x) => ({ ...x, members: x.members.filter((_, y) => y !== j) }))} aria-label="Retirer ce membre" title="Retirer ce membre" className="p-2 rounded-lg text-rose-600 hover:bg-rose-50"><X size={16} /></button>
                  </div>
                ))}
                <button onClick={() => editDept(i, (x) => ({ ...x, members: [...x.members, ["", ""]] }))} className="text-sm text-orange-600 font-semibold flex items-center gap-1"><Plus size={15} /> Ajouter un membre</button>
              </div>
            </div>
          ))}
        </div>
      </Panel>
      <SaveBar busy={busy} onSave={save} onReset={reset} />
    </div>
  );
}

function TextGroup({ g, settings, change, commit, resetKeys }) {
  const current = (k) => { const v = settings["texte:" + k]; return typeof v === "string" && v.trim() ? v : TEXT_DEFAULTS[k]; };
  const [vals, setVals] = useState(() => Object.fromEntries(g.champs.map(([k]) => [k, current(k)])));
  const [busy, setBusy] = useState(false);
  const save = async () => {
    setBusy(true);
    await commit(g.champs.map(([k]) => change("texte:" + k, String(vals[k] || "").trim() || TEXT_DEFAULTS[k], TEXT_DEFAULTS[k])), `Textes enregistrés : ${g.titre}.`);
    setBusy(false);
  };
  const reset = async () => {
    setBusy(true);
    const ok = await resetKeys(g.champs.map(([k]) => "texte:" + k), `Textes d'origine rétablis : ${g.titre}.`);
    setBusy(false);
    if (ok) setVals(Object.fromEntries(g.champs.map(([k]) => [k, TEXT_DEFAULTS[k]])));
  };
  return (
    <Panel title={g.titre} Icon={Pencil}>
      <div className="space-y-4">
        {g.champs.map(([k, label, , long]) => (
          <label key={k} className="block">

            {long
              ? <textarea rows={["apropos.histoire", "accueil.atouts", "apropos.ecoles", "apropos.calendrier"].includes(k) ? 7 : 3} value={vals[k]} onChange={(e) => setVals({ ...vals, [k]: e.target.value })} className={inputCls} />
              : <input value={vals[k]} onChange={(e) => setVals({ ...vals, [k]: e.target.value })} className={inputCls} />}
          </label>
        ))}
        <p className="text-xs text-slate-500">Un champ laissé vide reprend son texte d'origine.</p>
        <SaveBar busy={busy} onSave={save} onReset={reset} resetLabel="Revenir aux textes d'origine" />
      </div>
    </Panel>
  );
}

function ContactSettings({ cur, change, commit, resetKeys, notify }) {
  const [c, setC] = useState(() => cur("CONTACT"));
  const [annee, setAnnee] = useState(() => String(cur("ANNEE_CREATION")));
  const [busy, setBusy] = useState(false);
  const set = (k) => (e) => setC({ ...c, [k]: e.target.value });
  const save = async () => {
    const v = { adresse: String(c.adresse || "").trim(), email: String(c.email || "").trim(), telephone: String(c.telephone || "").trim(), facebook: String(c.facebook || "").trim() };
    if (v.email && !EMAIL_RE.test(v.email)) return notify("Adresse email invalide.", "error");
    if (v.facebook && !/^https?:\/\//i.test(v.facebook)) return notify("Le lien Facebook doit commencer par https://", "error");
    const y = Number(annee);
    if (!Number.isInteger(y) || y < 1900 || y > new Date().getFullYear()) return notify("Année de création invalide.", "error");
    setBusy(true);
    await commit([change("CONTACT", v, DEFAULTS.CONTACT), change("ANNEE_CREATION", y, DEFAULTS.ANNEE_CREATION)], "Coordonnées enregistrées.");
    setBusy(false);
  };
  const reset = async () => {
    setBusy(true);
    const ok = await resetKeys(["CONTACT", "ANNEE_CREATION"], "Coordonnées du fichier config.js rétablies.");
    setBusy(false);
    if (ok) { setC(copy(DEFAULTS.CONTACT)); setAnnee(String(DEFAULTS.ANNEE_CREATION)); }
  };
  return (
    <div className="space-y-6">
      <Panel title="Coordonnées" Icon={Phone}>
        <p className="text-sm text-slate-500 -mt-3 mb-5">Affichées sur la page Contact et dans le pied de page. Laissez un champ vide pour masquer la ligne.</p>
        <div className="grid sm:grid-cols-2 gap-4">
          <label className="block"><span className="text-xs font-semibold text-slate-600">Adresse</span><input value={c.adresse || ""} onChange={set("adresse")} className={inputCls} /></label>
          <label className="block"><span className="text-xs font-semibold text-slate-600">Email</span><input type="email" value={c.email || ""} onChange={set("email")} placeholder="ex. cge.arstm@gmail.com" className={inputCls} /></label>
          <label className="block"><span className="text-xs font-semibold text-slate-600">Téléphone</span><input value={c.telephone || ""} onChange={set("telephone")} placeholder="+225 ..." className={inputCls} /></label>
          <label className="block"><span className="text-xs font-semibold text-slate-600">Page Facebook</span><input value={c.facebook || ""} onChange={set("facebook")} placeholder="https://www.facebook.com/..." className={inputCls} /></label>
          <label className="block"><span className="text-xs font-semibold text-slate-600">Année de création de la CGE</span><input value={annee} onChange={(e) => setAnnee(e.target.value)} className={inputCls} /></label>
        </div>
      </Panel>
      <SaveBar busy={busy} onSave={save} onReset={reset} />
    </div>
  );
}

const LIST_FIELDS = [
  ["FILIERES", "Filières", "Profils des membres, inscription et bandeau défilant de l'accueil."],
  ["DOMAINES", "Domaines des opportunités", "Filtre « domaine » de la page Opportunités."],
  ["ZONES", "Zones des opportunités", "Filtre « zone » de la page Opportunités."],
  ["NEWS_CATEGORIES", "Catégories d'actualités", "Choix proposés lors de la publication d'une actualité."],
  ["DOC_CATEGORIES", "Catégories de documents", "Classement des documents de la médiathèque."],
  ["DEPARTEMENTS", "Départements de la CGE", "Rattachement des membres (onglet Adhésions → Membres CGE) et cotisations par département."],
];

function ListsSettings({ cur, change, commit, resetKeys, notify }) {
  const [vals, setVals] = useState(() => Object.fromEntries(LIST_FIELDS.map(([k]) => [k, cur(k).join("\n")])));
  const [busy, setBusy] = useState(false);
  const save = async () => {
    const empty = LIST_FIELDS.find(([k]) => !linesToList(vals[k]).length);
    if (empty) return notify(`La liste « ${empty[1]} » ne peut pas être vide.`, "error");
    setBusy(true);
    await commit(LIST_FIELDS.map(([k]) => change(k, linesToList(vals[k]), DEFAULTS[k])), "Listes enregistrées.");
    setBusy(false);
  };
  const reset = async () => {
    setBusy(true);
    const ok = await resetKeys(LIST_FIELDS.map(([k]) => k), "Listes du fichier config.js rétablies.");
    setBusy(false);
    if (ok) setVals(Object.fromEntries(LIST_FIELDS.map(([k]) => [k, DEFAULTS[k].join("\n")])));
  };
  return (
    <div className="space-y-6">
      <div className="rounded-2xl bg-amber-50 border border-amber-200 p-4 text-sm text-amber-900">Une valeur par ligne. Renommer une valeur ne change pas les contenus déjà enregistrés (profils, offres, documents…).</div>
      <div className="grid md:grid-cols-2 gap-6">
        {LIST_FIELDS.map(([k, label, hint]) => (
          <Panel key={k} title={label} Icon={FileText}>
            <p className="text-sm text-slate-500 -mt-3 mb-3">{hint}</p>
            <textarea rows={8} value={vals[k]} onChange={(e) => setVals({ ...vals, [k]: e.target.value })} className={inputCls} />
          </Panel>
        ))}
      </div>
      <SaveBar busy={busy} onSave={save} onReset={reset} />
    </div>
  );
}
