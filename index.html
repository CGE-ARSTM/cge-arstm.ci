            <div className="mb-5 p-4 rounded-2xl bg-orange-50 border border-orange-100">
              <p className="text-sm font-semibold text-slate-900 mb-2">Ajouter une personne</p>
              <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Nom, matricule ou département..." className={inputCls + " mt-0"} />
              {trouves.length > 0 && <ul className="mt-2 space-y-1">{trouves.map((p) => <li key={p.id} className="flex justify-between items-center gap-2 text-sm"><span>{p.nom} <span className="text-slate-500">{[p.matricule, p.departement].filter(Boolean).join(" · ")}</span></span><button onClick={() => ajouter(p)} className="px-3 py-1 rounded-lg bg-orange-600 text-white text-xs font-semibold">Ajouter</button></li>)}</ul>}
            </div>
          )}
          <FinDusTable F={F} cot={cot} />
        </Panel>
      ) : !form && <Panel title="Aucune cotisation exceptionnelle" Icon={Sparkles}><p className="text-sm text-slate-500">{F.canW ? "Créez-en une avec « Nouvelle cotisation »." : "Aucune pour le moment."}</p></Panel>}
    </div>
  );
}

function FinDons({ F }) {
  const vide = { donateur_nom: "", donateur_type: "ancien", contact: "", nature: "argent", montant: "", description: "", affectation: "", citer: false, recu: true, mode: "Espèces", date: todayISO() };
  const [form, setForm] = useState(null);
  const [fs, setFs] = useState("");
  const [busy, setBusy] = useState(false);
  const [recu, setRecu] = useState(null);
  const deb = exerciceDebut();
  const recusAn = F.dons.filter((d) => d.statut === "recu" && d.date && d.date >= deb);
  const shown = F.dons.filter((d) => !fs || d.statut === fs);
  const enregistrer = async () => {
    if (form.donateur_nom.trim().length < 2) return F.notify("Indiquez le nom du donateur.", "error");
    const montant = form.montant === "" ? null : toInt(form.montant);
    if (montant !== null && (!Number.isFinite(montant) || montant < 0)) return F.notify("Montant invalide.", "error");
    if (form.nature === "argent" && !montant) return F.notify("Indiquez le montant du don.", "error");
    if (form.nature === "nature" && form.description.trim().length < 3) return F.notify("Décrivez le don en nature.", "error");
    setBusy(true);
    const { data, error } = await sb.from("fin_dons").insert({ donateur_nom: form.donateur_nom.trim(), donateur_type: form.donateur_type, contact: form.contact.trim() || null, nature: form.nature,
      montant, description: form.description.trim() || null, affectation: form.affectation.trim() || null, citer: form.citer }).select().single();
    let err = error;
    if (!err && form.recu) err = (await sb.rpc("fin_don_recu", { d_id: data.id, mode_paiement: form.nature === "argent" ? form.mode : null, le: form.date || null })).error;
    setBusy(false);
    if (err) return F.notify("Enregistrement impossible : " + err.message, "error");
    F.notify(form.recu ? "Don enregistré et entré en caisse. Merci au donateur !" : "Don enregistré, à confirmer à la réception."); setForm(null); F.reload();
  };
  const confirmer = async (d, mode) => {
    const { data, error } = await sb.rpc("fin_don_recu", { d_id: d.id, mode_paiement: mode, le: todayISO() });
    if (error) return F.notify(error.message, "error");
    F.notify(`Don confirmé · reçu n° ${data}`); F.reload();
  };
  const annuler = async (d) => {
    const { error } = await sb.rpc("fin_don_annuler", { d_id: d.id });
    if (error) return F.notify(error.message, "error");
    F.notify("Don annulé."); F.reload();
  };
  const toggleCiter = async (d) => {
    const { error } = await sb.from("fin_dons").update({ citer: !d.citer }).eq("id", d.id);
    if (error) return F.notify(error.message, "error");
    F.reload();
  };
  const supprimer = async (d) => {
    const { error } = await sb.from("fin_dons").delete().eq("id", d.id);
    if (error) return F.notify("Suppression impossible : " + error.message, "error");
    F.notify("Don supprimé."); F.reload();
  };
  const imprimer = (d) => { setRecu(d); setTimeout(() => window.print(), 150); };
  const btn = "px-3 py-1.5 rounded-lg text-xs font-semibold";
  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {[["Dons reçus (exercice)", recusAn.length], ["En argent (exercice)", fcfa(somme(recusAn.filter((d) => d.nature === "argent")))], ["Dons en nature (exercice)", recusAn.filter((d) => d.nature === "nature").length], ["À confirmer", F.dons.filter((d) => d.statut === "propose").length]].map(([l, v]) => (
          <div key={l} className="bg-white rounded-3xl shadow-sm p-5"><Heart size={20} className="text-orange-600" /><p className="text-2xl font-extrabold text-slate-900 mt-3">{v}</p><p className="text-sm text-slate-500">{l}</p></div>
        ))}
      </div>
      {form ? (
        <Panel title="Enregistrer un don" Icon={Heart}>
          <div className="grid sm:grid-cols-2 gap-4">
            <label className="block"><span className="text-xs font-semibold text-slate-600">Donateur</span><input value={form.donateur_nom} onChange={(e) => setForm({ ...form, donateur_nom: e.target.value })} placeholder="Nom ou raison sociale" className={inputCls} /></label>
            <label className="block"><span className="text-xs font-semibold text-slate-600">Catégorie</span><select value={form.donateur_type} onChange={(e) => setForm({ ...form, donateur_type: e.target.value })} className={inputCls}>{Object.entries(DON_TYPES).map(([k, l]) => <option key={k} value={k}>{l}</option>)}</select></label>
            <label className="block"><span className="text-xs font-semibold text-slate-600">Contact (facultatif)</span><input value={form.contact} onChange={(e) => setForm({ ...form, contact: e.target.value })} placeholder="Téléphone ou email" className={inputCls} /></label>
            <label className="block"><span className="text-xs font-semibold text-slate-600">Affectation (facultatif)</span><input value={form.affectation} onChange={(e) => setForm({ ...form, affectation: e.target.value })} placeholder="ex. Gala, aide aux élèves..." className={inputCls} /></label>
          </div>
          <div className="flex gap-2 mt-4">{[["argent", "Don en argent"], ["nature", "Don en nature"]].map(([k, l]) => <button key={k} type="button" onClick={() => setForm({ ...form, nature: k })} className={`px-4 py-2 rounded-xl text-sm border ${form.nature === k ? "border-orange-500 bg-orange-50 text-orange-800 font-semibold" : "border-slate-300 text-slate-600"}`}>{l}</button>)}</div>
          <div className="grid sm:grid-cols-2 gap-4 mt-3">
            <label className="block"><span className="text-xs font-semibold text-slate-600">{form.nature === "argent" ? "Montant (FCFA)" : "Valeur estimée (FCFA, facultatif)"}</span><input value={form.montant} onChange={(e) => setForm({ ...form, montant: e.target.value })} className={inputCls} /></label>
            <label className="block"><span className="text-xs font-semibold text-slate-600">Description {form.nature === "argent" && "(facultatif)"}</span><input value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} placeholder={form.nature === "nature" ? "ex. 50 t-shirts imprimés" : ""} className={inputCls} /></label>
          </div>
          <div className="mt-4 space-y-2">
            <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={form.citer} onChange={(e) => setForm({ ...form, citer: e.target.checked })} className="accent-orange-600" /> Le donateur accepte d'être cité dans « Ils nous soutiennent » (le montant n'est jamais affiché)</label>
            <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={form.recu} onChange={(e) => setForm({ ...form, recu: e.target.checked })} className="accent-orange-600" /> Don déjà reçu (entre dans la caisse et reçoit un numéro de reçu)</label>
          </div>
          {form.recu && (
            <div className="flex flex-wrap items-end gap-3 mt-3">
              {form.nature === "argent" && <div className="flex gap-1.5">{MODES.map((m) => <button key={m} type="button" onClick={() => setForm({ ...form, mode: m })} className={`px-3 py-1.5 rounded-lg text-xs font-semibold border ${form.mode === m ? "border-orange-500 bg-orange-50 text-orange-700" : "border-slate-300 text-slate-600"}`}>{m}</button>)}</div>}
              <label className="block"><span className="text-xs font-semibold text-slate-600">Date de réception</span><input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className={inputCls} /></label>
            </div>
          )}
          <div className="flex justify-end gap-2 mt-5">
            <button onClick={() => setForm(null)} className="px-4 py-2.5 rounded-xl bg-white border border-slate-300 text-sm">Annuler</button>
            <button onClick={enregistrer} disabled={busy} className="px-5 py-2.5 rounded-xl bg-orange-600 text-white text-sm font-semibold disabled:opacity-60">{busy ? "Enregistrement..." : "Enregistrer le don"}</button>
          </div>
        </Panel>
      ) : (
        <div className="flex flex-wrap gap-2">
          {F.canW && <button onClick={() => setForm({ ...vide })} className="px-4 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold flex items-center gap-1"><Plus size={15} /> Enregistrer un don</button>}
          {[["", "Tous"], ...Object.entries(DON_STATUTS).map(([k, [l]]) => [k, l])].map(([k, l]) => <button key={k} onClick={() => setFs(k)} className={`px-4 py-2 rounded-full text-sm font-semibold ${fs === k ? "bg-slate-900 text-white" : "bg-white shadow-sm text-slate-600"}`}>{l}</button>)}
        </div>
      )}
      <Panel title={`Dons (${shown.length})`} Icon={Heart}>
        {shown.length === 0 ? <p className="text-sm text-slate-500">Aucun don.</p> : (
          <ul className="divide-y divide-slate-100">
            {shown.map((d) => (
              <li key={d.id} className="py-3 flex flex-col md:flex-row md:items-center justify-between gap-2">
                <div className="min-w-0">
                  <p className="font-semibold text-slate-900 flex flex-wrap items-center gap-2">{d.donateur_nom}
                    <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${DON_STATUTS[d.statut][1]}`}>{DON_STATUTS[d.statut][0]}</span>
                    {d.numero_recu && <span className="text-xs px-2 py-0.5 rounded-full bg-slate-900 text-white">{d.numero_recu}</span>}
                    {d.citer && <span className="text-xs px-2 py-0.5 rounded-full bg-sky-100 text-sky-700">cité publiquement</span>}
                  </p>
                  <p className="text-xs text-slate-500">{[DON_TYPES[d.donateur_type], d.nature === "argent" ? fcfa(d.montant) : `En nature${d.montant ? ` · valeur ${fcfa(d.montant)}` : ""}`, d.affectation && `pour : ${d.affectation}`, d.date ? `reçu le ${fmtDate(d.date)}` : `proposé le ${fmtDate(d.created_at)}`].filter(Boolean).join(" · ")}</p>
                  {(d.description || d.contact) && <p className="text-xs text-slate-600 mt-0.5">{[d.description, d.contact].filter(Boolean).join(" · ")}</p>}
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {F.canW && d.statut === "propose" && (d.nature === "argent"
                    ? ["Espèces", "Mobile Money"].map((m) => <ConfirmButton key={m} onConfirm={() => confirmer(d, m)} confirmLabel="Confirmer ?" className={btn + " bg-emerald-600 text-white"}>Reçu · {m}</ConfirmButton>)
                    : <ConfirmButton onConfirm={() => confirmer(d, null)} confirmLabel="Confirmer ?" className={btn + " bg-emerald-600 text-white"}>Don reçu</ConfirmButton>)}
                  {d.statut === "recu" && <button onClick={() => imprimer(d)} className={btn + " bg-white border border-slate-300 text-slate-700 flex items-center gap-1"}><Printer size={13} /> Reçu de don</button>}
                  {F.canW && d.statut !== "annule" && <button onClick={() => toggleCiter(d)} className={btn + " bg-white border border-slate-300 text-slate-700"}>{d.citer ? "Ne plus citer" : "Citer publiquement"}</button>}
                  {F.canW && d.statut === "recu" && <ConfirmButton onConfirm={() => annuler(d)} confirmLabel="Annuler ?" className={btn + " bg-white border border-slate-300 text-rose-600"}>Annuler</ConfirmButton>}
                  {F.canW && d.statut !== "recu" && <ConfirmButton onConfirm={() => supprimer(d)} confirmLabel="Supprimer ?" ariaLabel="Supprimer le don" className="p-1.5 rounded-lg text-rose-600 hover:bg-rose-50"><Trash2 size={15} /></ConfirmButton>}
                </div>
              </li>
            ))}
          </ul>
        )}
      </Panel>
      {recu && (
        <div className="cv-print hidden print:block p-10 bg-white text-slate-900">
          <div className="flex items-center gap-4 border-b-2 border-orange-500 pb-4">
            <Logo size="w-20 h-20" />

          </div>
          <h1 className="text-3xl font-extrabold mt-8">Reçu de don n° {recu.numero_recu}</h1>
          <p className="mt-6 text-lg">La CGE section ARSTM reconnaît avoir reçu de <strong>{recu.donateur_nom}</strong>{recu.date && <>, le <strong>{fmtDate(recu.date)}</strong></>} :</p>
          <p className="mt-4 text-2xl font-extrabold">{recu.nature === "argent" ? fcfa(recu.montant) : `Don en nature : ${recu.description || ""}${recu.montant ? ` (valeur estimée ${fcfa(recu.montant)})` : ""}`}</p>
          {recu.nature === "argent" && recu.description && <p className="mt-2">{recu.description}</p>}
          {recu.affectation && <p className="mt-2">Affectation : {recu.affectation}</p>}
          <p className="mt-8">Le bureau de la CGE section ARSTM remercie chaleureusement le donateur pour son soutien aux élèves de l'Académie.</p>
          <div className="mt-16 grid grid-cols-2 gap-10 text-sm"><div><p>Fait à Abidjan, le {fmtDate(todayISO())}</p></div><div className="text-right"><p className="font-semibold">La Trésorerie Générale</p><p className="mt-12">Signature et cachet</p></div></div>
        </div>
      )}
    </div>
  );
}

function FinCaisse({ F }) {
  const cats = (F.params.categories && F.params.categories.length) ? F.params.categories : ["Autre"];
  const vide = { sens: "sortie", date: todayISO(), montant: "", categorie: cats[0], libelle: "", tiers: "", mode: "Espèces", note: "", fichier: null };
  const [form, setForm] = useState(null);
  const [fl, setFl] = useState({ sens: "", cat: "", du: "", au: "", q: "" });
  const [busy, setBusy] = useState(false);
  const shown = F.mvt.filter((m) => (!fl.sens || m.sens === fl.sens) && (!fl.cat || m.categorie === fl.cat) && (!fl.du || m.date >= fl.du) && (!fl.au || m.date <= fl.au)
    && (!fl.q || [m.libelle, m.tiers, m.note, m.categorie].join(" ").toLowerCase().includes(fl.q.toLowerCase())));
  const e = somme(shown.filter((m) => m.sens === "entree")), s = somme(shown.filter((m) => m.sens === "sortie"));
  const categoriesVues = [...new Set(F.mvt.map((m) => m.categorie).filter(Boolean))].sort();
  const enregistrer = async () => {
    const montant = toInt(form.montant);
    if (!Number.isFinite(montant) || montant <= 0) return F.notify("Montant invalide.", "error");
    if (form.libelle.trim().length < 3) return F.notify("Décrivez l'opération (libellé).", "error");
    setBusy(true);
    let path = null;
    if (form.fichier) {
      const f = form.fichier;
      if (f.size > 5 * 1048576) { setBusy(false); return F.notify("Justificatif trop lourd (5 Mo maximum).", "error"); }
      let blob = f, ext = "pdf";
      if (f.type && f.type.startsWith("image/")) { blob = await compressImage(f, 1600, 0.85); ext = blob.type === "image/png" ? "png" : "jpg"; }
      path = `${Date.now()}-${slugify(form.libelle).slice(0, 40) || "justificatif"}.${ext}`;
      const { error } = await sb.storage.from("justificatifs").upload(path, blob, { contentType: blob.type || "application/pdf" });
      if (error) { setBusy(false); return F.notify("Envoi du justificatif impossible : " + error.message, "error"); }
    }
    const { error } = await sb.from("fin_mouvements").insert({ sens: form.sens, date: form.date || todayISO(), montant, categorie: form.categorie || null, libelle: form.libelle.trim(),
      tiers: form.tiers.trim() || null, mode: form.mode, note: form.note.trim() || null, justificatif_path: path });
    setBusy(false);
    if (error) return F.notify("Enregistrement impossible : " + error.message, "error");
    F.notify(form.sens === "sortie" ? "Dépense enregistrée." : "Recette enregistrée."); setForm(null); F.reload();
  };
  const supprimer = async (m) => {
    const { error } = await sb.from("fin_mouvements").delete().eq("id", m.id);
    if (error) return F.notify("Suppression impossible : " + error.message, "error");
    if (m.justificatif_path) await sb.storage.from("justificatifs").remove([m.justificatif_path]);
    F.notify("Opération supprimée."); F.reload();
  };
  const exporter = () => exportCSV(`caisse-cge-arstm-${todayISO()}.csv`, [["Date", "Sens", "Montant (FCFA)", "Catégorie", "Libellé", "Tiers", "Mode", "Note"],
    ...shown.map((m) => [m.date, m.sens === "entree" ? "Entrée" : "Sortie", m.montant, m.categorie, m.libelle, m.tiers, m.mode, m.note])]);
  const automatique = (m) => m.du_id || m.don_id || m.adhesion_id;
  return (
    <div className="space-y-6">
      {form ? (
        <Panel title={form.sens === "sortie" ? "Nouvelle dépense" : "Nouvelle recette"} Icon={FileText}>
          <div className="flex gap-2 mb-4">{[["sortie", "Dépense"], ["entree", "Autre recette"]].map(([k, l]) => <button key={k} type="button" onClick={() => setForm({ ...form, sens: k, categorie: k === "sortie" ? cats[0] : "Autres recettes" })} className={`px-4 py-2 rounded-xl text-sm border ${form.sens === k ? "border-orange-500 bg-orange-50 text-orange-800 font-semibold" : "border-slate-300 text-slate-600"}`}>{l}</button>)}</div>
          <div className="grid sm:grid-cols-3 gap-4">
            <label className="block"><span className="text-xs font-semibold text-slate-600">Date</span><input type="date" value={form.date} onChange={(ev) => setForm({ ...form, date: ev.target.value })} className={inputCls} /></label>
            <label className="block"><span className="text-xs font-semibold text-slate-600">Montant (FCFA)</span><input value={form.montant} onChange={(ev) => setForm({ ...form, montant: ev.target.value })} className={inputCls} /></label>
            <label className="block"><span className="text-xs font-semibold text-slate-600">Catégorie</span>
              {form.sens === "sortie"
                ? <select value={form.categorie} onChange={(ev) => setForm({ ...form, categorie: ev.target.value })} className={inputCls}>{cats.map((c) => <option key={c}>{c}</option>)}</select>
                : <input list="cat-recettes" value={form.categorie} onChange={(ev) => setForm({ ...form, categorie: ev.target.value })} className={inputCls} />}
              <datalist id="cat-recettes">{["Autres recettes", "Subventions", "Ventes", "Partenariats"].map((c) => <option key={c} value={c} />)}</datalist>
            </label>
            <label className="block sm:col-span-2"><span className="text-xs font-semibold text-slate-600">Libellé</span><input value={form.libelle} onChange={(ev) => setForm({ ...form, libelle: ev.target.value })} placeholder={form.sens === "sortie" ? "ex. Location de sono pour le gala" : "ex. Vente de t-shirts"} className={inputCls} /></label>
            <label className="block"><span className="text-xs font-semibold text-slate-600">{form.sens === "sortie" ? "Bénéficiaire / fournisseur" : "Payeur"}</span><input value={form.tiers} onChange={(ev) => setForm({ ...form, tiers: ev.target.value })} className={inputCls} /></label>
          </div>
          <div className="flex flex-wrap gap-1.5 mt-4">{MODES.map((m) => <button key={m} type="button" onClick={() => setForm({ ...form, mode: m })} className={`px-3 py-1.5 rounded-lg text-xs font-semibold border ${form.mode === m ? "border-orange-500 bg-orange-50 text-orange-700" : "border-slate-300 text-slate-600"}`}>{m}</button>)}</div>
          <input value={form.note} onChange={(ev) => setForm({ ...form, note: ev.target.value })} placeholder="Note (facultatif)" className={inputCls + " mt-4"} />
          <label className="mt-4 flex flex-wrap items-center gap-3 text-sm">
            <span className="px-4 py-2 rounded-xl bg-white border border-slate-300 font-semibold cursor-pointer flex items-center gap-2"><Upload size={15} /> {form.fichier ? "Changer le justificatif" : "Ajouter un justificatif (facultatif)"}</span>
            <span className="text-slate-500 truncate">{form.fichier ? form.fichier.name : "Photo de la facture ou du reçu, ou PDF"}</span>
            <input type="file" accept="image/*,application/pdf" className="hidden" onChange={(ev) => { const f = ev.target.files && ev.target.files[0]; ev.target.value = ""; if (f) setForm({ ...form, fichier: f }); }} />
          </label>
          <div className="flex justify-end gap-2 mt-5">
            <button onClick={() => setForm(null)} className="px-4 py-2.5 rounded-xl bg-white border border-slate-300 text-sm">Annuler</button>
            <button onClick={enregistrer} disabled={busy} className="px-5 py-2.5 rounded-xl bg-orange-600 text-white text-sm font-semibold disabled:opacity-60">{busy ? "Enregistrement..." : "Enregistrer"}</button>
          </div>
        </Panel>
      ) : F.canW && (
        <div className="flex flex-wrap gap-2">
          <button onClick={() => setForm({ ...vide })} className="px-4 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold flex items-center gap-1"><Plus size={15} /> Nouvelle dépense</button>
          <button onClick={() => setForm({ ...vide, sens: "entree", categorie: "Autres recettes" })} className="px-4 py-2 rounded-xl bg-white border border-slate-300 text-sm font-semibold flex items-center gap-1"><Plus size={15} /> Autre recette</button>
        </div>
      )}
      <Panel title="Toutes les opérations" Icon={FileText} action={<button onClick={exporter} className="px-3 py-2 rounded-xl bg-white border border-slate-300 text-xs font-semibold flex items-center gap-1"><Download size={14} /> Export Excel</button>}>
        <div className="grid sm:grid-cols-5 gap-2 mb-4">
          <select value={fl.sens} onChange={(ev) => setFl({ ...fl, sens: ev.target.value })} className={inputCls + " mt-0"}><option value="">Entrées et sorties</option><option value="entree">Entrées</option><option value="sortie">Sorties</option></select>
          <select value={fl.cat} onChange={(ev) => setFl({ ...fl, cat: ev.target.value })} className={inputCls + " mt-0"}><option value="">Toutes catégories</option>{categoriesVues.map((c) => <option key={c}>{c}</option>)}</select>
          <input type="date" value={fl.du} onChange={(ev) => setFl({ ...fl, du: ev.target.value })} title="Du" className={inputCls + " mt-0"} />

function FinParametres({ F }) {
  const [p, setP] = useState({ solde_initial: String(F.params.solde_initial ?? 0), solde_date: F.params.solde_date || "", bureau_montant: F.params.bureau_montant == null ? "" : String(F.params.bureau_montant),
    categories: (F.params.categories || []).join("\n"), bloquer_retard: !!F.params.bloquer_retard });
  const [busy, setBusy] = useState(false);
  const [rapport, setRapport] = useState(false);
  const retards = finRetards(F);
  const deb = exerciceDebut();
  const ex = F.mvt.filter((m) => m.date >= deb);
  const parCat = (sens) => Object.entries(ex.filter((m) => m.sens === sens).reduce((a, m) => { const k = m.categorie || "Autre"; a[k] = (a[k] || 0) + m.montant; return a; }, {})).sort((a, b) => b[1] - a[1]);
  const solde = (Number(F.params.solde_initial) || 0) + somme(F.mvt.filter((m) => m.sens === "entree")) - somme(F.mvt.filter((m) => m.sens === "sortie"));
  const save = async () => {
    const si = toInt(p.solde_initial), bm = p.bureau_montant === "" ? null : toInt(p.bureau_montant);
    if (!Number.isFinite(si)) return F.notify("Solde de départ invalide.", "error");
    if (bm !== null && (!Number.isFinite(bm) || bm < 0)) return F.notify("Montant du bureau invalide.", "error");
    const categories = linesToList(p.categories);
    if (!categories.length) return F.notify("Gardez au moins une catégorie de dépense.", "error");
    setBusy(true);
    const { error } = await sb.from("fin_parametres").update({ solde_initial: si, solde_date: p.solde_date || null, bureau_montant: bm, categories, bloquer_retard: p.bloquer_retard }).eq("id", 1);
    setBusy(false);
    if (error) return F.notify("Enregistrement impossible : " + error.message, "error");
    F.notify("Paramètres enregistrés."); F.reload();
  };
  const exporterRetards = () => exportCSV(`retards-cotisations-${todayISO()}.csv`, [["Nom", "Matricule", "Filière", "Département", "Reste à payer (FCFA)"],
    ...Object.entries(retards).map(([uid, r]) => { const c = F.compte(uid) || {}; return [F.nom(uid), c.matricule, c.filiere, c.departement, r]; })]);
  const imprimer = () => { setRapport(true); setTimeout(() => window.print(), 150); };
  return (
    <div className="space-y-6">
      <Panel title="Rapports" Icon={Printer}>
        <div className="flex flex-wrap gap-2">
          <button onClick={imprimer} className="px-4 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold flex items-center gap-2"><Printer size={15} /> Imprimer le récapitulatif de l'exercice</button>
          <button onClick={exporterRetards} className="px-4 py-2 rounded-xl bg-white border border-slate-300 text-sm font-semibold flex items-center gap-2"><Download size={15} /> Export Excel des retards ({Object.keys(retards).length})</button>
        </div>
        <p className="text-xs text-slate-500 mt-3">L'export de toutes les opérations se trouve dans « Caisse & dépenses ».</p>
      </Panel>
      {F.canW && (
        <Panel title="Paramètres financiers" Icon={SettingsIcon}>
          <div className="grid sm:grid-cols-3 gap-4">
            <label className="block"><span className="text-xs font-semibold text-slate-600">Solde de départ de la caisse (FCFA)</span><input value={p.solde_initial} onChange={(e) => setP({ ...p, solde_initial: e.target.value })} className={inputCls} /></label>
            <label className="block"><span className="text-xs font-semibold text-slate-600">À la date du</span><input type="date" value={p.solde_date} onChange={(e) => setP({ ...p, solde_date: e.target.value })} className={inputCls} /></label>
            <label className="block"><span className="text-xs font-semibold text-slate-600">Cotisation du bureau par mois (FCFA)</span><input value={p.bureau_montant} onChange={(e) => setP({ ...p, bureau_montant: e.target.value })} className={inputCls} /></label>
          </div>
          <label className="block mt-4"><span className="text-xs font-semibold text-slate-600">Catégories de dépenses (une par ligne)</span><textarea rows={6} value={p.categories} onChange={(e) => setP({ ...p, categories: e.target.value })} className={inputCls} /></label>
          <label className={`mt-4 flex items-start gap-3 p-4 rounded-2xl border cursor-pointer ${p.bloquer_retard ? "border-rose-300 bg-rose-50" : "border-slate-200"}`}>
            <input type="checkbox" checked={p.bloquer_retard} onChange={(e) => setP({ ...p, bloquer_retard: e.target.checked })} className="w-5 h-5 mt-0.5 accent-rose-600" />
            <span><span className="font-semibold text-slate-900 block">Bloquer les candidatures aux offres en cas de retard de cotisation</span><span className="text-xs text-slate-500">Désactivé : les retards sont seulement signalés (badge et rappel). Activé : un membre en retard ne peut plus postuler aux offres via la CGE jusqu'à régularisation.</span></span>
          </label>
          <div className="flex justify-end mt-5"><button onClick={save} disabled={busy} className="px-6 py-3 rounded-xl bg-orange-600 text-white font-semibold disabled:opacity-60">{busy ? "Enregistrement..." : "Enregistrer"}</button></div>
        </Panel>
      )}
      {rapport && (
        <div className="cv-print hidden print:block p-8 bg-white text-slate-900 text-sm">
          <div className="flex items-center gap-4 border-b-2 border-orange-500 pb-3"><Logo size="w-16 h-16" /><div><p className="text-xl font-extrabold">CGE section ARSTM · Récapitulatif financier</p><p>Exercice depuis le {fmtDate(deb)} · édité le {fmtDate(todayISO())}</p></div></div>
          <p className="mt-5 text-lg font-bold">Solde de la caisse : {fcfa(solde)}</p>
          <p>Entrées de l'exercice : {fcfa(somme(ex.filter((m) => m.sens === "entree")))} · Sorties de l'exercice : {fcfa(somme(ex.filter((m) => m.sens === "sortie")))}</p>
          {[["Entrées par catégorie", parCat("entree")], ["Sorties par catégorie", parCat("sortie")]].map(([t, l]) => (
            <div key={t} className="mt-5"><p className="font-bold border-b border-slate-300 pb-1">{t}</p>{l.length ? l.map(([k, v]) => <p key={k} className="flex justify-between py-0.5"><span>{k}</span><span>{fcfa(v)}</span></p>) : <p>Aucune.</p>}</div>
          ))}
          <div className="mt-5"><p className="font-bold border-b border-slate-300 pb-1">Cotisations en retard ({Object.keys(retards).length})</p>
            {Object.entries(retards).sort((a, b) => F.nom(a[0]).localeCompare(F.nom(b[0]))).map(([uid, r]) => <p key={uid} className="flex justify-between py-0.5"><span>{F.nom(uid)}</span><span>{fcfa(r)}</span></p>)}
          </div>
          <div className="mt-12 grid grid-cols-2 gap-10"><p>La Trésorerie Générale</p><p className="text-right">Le Commissaire aux Comptes</p></div>
        </div>
      )}
    </div>
  );
}

// COMMUNICATION : anniversaires, réussites à féliciter, agenda à promouvoir
