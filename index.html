  };
  // Diagnostic : si le site n'a pas démarré après 12 secondes, on affiche la cause probable.
  setTimeout(function () {
    if (window.__CGE_STARTED) return;
    if (!window.CGE_CONFIG) return window.__cgeConfigMissing();
    // Si la version gardée dans le navigateur pose problème : on l'efface et on recharge une seule fois.
    if (window.__CGE_CACHE) {
      try { localStorage.removeItem("cge-arstm:code"); } catch (e) {}
      if (!sessionStorage.getItem("cge-arstm:recharge")) { sessionStorage.setItem("cge-arstm:recharge", "1"); return location.reload(); }
    }
    var missing = [];
    if (!window.React) missing.push("React");
    if (!window.ReactDOM) missing.push("ReactDOM");
    if (!window.Babel && !window.__CGE_CACHE) missing.push("Babel");
    if (!window.LucideReact) missing.push("Icônes");

</script>

// Réduit une image avant l'envoi (une photo de téléphone de 5 Mo devient ~100 à 400 Ko).
const compressImage = (file, max = 700, quality = 0.85) => new Promise((resolve, reject) => {
  if (!file || !file.type || !file.type.startsWith("image/")) return reject(new Error("Ce fichier n'est pas une image."));
  if (file.size > 15 * 1048576) return reject(new Error("Image trop lourde (15 Mo maximum)."));
  const url = URL.createObjectURL(file);
  const img = new window.Image();
  img.onload = () => {
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.naturalWidth * scale));
    c.height = Math.max(1, Math.round(img.naturalHeight * scale));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const type = /png|webp|svg|gif/.test(file.type) ? "image/png" : "image/jpeg";
    c.toBlob((b) => (b ? resolve(b) : reject(new Error("Conversion de l'image impossible."))), type, quality);
  };
  img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Image illisible. Essayez une image JPG ou PNG.")); };
  img.src = url;
});

const uploadImage = async (folder, blob) => {
  const ext = blob.type === "image/png" ? "png" : "jpg";
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
  const { error } = await sb.storage.from("images").upload(path, blob, { contentType: blob.type });
  if (error) throw new Error("Envoi de l'image impossible : " + error.message);
  return { url: sb.storage.from("images").getPublicUrl(path).data.publicUrl, path };
};
const uploadPublicImage = async (folder, blob) => (await uploadImage(folder, blob)).url;

const downloadPrivate = async (bucket, path, name, notify) => {
  if (!path) return notify && notify("Fichier introuvable.", "error");
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 120, { download: name || true });
  if (error) return notify && notify("Téléchargement impossible : " + error.message, "error");
  window.location.href = data.signedUrl;
};

function useCountUp(target, duration = 1600) {
  const [v, setV] = useState(0);
  useEffect(() => {
    let raf, start;
    const step = (t) => { if (!start) start = t; const p = Math.min((t - start) / duration, 1); setV(Math.round(target * (1 - Math.pow(1 - p, 3)))); if (p < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return v;
}

function SafeImg({ src, alt, className, fallback }) {
  const [failed, setFailed] = useState(null);
  if (!src || failed === src) return fallback;
  return <img src={src} alt={alt} onError={() => setFailed(src)} className={className} loading="lazy" />;
}

// Bouton à double clic : le premier clic demande confirmation, le second exécute.
function ConfirmButton({ onConfirm, children, className = "", confirmLabel = "Confirmer ?", ariaLabel }) {
  const [armed, setArmed] = useState(false);
  useEffect(() => { if (!armed) return; const t = setTimeout(() => setArmed(false), 3000); return () => clearTimeout(t); }, [armed]);
  return armed
    ? <button onClick={() => { setArmed(false); onConfirm(); }} className="px-3 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-semibold whitespace-nowrap">{confirmLabel}</button>
    : <button onClick={() => setArmed(true)} className={className} aria-label={ariaLabel} title={ariaLabel}>{children}</button>;
}

  return (
    <div className="relative" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size / 2} cy={size / 2} r={r} stroke="#e2e8f0" strokeWidth="10" fill="none" />
        <circle cx={size / 2} cy={size / 2} r={r} stroke="#ff8a00" strokeWidth="10" fill="none" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c * (1 - pct / 100)} style={{ transition: "stroke-dashoffset .8s ease" }} />
      </svg>
      <div className="absolute inset-0 flex items-center justify-center text-2xl font-extrabold text-slate-900">{pct}%</div>

};

// Date limite d'une offre, en rouge quand elle approche.
const Deadline = ({ date }) => {
  if (!date) return <span className="text-xs text-slate-400 flex items-center gap-1"><Clock size={13} /> Sans date limite</span>;
  const left = daysUntil(date);
  const cls = left < 0 ? "text-slate-400" : left <= 3 ? "text-rose-600" : "text-slate-600";
  return (
    <span className={`text-xs font-semibold flex items-center gap-1 ${cls}`}>
      <Clock size={13} /> {left < 0 ? `Clôturée le ${fmtDate(date)}` : `Clôture le ${fmtDate(date)} · ${left === 0 ? "dernier jour" : `J-${left}`}`}
    </span>
  );
};

// Sondage : formulaire de vote, puis résultats (si le bureau les rend publics).
function PollCard({ poll, myVote, counts, onVote }) {
  const open = isOpenPoll(poll);
  const voted = myVote !== undefined && myVote !== null;
  const [choice, setChoice] = useState(voted ? myVote : null);
  const [editing, setEditing] = useState(false);
  const [busy, setBusy] = useState(false);
  const showForm = open && (!voted || editing);
  const total = counts ? counts.reduce((a, b) => a + b, 0) : 0;
  const submit = async () => {
    if (choice === null) return;
    setBusy(true);
    const ok = await onVote(poll, choice);
    setBusy(false);
    if (ok) setEditing(false);
  };
  return (
    <div className="bg-white rounded-3xl p-6 shadow-sm">
      <div className="flex items-start justify-between gap-3">
        <p className="font-bold text-slate-900 text-lg leading-snug">{poll.question}</p>
        <span className={`flex-shrink-0 text-xs px-2.5 py-1 rounded-full font-semibold ${open ? "bg-emerald-100 text-emerald-700" : "bg-slate-200 text-slate-600"}`}>{open ? (poll.cloture ? `Jusqu'au ${fmtDate(poll.cloture)}` : "Ouvert") : "Clos"}</span>
      </div>
      {showForm ? (
        <div className="mt-4 space-y-2">
          {poll.options.map((o, i) => (
            <label key={i} className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition ${choice === i ? "border-orange-500 bg-orange-50" : "border-slate-200 hover:border-orange-300"}`}>
              <input type="radio" name={`poll-${poll.id}`} checked={choice === i} onChange={() => setChoice(i)} className="accent-orange-600" />
              <span className="text-sm text-slate-800">{o}</span>
            </label>
          ))}
          <div className="flex justify-end gap-2 pt-1">
            {editing && <button onClick={() => { setEditing(false); setChoice(myVote); }} className="px-4 py-2 rounded-xl bg-white border border-slate-300 text-sm">Annuler</button>}
            <button disabled={choice === null || busy} onClick={submit} className="px-5 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold hover:bg-orange-700 disabled:opacity-50">{busy ? "Envoi..." : voted ? "Modifier mon vote" : "Voter"}</button>
          </div>
        </div>
      ) : (
        <div className="mt-4 space-y-3">
          {counts ? poll.options.map((o, i) => {
            const n = counts[i] || 0;
            const p = total ? Math.round((n * 100) / total) : 0;
            return (
              <div key={i}>
                <div className="flex justify-between gap-3 text-sm"><span className={myVote === i ? "font-bold text-orange-700" : "text-slate-700"}>{o}{myVote === i && " (votre choix)"}</span><span className="font-semibold text-slate-900">{p} %</span></div>
                <div className="mt-1 h-2 rounded-full bg-slate-100 overflow-hidden"><div className="h-full rounded-full bg-gradient-to-r from-orange-500 to-amber-400" style={{ width: `${p}%` }} /></div>
              </div>
            );
          }) : <p className="text-sm text-slate-500">{voted ? "Merci pour votre vote ! Les résultats seront communiqués par le bureau." : "Ce sondage est clos."}</p>}
          {counts && <p className="text-xs text-slate-400">{total} participant{total > 1 ? "s" : ""}</p>}
          {open && voted && <button onClick={() => setEditing(true)} className="text-sm text-orange-600 font-semibold">Modifier mon vote</button>}
        </div>
      )}
    </div>
  );
}

// Visionneuse de photos plein écran (flèches du clavier pour naviguer, Échap pour fermer).
function Lightbox({ photos, index, onClose, onIndex }) {
  const p = photos[index];
  const prev = () => onIndex((index - 1 + photos.length) % photos.length);
  const next = () => onIndex((index + 1) % photos.length);
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); if (e.key === "ArrowRight") next(); if (e.key === "ArrowLeft") prev(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [index, photos.length]);
  if (!p) return null;
  return (
    <div className="fixed inset-0 z-50 bg-black bg-opacity-90 flex flex-col items-center justify-center p-4" onClick={onClose}>
      <button onClick={onClose} className="absolute top-4 right-4 text-white opacity-80 hover:opacity-100" aria-label="Fermer"><X size={30} /></button>
      <img src={p.url} alt={p.legende || p.album} className="max-h-[80vh] max-w-full object-contain rounded-lg shadow-2xl" onClick={(e) => e.stopPropagation()} />
      <p className="text-white text-sm mt-4 text-center max-w-2xl" onClick={(e) => e.stopPropagation()}>{p.legende && <span className="font-semibold">{p.legende} · </span>}<span className="opacity-60">{index + 1} / {photos.length}</span></p>
      {photos.length > 1 && (
        <>
          <button onClick={(e) => { e.stopPropagation(); prev(); }} className="absolute left-2 md:left-6 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white bg-opacity-15 hover:bg-opacity-30 text-white flex items-center justify-center" aria-label="Photo précédente"><ChevronLeft size={26} /></button>
          <button onClick={(e) => { e.stopPropagation(); next(); }} className="absolute right-2 md:right-6 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white bg-opacity-15 hover:bg-opacity-30 text-white flex items-center justify-center" aria-label="Photo suivante"><ChevronRight size={26} /></button>
        </>
      )}
    </div>
  );
}

// APPLICATION
// =====================================================================
function App() {
  const [page, setPage] = useState("accueil");
  const [menuOpen, setMenuOpen] = useState(false);
  const [loginOpen, setLoginOpen] = useState(false);
  const [recovery, setRecovery] = useState(false);
  const [toast, setToast] = useState(null);
  const [contactSubject, setContactSubject] = useState(CONTACT_SUBJECTS[0]);
  const toastTimer = useRef(null);

  const [session, setSession] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [firstLoad, setFirstLoad] = useState(true);
  const [me, setMe] = useState(null); // ligne "profiles" du membre connecté (validé)
  const [profile, setProfile] = useState(EMPTY_PROFILE);
  const profileRef = useRef(profile);
  profileRef.current = profile;
  const [news, setNews] = useState([]);
  const [events, setEvents] = useState([]);
  const [jobs, setJobs] = useState([]);
  const [alumni, setAlumni] = useState([]);           // anciens ajoutés à la main par le bureau
  const [annuaire, setAnnuaire] = useState([]);       // anciens ayant un compte
  const [mentorats, setMentorats] = useState([]);     // mes demandes de mentorat (envoyées et reçues)
  const [temoignages, setTemoignages] = useState([]); // publiés + les miens (+ tous pour l'admin)
  const [documents, setDocuments] = useState([]);
  const [photos, setPhotos] = useState([]);
  const [partenaires, setPartenaires] = useState([]);
  const [sondages, setSondages] = useState([]);
  const [votes, setVotes] = useState([]);             // mes votes (tous les votes pour l'admin)
  const [resultats, setResultats] = useState([]);
  const [applications, setApplications] = useState([]);
  const [registrations, setRegistrations] = useState([]);
  const [members, setMembers] = useState([]);         // admins uniquement
  const [messages, setMessages] = useState([]);       // admins uniquement
  const [mentoratAll, setMentoratAll] = useState([]); // admins uniquement
  const [stats, setStats] = useState({});
  const [apercu, setApercu] = useState([]);           // aperçu public des opportunités
  const [imgOverrides, setImgOverrides] = useState({});
  const [newsFilter, setNewsFilter] = useState("Toutes");
  const [seen, setSeen] = useState(readSeen);
  const [baseline, setBaseline] = useState({});
  const defaultSeen = useRef(new Date(Date.now() - 14 * 86400000).toISOString()).current;
  const loadId = useRef(0);
  const quietUntil = useRef(0);
  const busy = useRef(new Set());

  const images = { ...DEFAULT_IMAGES, ...imgOverrides };
  const uid = session?.user?.id || null;

  const notify = (msg, type = "success") => {
    clearTimeout(toastTimer.current);
    setToast({ msg, type });
    toastTimer.current = setTimeout(() => setToast(null), 4000);
  };

  // Évite les doubles clics sur une même action pendant qu'elle s'exécute.
  const once = async (key, fn) => {
    if (busy.current.has(key)) return;
    busy.current.add(key);
    try { await fn(); } finally { busy.current.delete(key); }
  };

  // ----- Session de connexion -----
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setAuthReady(true); });
    const { data: sub } = sb.auth.onAuthStateChange((event, s) => {
      setSession(s);
      if (event === "PASSWORD_RECOVERY") setRecovery(true);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  // ----- Chargement des données (relancé à chaque connexion / déconnexion) -----
  const loadAll = async () => {
    const id = ++loadId.current;
    const errors = [];
    const q = (query) => query.then(({ data, error }) => { if (error) errors.push(error); return data ?? []; });
    try {
      let myRow = null;
      if (uid) {
        const { data, error } = await sb.from("profiles").select("*").eq("id", uid).maybeSingle();
        if (id !== loadId.current) return;
        if (error) errors.push(error);
        myRow = data;
        if (!error && (!myRow || myRow.statut !== "actif")) {
          const quiet = Date.now() < quietUntil.current;
          await sb.auth.signOut(); // relance automatiquement le chargement en mode visiteur
          if (!quiet) notify(!myRow ? "Ce compte n'existe plus. Contactez la CGE." : "Votre compte est en attente de validation par l'administrateur.", "error");
          return;
        }
      }
      const active = !!myRow;
      const admin = active && myRow.role === "admin";
      // Accès complet : membres CGE, anciens, administrateurs et membres du bureau ayant des droits.
      const cge = active && (!!myRow.membre_cge || myRow.type === "ancien" || admin || (myRow.permissions || []).length > 0);
      const [n, e, j, a, apps, regs, imgs, mem, st, ap, msgs, temo, ann, ment, mAll, docs, pics, parts, polls, vts, res] = await Promise.all([
        q(sb.from("news").select("*").order("date", { ascending: false })),
        q(sb.from("events").select("*").order("date")),
        cge ? q(sb.from("jobs").select("*").order("created_at", { ascending: false })) : [],
        cge ? q(sb.from("alumni").select("*").order("name")) : [],
        active ? q(sb.from("applications").select("*").order("id")) : [],
        active ? q(sb.from("registrations").select("*")) : [],
        q(sb.from("site_images").select("*")),
        admin ? q(sb.from("profiles").select("*").order("created_at", { ascending: false })) : [],
        q(sb.rpc("stats_publiques")),
        q(sb.rpc("opportunites_apercu")),
        admin ? q(sb.from("messages").select("*").order("created_at", { ascending: false })) : [],
        q(sb.from("temoignages").select("*").order("created_at", { ascending: false })),
        cge ? q(sb.rpc("annuaire_anciens")) : [],
        cge ? q(sb.rpc("mes_mentorats")) : [],
        admin ? q(sb.from("mentorat").select("id, statut, created_at")) : [],
        q(sb.from("documents").select("*").order("created_at", { ascending: false })),
        q(sb.from("photos").select("*").order("date", { ascending: false }).order("created_at")),
        q(sb.from("partenaires").select("*").order("ordre").order("created_at")),
        cge ? q(sb.from("sondages").select("*").order("created_at", { ascending: false })) : [],
        cge ? q(sb.from("votes").select("sondage_id, user_id, choix")) : [],
        cge ? q(sb.rpc("resultats_sondages")) : [],
      ]);
      if (id !== loadId.current) return;
      setMe(myRow);
      setProfile(myRow ? rowToProfile(myRow) : EMPTY_PROFILE);
      setNews(n.map(newsFromDb)); setEvents(e); setJobs(j); setAlumni(a);
      setApplications(apps.map(appFromDb)); setRegistrations(regs.map(regFromDb));
      setImgOverrides(Object.fromEntries(imgs.map((r) => [r.key, r.url])));
      setMembers(mem); setMessages(msgs);
      setStats(st && !Array.isArray(st) ? st : {});
      setApercu(Array.isArray(ap) ? ap : []);
      setTemoignages(temo); setAnnuaire(ann); setMentorats(ment); setMentoratAll(mAll);
      setDocuments(docs); setPhotos(pics); setPartenaires(parts); setSondages(polls); setVotes(vts); setResultats(res);
      if (errors.length) notify("Connexion à la base incomplète : " + errors[0].message, "error");
    } catch (err) {
      console.error(err);
      notify("Impossible de joindre la base de données. Vérifiez votre connexion internet.", "error");
    } finally {
      if (id === loadId.current) setFirstLoad(false);
    }
  };
  useEffect(() => { if (authReady) loadAll(); }, [uid, authReady]);

  // L'icône de l'onglet suit le logo choisi par l'administrateur.
  useEffect(() => {
    const link = document.querySelector('link[rel="icon"]');
    if (link && images.logo) link.href = images.logo;
  }, [images.logo]);

  // ----- Navigation et pastilles « Nouveau » -----
  const seenOf = (s) => seen[s] || defaultSeen;
  const sinceFor = (s) => baseline[s] || seenOf(s);
  const go = (p) => {
    if (TRACKED.includes(p)) {
      setBaseline((b) => ({ ...b, [p]: seenOf(p) }));
      const next = { ...seen, [p]: new Date().toISOString() };
      setSeen(next);
      writeSeen(next);
    }
    setPage(p); setMenuOpen(false); window.scrollTo({ top: 0, behavior: "smooth" });
  };
  const goContact = (subject) => { setContactSubject(subject || CONTACT_SUBJECTS[0]); go("contact"); };
  const openLogin = () => { setLoginOpen(true); setMenuOpen(false); };

  const user = me ? { id: me.id, name: accountName(me), role: me.role, email: me.email, type: profile.type } : null;
  const isAdmin = user?.role === "admin";
  const pct = completion(profile);
  const fullName = [profile.prenoms, profile.nom].filter(Boolean).join(" ") || user?.name || "";
  const published = temoignages.filter((t) => t.publie);
  const myTemoignages = user ? temoignages.filter((t) => t.author_id === user.id) : [];
  const receivedPending = mentorats.filter((m) => m.sens === "mentor" && m.statut === "en_attente").length;
  const adminAlerts = members.filter((m) => m.statut === "en_attente").length + messages.filter((m) => !m.lu).length + temoignages.filter((t) => !t.publie).length;
  const myApplications = user ? applications.filter((a) => a.userId === user.id) : [];
  const myRegs = user ? registrations.filter((r) => r.userId === user.id).map((r) => r.eventId) : [];

  // Sondages
  const myVoteOf = (id) => { const v = votes.find((x) => x.sondage_id === id && x.user_id === user?.id); return v ? v.choix : undefined; };
  const countsFor = (id) => {
    const rows = resultats.filter((r) => r.sondage_id === id);
    if (!rows.length) return null;
    const poll = sondages.find((s) => s.id === id);
    return (poll?.options || []).map((_, i) => Number(rows.find((r) => r.choix === i)?.nb || 0));
  };
  const openPolls = sondages.filter(isOpenPoll);
  const pollsToVote = user ? openPolls.filter((s) => myVoteOf(s.id) === undefined) : [];

  const visibleNews = [...news].sort((a, b) => b.date.localeCompare(a.date));
  const sortedEvents = [...events].sort((a, b) => a.date.localeCompare(b.date));
  const upcoming = sortedEvents.filter((e) => daysUntil(e.date) >= 0);
  const pastEvents = sortedEvents.filter((e) => daysUntil(e.date) < 0).reverse();
  const nextEvent = upcoming[0];
  const categories = ["Toutes", ...new Set(visibleNews.map((n) => n.category))];
  const openJobs = jobs.filter((j) => !isExpired(j));
  const official = partenaires.filter((p) => p.role === "Partenaire officiel");

  const newCounts = {
    actualites: visibleNews.filter((n) => newer(n.created_at, seenOf("actualites"))).length + pollsToVote.length,
    evenements: upcoming.filter((e) => newer(e.created_at, seenOf("evenements"))).length,
    opportunites: user ? openJobs.filter((j) => newer(j.created_at, seenOf("opportunites"))).length : 0,
    mediatheque: documents.filter((d) => newer(d.created_at, seenOf("mediatheque"))).length
      + new Set(photos.filter((p) => newer(p.created_at, seenOf("mediatheque"))).map((p) => p.album)).size,
  };

  const navMain = [["actualites", "Actualités"], ["evenements", "Événements"], ["opportunites", "Opportunités"], ["alumni", "Anciens"], ["mediatheque", "Médiathèque"], ["contact", "Contact"]];
  const navAsso = [["apropos", "À propos"], ["bureau", "Le bureau"], ["adhesion", "Devenir membre"], ["partenaires", "Partenaires"]];
  // Droits délégués : un membre peut gérer certaines rubriques sans être administrateur.
  const perms = (me && me.permissions) || [];
  const can = (p) => isAdmin || perms.includes(p);
  const canManage = isAdmin || perms.length > 0;
  const manageAlerts = (isAdmin ? members.filter((m) => m.statut === "en_attente").length : 0)
    + (can("messages") ? messages.filter((m) => !m.lu).length : 0)
    + (can("temoignages") ? temoignages.filter((t) => !t.publie).length : 0);
  const adminNav = canManage ? [["admin", `${isAdmin ? "Administration" : "Gestion"}${manageAlerts ? ` (${manageAlerts})` : ""}`]] : [];
  const NavCount = ({ id }) => (newCounts[id] > 0 && page !== id ? <span className="ml-1 min-w-5 h-5 px-1.5 rounded-full bg-orange-600 text-white text-xs font-bold inline-flex items-center justify-center">{newCounts[id]}</span> : null);

  // Pour les membres, on utilise la liste complète (toujours à jour) ; pour les visiteurs, l'aperçu public.
  // Les non-membres (visiteurs et élèves non adhérents) voient l'aperçu public des opportunités.
  const fullAccess = !!me && (!!me.membre_cge || me.type === "ancien" || isAdmin || perms.length > 0);
  const homeOpps = fullAccess ? [...openJobs].slice(0, 4) : apercu;
  const homeStats = [
    [fullAccess ? openJobs.length : stats.offres, "", "Opportunités ouvertes"],
    [stats.membres, "", "Membres inscrits"],
    [stats.anciens, "", "Anciens dans le réseau"],
    [new Date().getFullYear() - ANNEE_CREATION, "", `Ans d'existence (depuis ${ANNEE_CREATION})`],
  ];

  // ----- Connexion, inscription, mot de passe -----
  const handleLogin = async (email, password) => {
    quietUntil.current = Date.now() + 10000;
    const { data, error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    if (error) return authMessage(error);
    const { data: row, error: e2 } = await sb.from("profiles").select("statut, prenoms, nom, email").eq("id", data.user.id).maybeSingle();
    if (e2 || !row || row.statut !== "actif") {
      await sb.auth.signOut();
      if (e2) return "Connexion à la base impossible : " + e2.message;
      return !row ? "Ce compte n'existe plus. Contactez la CGE." : "Votre compte est en attente de validation par l'administrateur. Réessayez un peu plus tard.";
    }
    setLoginOpen(false);
    notify(`Bienvenue, ${accountName(row)} !`);
    return null;
  };

  const handleRegister = async (r) => {
    quietUntil.current = Date.now() + 10000;
    const { data: free, error: e1 } = await sb.rpc("matricule_disponible", { m: r.matricule });
    if (e1) return "Vérification du matricule impossible : " + e1.message;
    if (free === false) return "Ce matricule possède déjà un compte.";
    const { data, error } = await sb.auth.signUp({
      email: r.email, password: r.password,
      options: { emailRedirectTo: SITE_URL(), data: { prenoms: r.prenoms, nom: r.nom, matricule: r.matricule, filiere: r.filiere, promotion: r.promotion, type: r.type,
        ...(r.type === "ancien" ? { cge_ancien: r.cge_ancien, postes_cge: r.cge_ancien === "oui" ? nettoyerPostes(r.postes_cge) : [] } : {}) } },
    });
    if (error) return authMessage(error);
    if (data.session) await sb.auth.signOut(); // le compte doit d'abord être validé
    return null;
  };

  const handleForgot = async (email) => {
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE_URL() });
    return error ? authMessage(error) : null;
  };

  const logout = async () => { await sb.auth.signOut(); go("accueil"); notify("Vous êtes déconnecté(e)."); };

  // ----- Profil -----
  const updateProfile = async (patch) => {
    if (!me) return false;
    const prev = profileRef.current;
    const next = { ...prev, ...patch };
    profileRef.current = next;
    setProfile(next);
    const { error } = await sb.from("profiles").update(profileToRow(next)).eq("id", me.id);
    if (error) {
      profileRef.current = prev;
      setProfile(prev);
      notify(error.code === "23505" ? "Ce matricule est déjà utilisé par un autre compte." : "Enregistrement impossible : " + error.message, "error");
      return false;
    }
    // L'annuaire dépend du profil d'ancien : on le rafraîchit après chaque modification.
    if (next.type === "ancien" || prev.type === "ancien") sb.rpc("annuaire_anciens").then(({ data }) => data && setAnnuaire(data));
    return true;
  };

  // ----- Images du site -----
  const saveImage = async (key, blob) => {
    if (!blob) {
      const { error } = await sb.from("site_images").delete().eq("key", key);
      if (error) throw new Error("Suppression impossible : " + error.message);
      setImgOverrides(({ [key]: _, ...rest }) => rest);
      return;
    }
    const url = await uploadPublicImage(`site/${slugify(key)}`, blob);
    const { error } = await sb.from("site_images").upsert({ key, url, updated_at: new Date().toISOString() });
    if (error) throw new Error("Enregistrement impossible : " + error.message);
    setImgOverrides((s) => ({ ...s, [key]: url }));
  };

  // ----- Événements et candidatures -----
  const toggleRegistration = (ev) => {
    if (!user) return openLogin();
    once(`reg-${ev.id}`, async () => {
      if (myRegs.includes(ev.id)) {
        const { error } = await sb.from("registrations").delete().eq("event_id", ev.id).eq("user_id", user.id);
        if (error) return notify("Annulation impossible : " + error.message, "error");
        setRegistrations((rs) => rs.filter((r) => !(r.eventId === ev.id && r.userId === user.id)));
        notify("Inscription annulée.");
      } else {
        const { data, error } = await sb.from("registrations").insert({ event_id: ev.id, user_id: user.id, name: fullName }).select().single();
        if (error) return notify("Inscription impossible : " + error.message, "error");
        setRegistrations((rs) => [...rs, regFromDb(data)]);
        notify(`Vous êtes inscrit(e) : ${ev.title}`);
      }
    });
  };

  const apply = (job) => {
    if (!user) return openLogin();
    if (myApplications.some((a) => a.jobId === job.id)) return;
    if (pct < 50) { notify("Complétez votre profil à au moins 50 % avant de postuler.", "error"); go("profil"); return; }
    once(`job-${job.id}`, async () => {
      const { data, error } = await sb.from("applications").insert({
        job_id: job.id, user_id: user.id, title: job.title, company: job.company,
        applicant: fullName, email: profile.email || user.email, cv_name: profile.cv?.name || null,
      }).select().single();
      if (error) return notify(/row-level security/i.test(error.message)
        ? "Candidature refusée : vous avez une cotisation en retard. Régularisez-la auprès de la Trésorerie (Mon espace → Mes cotisations)."
        : "Envoi impossible : " + error.message, "error");
      setApplications((list) => [...list, appFromDb(data)]);
      notify("Candidature envoyée avec votre profil !");
    });
  };

  // ----- Sondages -----
  const vote = async (poll, choix) => {
    const { error } = await sb.from("votes").upsert({ sondage_id: poll.id, user_id: user.id, choix }, { onConflict: "sondage_id,user_id" });
    if (error) { notify("Vote impossible : " + error.message, "error"); return false; }
    setVotes((list) => [...list.filter((v) => !(v.sondage_id === poll.id && v.user_id === user.id)), { sondage_id: poll.id, user_id: user.id, choix }]);
    const { data } = await sb.rpc("resultats_sondages");
    if (data) setResultats(data);
    notify("Merci pour votre vote !");
    return true;
  };

  // ----- Mentorat -----
  const refreshMentorats = async () => {
    const { data, error } = await sb.rpc("mes_mentorats");
    if (!error) setMentorats(data || []);
  };
  const sendMentorRequest = async (mentor, message) => {
    const { error } = await sb.from("mentorat").insert({ eleve_id: user.id, mentor_id: mentor.id, message });
    if (error) {
      notify(error.code === "23505" ? "Vous avez déjà une demande en cours avec cette personne." : "Envoi impossible : " + error.message, "error");
      return false;
    }
    await refreshMentorats();
    notify(`Demande envoyée à ${mentor.nom}. Suivez-la dans Mon espace → Mentorat.`);
    return true;
  };
  const updateMentorat = async (id, patch, msg) => {
    const { error } = await sb.from("mentorat").update(patch).eq("id", id);
    if (error) { notify("Action impossible : " + error.message, "error"); return false; }
    await refreshMentorats();
    if (msg) notify(msg);
    return true;
  };

  // ----- Témoignages -----
  const submitTemoignage = async ({ titre, texte }) => {
    const { data, error } = await sb.from("temoignages").insert({
      author_id: user.id, nom: fullName, promo: profile.promotion || "", poste: profile.poste || "",
      entreprise: profile.entreprise || "", photo: profile.photo || null, titre, texte, publie: false,
    }).select().single();
    if (error) { notify("Envoi impossible : " + error.message, "error"); return false; }
    setTemoignages((list) => [data, ...list]);
    notify("Merci ! Votre témoignage sera publié après validation par le bureau.");
    return true;
  };
  const deleteTemoignage = async (id) => {
    const { error } = await sb.from("temoignages").delete().eq("id", id);
    if (error) return notify("Suppression impossible : " + error.message, "error");
    setTemoignages((list) => list.filter((t) => t.id !== id));
    notify("Témoignage retiré.");
  };

  // ----- Textes et réglages modifiés depuis le site (prioritaires sur config.js) -----
  const [settings, setSettings] = useState({});
  const [settingsReady, setSettingsReady] = useState(false);
  const loadSettings = async () => {
    try {
      const { data, error } = await sb.from("site_settings").select("key, value");
      if (!error && data) {
        const map = Object.fromEntries(data.map((r) => [r.key, r.value]));
        applySettings(map);
        setSettings(map);
      }
    } catch (e) { /* table absente : on garde les valeurs de config.js */ }
    setSettingsReady(true);
  };
  useEffect(() => { loadSettings(); }, []);
  // entries : liste de [clé, valeur] ; une valeur null remet la valeur d'origine.
  const saveSettings = async (entries) => {
    const now = new Date().toISOString();
    const up = entries.filter(([, v]) => v !== null).map(([key, value]) => ({ key, value, updated_at: now }));
    const del = entries.filter(([, v]) => v === null).map(([k]) => k);
    if (up.length) {
      const { error } = await sb.from("site_settings").upsert(up);
      if (error) { notify("Enregistrement impossible : " + error.message, "error"); return false; }
    }
    if (del.length) {
      const { error } = await sb.from("site_settings").delete().in("key", del);
      if (error) { notify("Enregistrement impossible : " + error.message, "error"); return false; }
    }
    const next = { ...settings };
    del.forEach((k) => { delete next[k]; });
    up.forEach((r) => { next[r.key] = r.value; });
    applySettings(next);
    setSettings(next);
    return true;
  };

  // Membres ayant des droits délégués : on charge les données de gestion dont ils ont besoin.
  useEffect(() => {
    if (!me || me.role === "admin") return;
    const p = me.permissions || [];
    if (p.includes("candidatures")) sb.from("profiles").select("*").order("created_at", { ascending: false }).then(({ data }) => { if (data) setMembers(data); });
    if (p.includes("messages")) sb.from("messages").select("*").order("created_at", { ascending: false }).then(({ data }) => { if (data) setMessages(data); });
  }, [me]);

  // Présence : le site signale toutes les 2 minutes que le membre est là (journal des connexions).
  useEffect(() => {
    if (!me) return;
    const ping = () => { if (document.visibilityState === "visible") sb.rpc("signaler_presence").then(() => {}, () => {}); };
    ping();
    const timer = setInterval(ping, 120000);
    document.addEventListener("visibilitychange", ping);
    return () => { clearInterval(timer); document.removeEventListener("visibilitychange", ping); };
  }, [me && me.id]);

  // ----- Adhésions : devenir membre de la CGE -----
  const [campagnes, setCampagnes] = useState([]);
  const [mesAdhesions, setMesAdhesions] = useState([]);
  const loadAdhesions = async () => {
    try {
      const { data: c } = await sb.from("adhesion_campagnes").select("*").order("ouverture", { ascending: false });
      setCampagnes(c || []);
      if (me) {
        const { data: a } = await sb.from("adhesions").select("*").eq("user_id", me.id).order("created_at", { ascending: false });
        setMesAdhesions(a || []);
      } else setMesAdhesions([]);
    } catch (e) { /* tables absentes (lot 5 pas encore lancé) : rien à afficher */ }
  };
  useEffect(() => { loadAdhesions(); }, [me && me.id]);
  // Accès complet au site : membres CGE, anciens, administrateurs et membres du bureau ayant des droits.
  const isCge = !!me && (!!me.membre_cge || me.type === "ancien" || isAdmin || perms.length > 0);
  // Campagne en cours (dates d'ouverture et de clôture incluses), et la prochaine si aucune n'est ouverte.
  const campagne = campagnes.find((c) => daysUntil(c.ouverture) <= 0 && daysUntil(c.cloture) >= 0) || null;
  const prochaine = [...campagnes].filter((c) => daysUntil(c.ouverture) > 0).sort((a, b) => a.ouverture.localeCompare(b.ouverture))[0] || null;
  const maCandidature = mesAdhesions[0] || null;
  const goAdhesion = () => go("adhesion");

  // Postes occupés à la CGE par les anciens (annuaire et page « Le bureau »).
  const [postesAnciens, setPostesAnciens] = useState([]);
  useEffect(() => { sb.rpc("postes_anciens").then(({ data }) => setPostesAnciens(data || []), () => {}); }, [uid]);

  if (firstLoad || !settingsReady) return <FullLoader />;

  const navBtn = (id, label) => (
    <button key={id} onClick={() => go(id)} className={`relative px-2.5 py-2 text-sm font-medium transition whitespace-nowrap inline-flex items-center ${page === id ? "text-orange-600" : "text-slate-600 hover:text-slate-900"}`}>
      {label}<NavCount id={id} />
      {page === id && <span className="absolute left-2.5 right-2.5 -bottom-0.5 h-0.5 rounded-full bg-orange-600" />}
    </button>
  );
  const mobileBtn = (id, label) => (
    <button key={id} onClick={() => go(id)} className={`text-left px-3 py-3 rounded-lg flex items-center ${page === id ? "text-orange-600 bg-orange-50 font-semibold" : "text-slate-700"}`}>{label}<NavCount id={id} /></button>
  );
  const assoActive = navAsso.some(([id]) => id === page);

  return (
    <ImgCtx.Provider value={{ images, overrides: imgOverrides, saveImage, access: { logged: !!user, isCge, join: goAdhesion, numero: me && me.membre_cge ? (me.numero_membre || "") : null,
      dept: me && me.departement ? { nom: me.departement, poste: me.poste_cge || "" } : null } }}>
    <div className="min-h-screen bg-stone-50 text-slate-800 font-sans">
      {toast && (
        <div className={`fixed top-5 left-1/2 -translate-x-1/2 z-50 max-w-md w-max px-5 py-3 rounded-xl shadow-2xl text-sm font-medium flex items-center gap-2 fade-up ${toast.type === "error" ? "bg-rose-600 text-white" : "bg-slate-900 text-white"}`}>
          {toast.type === "error" ? <X size={16} className="flex-shrink-0" /> : <CheckCircle2 size={16} className="text-orange-400 flex-shrink-0" />} {toast.msg}
        </div>
      )}

      {/* ===== EN-TÊTE ===== */}
      <header className="sticky top-0 z-40 bg-white bg-opacity-95 backdrop-blur border-b border-slate-200 shadow-sm">
        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
          <button onClick={() => go("accueil")} className="flex items-center gap-3 text-left">
            <Logo />
            <div>
              <div className="font-extrabold text-slate-900 leading-tight">CGE <span className="text-orange-600">ARSTM</span></div>
              <div className="text-xs text-slate-500">Conférence des Grandes Écoles</div>
            </div>
          </button>
          <nav className="hidden xl:flex items-center gap-0.5">
            {navBtn("accueil", "Accueil")}
            <div className="relative group">
              <button className={`px-2.5 py-2 text-sm font-medium inline-flex items-center gap-1 transition ${assoActive ? "text-orange-600" : "text-slate-600 hover:text-slate-900"}`}>L'association <ChevronDown size={14} /></button>
              <div className="absolute left-0 top-full pt-2 hidden group-hover:block group-focus-within:block">
                <div className="bg-white rounded-2xl shadow-xl border border-slate-100 p-2 w-48">
                  {navAsso.map(([id, label]) => (
                    <button key={id} onClick={() => { go(id); if (document.activeElement) document.activeElement.blur(); }} className={`block w-full text-left px-3 py-2 rounded-lg text-sm transition ${page === id ? "bg-orange-50 text-orange-600 font-semibold" : "text-slate-700 hover:bg-orange-50"}`}>{label}</button>
                  ))}
                </div>
              </div>
            </div>
            {navMain.map(([id, label]) => navBtn(id, label))}
            {adminNav.map(([id, label]) => navBtn(id, label))}
          </nav>
          <div className="flex items-center gap-2">
            {user ? (
              <>
                <button onClick={() => go("profil")} className={`relative hidden sm:flex items-center gap-2 pl-1 pr-4 py-1 rounded-full border transition ${page === "profil" ? "border-orange-500 bg-orange-50" : "border-slate-200 hover:border-orange-400"}`}>
                  <Avatar photo={profile.photo} name={fullName} size="w-8 h-8" text="text-xs" />
                  <span className="text-sm font-semibold">Mon espace</span>
                  {receivedPending > 0 && <span className="absolute -top-1 -right-1 min-w-5 h-5 px-1 rounded-full bg-orange-600 text-white text-xs font-bold flex items-center justify-center" title="Demandes de mentorat en attente">{receivedPending}</span>}
                </button>
                <button onClick={logout} className="hidden sm:flex p-2 rounded-full text-slate-500 hover:bg-slate-100" aria-label="Se déconnecter" title="Se déconnecter"><LogOut size={18} /></button>
              </>
            ) : (
              <button onClick={openLogin} className="hidden sm:flex items-center gap-2 px-4 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold hover:bg-orange-700 hover:shadow-lg transition">
                <User size={16} /> Espace membre
              </button>
            )}
            <button onClick={() => setMenuOpen(!menuOpen)} className="xl:hidden p-2 relative" aria-label="Menu">
              {menuOpen ? <X /> : <Menu />}
              {!menuOpen && Object.values(newCounts).some((n) => n > 0) && <span className="absolute top-1.5 right-1.5 w-2.5 h-2.5 rounded-full bg-orange-600" />}
            </button>
          </div>
        </div>
        {menuOpen && (
          <div className="xl:hidden border-t border-slate-200 bg-white px-4 py-3 flex flex-col max-h-[80vh] overflow-y-auto">
            {mobileBtn("accueil", "Accueil")}
            {navMain.map(([id, label]) => mobileBtn(id, label))}
            <p className="px-3 pt-3 pb-1 text-xs font-bold uppercase tracking-wider text-slate-400">L'association</p>
            {navAsso.map(([id, label]) => mobileBtn(id, label))}
            {adminNav.map(([id, label]) => mobileBtn(id, label))}
            {user ? (
              <>
                <button onClick={() => go("profil")} className="mt-2 px-3 py-3 rounded-lg bg-orange-600 text-white font-semibold text-left">Mon espace{receivedPending > 0 && ` (${receivedPending})`}</button>
                <button onClick={logout} className="mt-2 px-3 py-3 rounded-lg bg-slate-100 text-left">Se déconnecter</button>
              </>
            ) : (
              <button onClick={openLogin} className="mt-2 px-3 py-3 rounded-lg bg-orange-600 text-white font-semibold">Espace membre</button>
            )}
          </div>
        )}
      </header>

      <div key={page} className="fade-up">
        {/* Bandeau « adhésions ouvertes » : accueil, actualités et événements, pendant la campagne seulement */}
        {campagne && !(me && (me.membre_cge || profile.type === "ancien")) && ["accueil", "actualites", "evenements"].includes(page) && (
          <div className="bg-gradient-to-r from-orange-600 to-amber-500 text-white">
            <div className="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <p className="text-sm font-semibold flex items-center gap-2"><UserPlus size={18} className="flex-shrink-0" /> {tx("adhesion.bandeau")} Candidatures jusqu'au {fmtDate(campagne.cloture)}.</p>
              <button onClick={goAdhesion} className="self-start sm:self-auto px-4 py-1.5 rounded-lg bg-white text-orange-700 text-sm font-bold whitespace-nowrap hover:shadow-lg transition">
                {maCandidature && maCandidature.campagne_id === campagne.id ? "Suivre ma candidature" : "Devenir membre"}
              </button>
            </div>
          </div>
        )}
        {page === "accueil" && <Home go={go} user={user} openLogin={openLogin} visibleNews={visibleNews} upcoming={upcoming} nextEvent={nextEvent} homeOpps={homeOpps} homeStats={homeStats}
          testimonials={published} partenaires={partenaires} pollsToVote={pollsToVote} countsFor={countsFor} onVote={vote} isNewsNew={(n) => newer(n.created_at, seenOf("actualites"))} />}

        {/* ===== À PROPOS ===== */}
        {page === "apropos" && (
          <>
            <PageHero kicker="Qui sommes-nous" title="La CGE ARSTM" sub="Section ARSTM de la Conférence des Grandes Écoles de Côte d'Ivoire, association des ingénieurs de conception des grandes écoles publiques." icon={Anchor} />
            <main className="max-w-6xl mx-auto px-4 py-16 space-y-16">
              <div className="grid md:grid-cols-5 gap-8 items-center bg-white rounded-3xl shadow-sm p-8 md:p-10">
                <div className="md:col-span-2 text-center rounded-3xl p-8 text-white shadow-xl bg-gradient-to-br from-orange-500 to-orange-700">
                  <p className="text-sm font-bold uppercase tracking-widest opacity-90">Créée en</p>
                  <p className="text-5xl font-extrabold mt-2">{tx("apropos.creation")}</p>
                  <p className="mt-3 text-orange-100">{tx("apropos.creation_texte")}</p>
                </div>
                <div className="md:col-span-3">
                  <p className="text-orange-600 font-bold text-sm uppercase tracking-widest">Notre histoire</p>

// POSTES OCCUPÉS À LA CGE (anciens) : saisie, annuaire, anciens bureaux
// =====================================================================
const POSTES_LISTE = ["Président(e)", "Vice-président(e)", "Secrétaire général(e)", "Secrétaire général(e) adjoint(e)", "Trésorier(e) général(e)", "Trésorier(e) adjoint(e)",
  "Commissaire aux comptes", "Chef(fe) de département", "Adjoint(e) au chef de département", "Chargé(e) de mission", "Membre du bureau", "Membre"];
const anneesCge = () => { const out = []; for (let a = new Date().getFullYear(); a >= (Number(ANNEE_CREATION) || 1992); a--) out.push(String(a)); return out; };
const posteVide = () => ({ id: Date.now() + Math.floor(Math.random() * 1000), intitule: "", departement: "", debut: "", fin: "" });
const postesValides = (list) => (Array.isArray(list) ? list : []).filter((p) => p && String(p.intitule || "").trim());
// Période d'un poste : « 2019-2020 », ou « 2019 » s'il n'a duré qu'une année.
const periodePoste = (p) => (p.debut && p.fin && p.fin !== p.debut ? `${p.debut}-${p.fin}` : p.debut || "");
const libellePoste = (p) => [p.intitule, p.departement].filter(Boolean).join(" · ");
const nettoyerPostes = (list) => postesValides(list)
  .map((p) => ({ id: p.id || Date.now(), intitule: String(p.intitule).trim(), departement: String(p.departement || "").trim(), debut: p.debut || "", fin: p.fin && p.fin >= (p.debut || "") ? p.fin : p.debut || "" }))
  .sort((a, b) => b.debut.localeCompare(a.debut));
const erreurPostes = (list) => {
  const tous = Array.isArray(list) ? list : [];
  if (tous.some((p) => p && !String(p.intitule || "").trim() && (p.debut || p.autre))) return "Choisissez ou écrivez l'intitulé de chaque poste (ou retirez la ligne vide).";
  const v = postesValides(tous);
  if (!v.length) return "Ajoutez au moins un poste, ou répondez « Non ».";
  if (v.some((p) => !p.debut)) return "Indiquez l'année de début de chaque poste.";
  if (v.some((p) => p.fin && p.fin < p.debut)) return "L'année de fin ne peut pas être avant l'année de début.";
  return null;
};

function OuiNon({ value, onChange }) {
  return (
    <div className="grid grid-cols-2 gap-2">
      {[["oui", "Oui"], ["non", "Non"]].map(([v, l]) => (
        <button key={v} type="button" onClick={() => onChange(v)} className={`py-2.5 rounded-xl text-sm font-semibold border transition ${value === v ? "border-orange-500 bg-orange-50 text-orange-700 ring-2 ring-orange-200" : "border-slate-300 bg-white text-slate-600"}`}>{l}</button>
      ))}
    </div>
  );
}

// Saisie des postes : une fiche par poste (intitulé, département, de l'année… à l'année…).
function PostesEditor({ value, onChange }) {
  const list = Array.isArray(value) && value.length ? value : [posteVide()];
  const set = (i, patch) => onChange(list.map((p, j) => (j === i ? { ...p, ...patch } : p)));
  const annees = anneesCge();
  const sel = "mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-orange-500";
  return (
    <div className="space-y-3">
      <datalist id="depts-cge">{[...new Set([...DEPARTEMENTS, ...BUREAU.map((d) => d.dept)])].filter(Boolean).map((d) => <option key={d} value={d} />)}</datalist>
      {list.map((p, i) => {
        const autre = !!p.autre || (!!p.intitule && !POSTES_LISTE.includes(p.intitule));
        return (
          <div key={p.id || i} className="p-4 rounded-2xl bg-white border border-slate-200 space-y-3">
            <div className="flex items-center justify-between gap-2">
              <p className="text-xs font-bold uppercase tracking-wider text-slate-400">Poste {i + 1}</p>

}

// Mon espace → Ancien & mentorat : « Mes postes à la CGE ».
function MesPostesCge({ profile, update, notify }) {
  const deja = postesValides(profile.postes_cge);
  const [rep, setRep] = useState(profile.cge_ancien || (deja.length ? "oui" : ""));
  const [list, setList] = useState(deja.length ? deja : [posteVide()]);
  const [saving, setSaving] = useState(false);
  const save = async () => {
    if (!rep) return notify("Indiquez si vous avez occupé un poste à la CGE.", "error");
    if (rep === "oui") { const e = erreurPostes(list); if (e) return notify(e, "error"); }
    setSaving(true);
    const ok = await update({ cge_ancien: rep, postes_cge: rep === "oui" ? nettoyerPostes(list) : [] });
    setSaving(false);
    if (ok) notify("Vos postes à la CGE sont enregistrés.");
  };
  return (
    <Panel title="Mes postes à la CGE" Icon={Award}>
      <p className="text-sm text-slate-500 -mt-3 mb-4">Pendant votre scolarité, avez-vous occupé un poste au sein de la CGE section ARSTM ? Vos postes apparaissent sur votre fiche de l'annuaire et dans « Les anciens bureaux » (page Le bureau), sauf si vous avez choisi de ne pas apparaître dans l'annuaire.</p>
      <OuiNon value={rep} onChange={setRep} />
      {rep === "oui" && <div className="mt-4"><PostesEditor value={list} onChange={setList} /></div>}
      <div className="flex justify-end mt-6"><button onClick={save} disabled={saving} className="px-6 py-3 rounded-xl bg-orange-600 text-white font-semibold hover:bg-orange-700 disabled:opacity-60">{saving ? "Enregistrement..." : "Enregistrer"}</button></div>
    </Panel>
  );
}

// Administration → Membres : corriger ou retirer les postes déclarés par un ancien.
function PostesAdminDialog({ m, onClose, onSave }) {
  const deja = postesValides(m.data && m.data.postes_cge);
  const [list, setList] = useState(deja.length ? deja : [posteVide()]);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const save = async () => {
    const aucun = postesValides(list).length === 0;
    if (!aucun) { const e = erreurPostes(list); if (e) return setErr(e); }
    setBusy(true);
    await onSave(aucun ? [] : nettoyerPostes(list));
    setBusy(false);
    onClose();
  };
  return (
    <ModalShell onClose={onClose} title="Postes à la CGE" sub={accountName(m)}>
      <div className="p-6 space-y-4 bg-slate-50">
        <PostesEditor value={list} onChange={(v) => { setList(v); setErr(""); }} />
        <p className="text-xs text-slate-500">Pour tout retirer : retirez les postes (ou laissez « Choisir... »), puis enregistrez.</p>
        {err && <p className="text-sm text-rose-600">{err}</p>}
        <button onClick={save} disabled={busy} className="w-full py-3 rounded-xl bg-orange-600 text-white font-bold hover:bg-orange-700 disabled:opacity-60">{busy ? "Enregistrement..." : "Enregistrer"}</button>
      </div>
    </ModalShell>
  );
}

// Page « Le bureau » : les anciens bureaux, regroupés par mandat (du plus récent au plus ancien).
function AnciensBureaux({ postes }) {
  const groupes = {};
  (postes || []).forEach((a) => postesValides(a.postes).forEach((p) => {
    const k = periodePoste(p);
    if (!k) return;
    if (!groupes[k]) groupes[k] = { k, debut: p.debut || "", fin: p.fin || p.debut || "", gens: [] };
    groupes[k].gens.push({ nom: a.nom, photo: a.photo, promo: a.promotion, intitule: p.intitule, departement: p.departement });
  }));
  const liste = Object.values(groupes).sort((a, b) => b.debut.localeCompare(a.debut) || b.fin.localeCompare(a.fin));
  if (!liste.length) return null;
  const rang = (t) => { const i = POSTES_LISTE.indexOf(t); return i < 0 ? 99 : i; };
  return (
    <section className="max-w-6xl mx-auto px-4 pb-16">
      <SectionTitle kicker="Notre histoire" title="Les anciens bureaux" />
      <div className="space-y-6">
        {liste.map((g) => (
          <div key={g.k} className="bg-white rounded-3xl shadow-sm p-6">
            <p className="font-extrabold text-slate-900 text-lg flex items-center gap-2"><span className="w-1.5 h-6 rounded-full bg-orange-600" /> Mandat {g.k}</p>
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-4">
              {[...g.gens].sort((a, b) => rang(a.intitule) - rang(b.intitule) || String(a.nom).localeCompare(String(b.nom))).map((x, i) => (
                <div key={i} className="flex items-center gap-3 p-3 rounded-2xl bg-slate-50">
                  <Avatar photo={x.photo} name={x.nom} size="w-11 h-11" text="text-sm" />
                  <div className="min-w-0">
                    <p className="font-semibold text-slate-900 text-sm truncate">{x.nom}</p>
                    <p className="text-xs text-orange-700 font-semibold">{libellePoste(x)}</p>
                    {x.promo && <p className="text-xs text-slate-500">Promo {x.promo}</p>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
      <p className="text-xs text-slate-400 mt-4">Liste établie à partir des postes déclarés par les anciens dans leur espace.</p>
    </section>
  );
}

function MentorRequestModal({ mentor, profile, onClose, onSend }) {
  const first = mentor.nom.split(" ")[0];
  const suggestion = `Bonjour ${first},\n\nJe suis élève${profile.filiere ? ` en ${profile.filiere}` : ""} à l'ARSTM${profile.promotion ? ` (promotion ${profile.promotion})` : ""}.${profile.objectif ? ` Mon objectif : ${profile.objectif}.` : ""}\n\nVotre parcours m'intéresse beaucoup. Seriez-vous d'accord pour un premier échange afin que je puisse bénéficier de vos conseils ?\n\nMerci d'avance !`;
  const [msg, setMsg] = useState(suggestion);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const send = async () => {
    if (msg.trim().length < 10) return setErr("Votre message est trop court.");
    setBusy(true);
    const ok = await onSend(mentor, msg.trim().slice(0, 1500));
    setBusy(false);
    if (ok) onClose();
  };
  return (
    <ModalShell onClose={onClose} title="Demande de mentorat" sub={`À ${mentor.nom}${mentor.poste ? ` — ${mentor.poste}` : ""}`}>
      <div className="p-8 space-y-4">
        <p className="text-sm text-slate-600">Présentez-vous et expliquez ce que vous attendez. Si {first} accepte, vos coordonnées respectives seront partagées pour poursuivre l'échange.</p>
        <label className="block"><span className="text-xs font-semibold text-slate-600">Votre message ({msg.length}/1500)</span>
          <textarea rows={9} maxLength={1500} value={msg} onChange={(e) => { setMsg(e.target.value); setErr(""); }} className={inputCls} />
        </label>
        {err && <p className="text-sm text-rose-600">{err}</p>}
        <button onClick={send} disabled={busy} className="w-full py-3.5 rounded-xl bg-orange-600 text-white font-bold hover:bg-orange-700 disabled:opacity-60 flex items-center justify-center gap-2"><Send size={17} /> {busy ? "Envoi..." : "Envoyer la demande"}</button>
      </div>
    </ModalShell>
  );
}

                  <p className="text-xs text-slate-400 mt-1">{[d.categorie, d.type === "fichier" && fileSize(d.taille), fmtDate(d.created_at)].filter(Boolean).join(" · ")}</p>
                </div>
                <button onClick={() => openDoc(d)} className="px-4 py-2.5 rounded-xl bg-orange-600 text-white text-sm font-semibold hover:bg-orange-700 flex items-center justify-center gap-2 whitespace-nowrap">
                  {d.type === "lien" ? <><ExternalLink size={15} /> Ouvrir</> : <><Download size={15} /> Télécharger</>}
                </button>
              </div>
            ))}
            {shownFiles.length === 0 && <p className="text-slate-500 text-center py-8">{files.length ? "Aucun document ne correspond." : "Aucun document pour le moment."}</p>}
          </div>
        )}

        {tab === "videos" && (
          videos.length === 0 ? <p className="text-slate-500 text-center py-10">Aucune vidéo pour le moment.</p> : (
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {videos.map((v) => {
                const yt = youtubeId(v.lien);
                return (
                  <a key={v.id} href={v.lien} target="_blank" rel="noopener noreferrer" className="group bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-2xl hover:-translate-y-1 transition duration-300">
                    <div className="relative aspect-video overflow-hidden" style={yt ? {} : { background: NAVY }}>
                      {yt && <img src={`https://img.youtube.com/vi/${yt}/hqdefault.jpg`} alt={v.titre} loading="lazy" className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />}
                      <div className="absolute inset-0 flex items-center justify-center bg-black bg-opacity-20 group-hover:bg-opacity-30 transition"><PlayCircle size={56} className="text-white drop-shadow-lg" /></div>
                      {newer(v.created_at, since) && <NewBadge className="absolute top-3 left-3 shadow" />}
                      {v.members_only && <span className="absolute top-3 right-3 px-2 py-1 rounded-lg bg-slate-900 text-white text-xs font-semibold flex items-center gap-1"><Lock size={11} /> Membres</span>}
                    </div>
                    <div className="p-5">
                      <p className="font-bold text-slate-900 group-hover:text-orange-600 transition">{v.titre}</p>
                      {v.description && <p className="text-sm text-slate-600 mt-1">{v.description}</p>}
                    </div>
                  </a>
                );
              })}
            </div>
          )
        )}
      </main>
    </>
  );
}

// =====================================================================
// DEVENIR MEMBRE : présentation, candidature et suivi des étapes
// =====================================================================
const ADH_ORDRE = ["envoyee", "frais_payes", "formulaire_remis", "admis", "membre"];
const ADH_FRISE = ["Candidature", "Frais de dossier", "Formulaire remis", "Entretien réussi", "Membre CGE"];
const entretienTexte = (c) => (c && c.entretien_date
  ? `${fmtDate(c.entretien_date)}${c.entretien_heure ? ` à ${c.entretien_heure}` : ""}${c.entretien_lieu ? ` · ${c.entretien_lieu}` : ""}`
  : "date communiquée prochainement");

function AdhesionPage({ me, profile, campagne, prochaine, campagnes, candidature, reload, notify, openLogin, go }) {
  const [f, setF] = useState({ cycle: "Licence", filiere: "", niveau: "", motivation: "" });
  const [busy, setBusy] = useState(false);
  const [upload, setUpload] = useState(null);
  const c = campagne;
  // Une ancienne candidature non retenue n'empêche pas de candidater à une nouvelle campagne.
  const suivi = candidature && !(candidature.etape === "non_retenu" && c && candidature.campagne_id !== c.id) ? candidature : null;
  const cc = (suivi && campagnes.find((x) => x.id === suivi.campagne_id)) || c || {};
  const filieres = f.cycle === "Licence" ? ((c && c.filieres_licence && c.filieres_licence.length) ? c.filieres_licence : FILIERES) : FILIERES;
  const first = (profile.prenoms || "").split(" ")[0] || "";

  const submit = async () => {
    if (!f.filiere || !f.niveau) return notify("Choisissez votre filière et votre année d'étude.", "error");
    if (!profile.telephone) { notify("Ajoutez d'abord votre numéro de téléphone dans Mon espace → Informations personnelles.", "error"); return go("profil"); }
    setBusy(true);
    const { error } = await sb.from("adhesions").insert({ campagne_id: c.id, user_id: me.id, cycle: f.cycle, filiere: f.filiere, niveau: f.niveau, motivation: f.motivation.trim().slice(0, 1000) || null });
    setBusy(false);
    if (error) return notify(error.code === "23505" ? "Vous avez déjà une candidature pour cette campagne." : error.message, "error");
    notify("Candidature envoyée ! Suivez son avancement sur cette page.");
    reload();
  };
  const cancel = async (cand) => {
    const { error } = await sb.from("adhesions").delete().eq("id", cand.id);
    if (error) return notify("Annulation impossible : " + error.message, "error");
    notify("Candidature annulée.");
    reload();
  };
  const sendRecu = async (cand, quoi, file) => {
    if (!file) return;
    if (file.size > 5 * 1048576) return notify("Fichier trop lourd (5 Mo maximum).", "error");
    setUpload(quoi);
    try {
      let blob = file, ext = "pdf";
      if (file.type && file.type.startsWith("image/")) { blob = await compressImage(file, 1400, 0.85); ext = blob.type === "image/png" ? "png" : "jpg"; }
      else if (file.type !== "application/pdf") throw new Error("Envoyez une photo (JPG, PNG) ou un PDF.");
      const path = `${me.id}/${Date.now()}-${quoi}.${ext}`;
      const { error } = await sb.storage.from("recus").upload(path, blob, { contentType: blob.type || "application/pdf" });
      if (error) throw new Error("Envoi impossible : " + error.message);
      const { error: e2 } = await sb.rpc("adhesion_deposer_recu", { a_id: cand.id, quoi, chemin: path });
      if (e2) throw new Error(e2.message);
      notify("Reçu envoyé. La Trésorerie va vérifier votre paiement.");
      reload();
    } catch (err) { notify(err.message, "error"); }
    finally { setUpload(null); }
  };

  const paiementBox = (montant, label) => (
    <div className="mt-4 p-4 rounded-2xl bg-orange-50 border border-orange-100 text-sm">
      <p className="font-bold text-slate-900">{label} : {fcfa(montant)}</p>
      {cc.paiement_infos && <p className="text-slate-700 mt-1 whitespace-pre-line">{cc.paiement_infos}</p>}
    </div>
  );
  const recuBox = (cand, quoi, path) => (
    <div className="mt-4 p-4 rounded-2xl bg-white border border-slate-200">
      <p className="text-sm font-semibold text-slate-900">Vous avez payé par Mobile Money ?</p>
      <p className="text-xs text-slate-500 mt-1">Envoyez une capture du reçu pour aider la Trésorerie. Si vous payez en espèces à la Trésorerie, vous n'avez rien à envoyer.</p>
      <div className="flex flex-wrap items-center gap-2 mt-3">
        <label className={`cursor-pointer px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 ${upload ? "bg-slate-200 text-slate-500" : "bg-orange-600 text-white hover:bg-orange-700"}`}>
          <Upload size={15} /> {upload === quoi ? "Envoi..." : path ? "Remplacer le reçu" : "Envoyer le reçu"}
          <input type="file" accept="image/*,application/pdf" disabled={!!upload} className="hidden" onChange={(e) => { const file = e.target.files && e.target.files[0]; e.target.value = ""; sendRecu(cand, quoi, file); }} />
        </label>
        {path && <button onClick={() => downloadPrivate("recus", path, null, notify)} className="px-4 py-2 rounded-xl bg-white border border-slate-300 text-sm font-semibold text-slate-700">Voir le reçu envoyé</button>}
        {path && <span className="text-xs text-emerald-700 font-semibold">Reçu envoyé · en attente de vérification</span>}
      </div>
    </div>
  );

  // Ce qu'il faut faire maintenant, selon l'étape de la candidature.
  const etapeContent = (s) => {
    if (s.etape === "envoyee") return (
      <>
        <p className="text-slate-700"><strong>Prochaine étape :</strong> réglez les frais de dossier à la Trésorerie (ou par Mobile Money). Une fois le paiement confirmé, vous recevrez le formulaire papier.</p>
        {paiementBox(cc.frais, "Frais de dossier")}
        {recuBox(s, "frais", s.frais_recu_path)}
        <div className="mt-4 flex justify-end"><ConfirmButton onConfirm={() => cancel(s)} confirmLabel="Annuler ?" className="text-xs font-semibold text-slate-500 hover:text-rose-600">Annuler ma candidature</ConfirmButton></div>
      </>
    );
    if (s.etape === "frais_payes") return <p className="text-slate-700"><strong>Frais de dossier confirmés.</strong> Récupérez le formulaire papier auprès du bureau de la CGE, remplissez-le et rendez-le. Vous serez ensuite convoqué(e) à l'entretien.</p>;
    if (s.etape === "formulaire_remis") return (
      <div className="p-5 rounded-2xl bg-violet-50 border border-violet-200">
        <p className="font-bold text-violet-900 flex items-center gap-2"><Calendar size={18} /> Vous êtes convoqué(e) à l'entretien</p>
        <p className="text-violet-900 mt-2 text-lg font-semibold">{entretienTexte(cc)}</p>
        <p className="text-sm text-violet-800 mt-2">L'entretien a lieu le même jour pour tous les candidats. Soyez à l'heure !</p>
      </div>
    );
    if (s.etape === "admis") return (
      <>
        <p className="text-slate-700"><strong>Félicitations, vous avez réussi l'entretien !</strong> Dernière étape : réglez la cotisation annuelle pour devenir membre de la CGE.</p>
        {paiementBox(cc.cotisation, "Cotisation annuelle")}
        {recuBox(s, "cotisation", s.cotisation_recu_path)}
      </>
    );
    if (s.etape === "non_retenu") return <p className="text-slate-700">Votre candidature n'a pas été retenue pour cette campagne. Vous pourrez candidater de nouveau lors de la prochaine campagne d'adhésion.</p>;
    return <p className="text-slate-700">Votre adhésion est finalisée. Bienvenue à la CGE !</p>;
  };

  const frise = (s) => {
    const idx = s.etape === "non_retenu" ? 2 : ADH_ORDRE.indexOf(s.etape);
    return (
      <ol className="grid grid-cols-5 gap-1 mb-6">
        {ADH_FRISE.map((label, i) => {
          const done = i <= idx;
          const failed = s.etape === "non_retenu" && i === 3;
          return (
            <li key={label} className="text-center">
              <div className={`mx-auto w-9 h-9 rounded-full flex items-center justify-center text-sm font-extrabold ${failed ? "bg-slate-300 text-slate-600" : done ? "bg-orange-600 text-white" : i === idx + 1 ? "bg-orange-100 text-orange-700 ring-2 ring-orange-400" : "bg-slate-100 text-slate-400"}`}>{failed ? "✕" : done ? "✓" : i + 1}</div>
              <p className={`text-xs mt-2 leading-tight ${done ? "font-semibold text-slate-900" : "text-slate-500"}`}>{label}</p>
            </li>
          );
        })}
      </ol>
    );
  };

  let action;
  if (me && me.membre_cge) {
    action = (
      <div className="rounded-3xl p-8 text-white shadow-xl bg-gradient-to-br from-orange-500 to-orange-700">
        <p className="text-sm font-bold uppercase tracking-widest opacity-90">Membre CGE section ARSTM</p>
        <p className="text-3xl font-extrabold mt-2">Bienvenue{first ? `, ${first}` : ""} !</p>
        {me.numero_membre && <p className="mt-3 text-lg">Numéro de membre : <strong>{me.numero_membre}</strong></p>}
        {me.membre_depuis && <p className="text-orange-100 text-sm mt-1">Membre depuis le {fmtDate(me.membre_depuis)}</p>}
        <div className="flex flex-wrap gap-2 mt-6">
          <button onClick={() => go("opportunites")} className="px-5 py-2.5 rounded-xl bg-white text-orange-700 font-bold text-sm">Voir les opportunités</button>
          <button onClick={() => go("alumni")} className="px-5 py-2.5 rounded-xl border border-white border-opacity-50 font-semibold text-sm">Le réseau des anciens</button>
        </div>
      </div>
    );
  } else if (suivi) {
    action = (
      <Panel title={`Ma candidature${cc.annee ? ` · ${cc.annee}` : ""}`} Icon={Send}>
        {frise(suivi)}
        <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold mb-4 ${(ETAPE[suivi.etape] || {}).cls || ""}`}>{(ETAPE[suivi.etape] || {}).label || suivi.etape}</span>
        {etapeContent(suivi)}
        {suivi.message_bureau && <p className="mt-4 p-4 rounded-2xl bg-sky-50 border border-sky-200 text-sm text-sky-900 whitespace-pre-line"><strong>Message du bureau :</strong> {suivi.message_bureau}</p>}
        <p className="text-xs text-slate-400 mt-5">{suivi.cycle} · {suivi.filiere}{suivi.niveau && ` · ${suivi.niveau}`} · envoyée le {fmtDate(suivi.created_at)}</p>
      </Panel>
    );
  } else if (!c) {
    action = (
      <Panel title="Adhésions fermées" Icon={Clock}>
        <p className="text-slate-600 whitespace-pre-line">{tx("adhesion.ferme")}</p>
        {prochaine && <p className="mt-3 font-semibold text-slate-900">Prochaine campagne ({prochaine.annee}) : à partir du {fmtDate(prochaine.ouverture)}.</p>}
      </Panel>
    );
  } else if (!me) {
    action = (
      <Panel title="Candidater" Icon={UserPlus}>
        <p className="text-slate-600">Pour candidater, connectez-vous à votre compte. Pas encore de compte ? Créez-le avec votre matricule : le bureau le validera, puis vous pourrez déposer votre candidature.</p>
        <button onClick={openLogin} className="mt-5 px-6 py-3 rounded-xl bg-orange-600 text-white font-semibold hover:bg-orange-700">Se connecter ou créer un compte</button>
      </Panel>
    );
  } else if (profile.type === "ancien") {
    action = (
      <Panel title="Adhésion réservée aux élèves" Icon={Info}>
        <p className="text-slate-600">L'adhésion est réservée aux élèves actuels de l'ARSTM. En tant qu'ancien, vous avez déjà accès à l'ensemble du site et au réseau.</p>
      </Panel>
    );
  } else {
    action = (
      <Panel title={`Candidater · campagne ${c.annee}`} Icon={UserPlus}>
        <p className="text-sm text-slate-500 -mt-3 mb-5">Vos nom, matricule, email et téléphone sont repris de votre profil. Candidatures ouvertes jusqu'au {fmtDate(c.cloture)}.</p>
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-2">
            {Object.keys(CYCLES).map((cy) => (
              <button key={cy} type="button" onClick={() => setF({ ...f, cycle: cy, filiere: "", niveau: "" })} className={`py-3 rounded-xl text-sm font-semibold border transition ${f.cycle === cy ? "border-orange-500 bg-orange-50 text-orange-700" : "border-slate-300 text-slate-600"}`}>{cy}</button>
            ))}
          </div>
          <div className="grid sm:grid-cols-2 gap-4">
            <label className="block"><span className="text-xs font-semibold text-slate-600">Filière</span>
              <select value={f.filiere} onChange={(e) => setF({ ...f, filiere: e.target.value })} className={inputCls}><option value="">Choisir...</option>{filieres.map((x) => <option key={x}>{x}</option>)}</select>
            </label>
            <label className="block"><span className="text-xs font-semibold text-slate-600">Année d'étude</span>
              <select value={f.niveau} onChange={(e) => setF({ ...f, niveau: e.target.value })} className={inputCls}><option value="">Choisir...</option>{CYCLES[f.cycle].map((x) => <option key={x}>{x}</option>)}</select>
            </label>
          </div>
          {f.cycle === "Licence" && c.filieres_licence && c.filieres_licence.length > 0 && <p className="text-xs text-slate-500">En Licence, seules ces filières sont éligibles : {c.filieres_licence.join(", ")}.</p>}
          <label className="block"><span className="text-xs font-semibold text-slate-600">Pourquoi voulez-vous rejoindre la CGE ? <span className="font-normal text-slate-400">(facultatif)</span></span>
            <textarea rows={4} maxLength={1000} value={f.motivation} onChange={(e) => setF({ ...f, motivation: e.target.value })} className={inputCls} />
          </label>
          {paiementBox(c.frais, "Frais de dossier à prévoir")}
          <button onClick={submit} disabled={busy} className="w-full py-3.5 rounded-xl bg-orange-600 text-white font-bold hover:bg-orange-700 disabled:opacity-60 flex items-center justify-center gap-2"><Send size={17} /> {busy ? "Envoi..." : "Envoyer ma candidature"}</button>
        </div>
      </Panel>
    );
  }

  const avantages = txLines("adhesion.avantages");
  const etapes = txLines("adhesion.etapes");
  return (
    <>
      <PageHero kicker="L'association" title="Devenir membre" sub="" icon={UserPlus} />
      <main className="max-w-6xl mx-auto px-4 py-16 space-y-14">
        <div className="grid lg:grid-cols-5 gap-6 items-start">
          <div className="lg:col-span-3">{action}</div>
          <div className="lg:col-span-2">
            <Panel title={c ? `Campagne ${c.annee}` : "Campagne d'adhésion"} Icon={Calendar}>
              {c ? (
                <ul className="space-y-3 text-sm text-slate-700">
                  <li className="flex gap-2"><Clock size={16} className="text-orange-600 flex-shrink-0 mt-0.5" /> <span>Candidatures du <strong>{fmtDate(c.ouverture)}</strong> au <strong>{fmtDate(c.cloture)}</strong></span></li>
                  <li className="flex gap-2"><FileText size={16} className="text-orange-600 flex-shrink-0 mt-0.5" /> <span>Frais de dossier : <strong>{fcfa(c.frais)}</strong></span></li>
                  <li className="flex gap-2"><Award size={16} className="text-orange-600 flex-shrink-0 mt-0.5" /> <span>Cotisation annuelle (si admis) : <strong>{fcfa(c.cotisation)}</strong></span></li>
                  <li className="flex gap-2"><MapPin size={16} className="text-orange-600 flex-shrink-0 mt-0.5" /> <span>Entretien : <strong>{entretienTexte(c)}</strong></span></li>
                </ul>
              ) : <p className="text-sm text-slate-500">Aucune campagne en cours.{prochaine && ` Prochaine campagne à partir du ${fmtDate(prochaine.ouverture)}.`}</p>}
            </Panel>
          </div>
        </div>

        {avantages.length > 0 && (
          <div>
            <SectionTitle kicker="Pourquoi adhérer" title="Ce que la CGE vous apporte" />
            <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">
              {avantages.map(([t, d = ""], i) => { const Icon = [Briefcase, Users, Sparkles, Megaphone][i % 4]; return (
                <div key={t} className="bg-white rounded-3xl p-6 shadow-sm hover:shadow-xl transition">
                  <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${CARD_GRADIENTS[i % 4]} flex items-center justify-center shadow-lg`}><Icon className="text-white" size={22} /></div>
                  <p className="font-bold text-slate-900 mt-4">{t}</p>
                  <p className="text-sm text-slate-600 mt-1">{d}</p>
                </div>
              ); })}
            </div>
          </div>
        )}

        <div className="grid lg:grid-cols-2 gap-6">
          <Panel title="Qui peut adhérer ?" Icon={GraduationCap}>
            {tx("adhesion.conditions").split(/\n\s*\n/).map((p, i) => <p key={i} className={`text-slate-600 leading-relaxed whitespace-pre-line ${i ? "mt-3" : ""}`}>{rich(p)}</p>)}
          </Panel>
          <Panel title="Les étapes" Icon={CheckCircle2}>
            <ol className="space-y-4">
              {etapes.map(([t, d = ""], i) => (
                <li key={t} className="flex gap-4">
                  <span className="w-8 h-8 flex-shrink-0 rounded-full bg-orange-600 text-white text-sm font-extrabold flex items-center justify-center">{i + 1}</span>
                  <span><span className="font-bold text-slate-900 block">{t}</span><span className="text-sm text-slate-600">{d}</span></span>
                </li>
              ))}
            </ol>
          </Panel>
        </div>
      </main>
    </>
  );
}

const splitTags = (s) => String(s || "").split(",").map((t) => t.trim()).filter(Boolean);

function PartnerFeature({ p }) {
  return (
    <div className="bg-white rounded-3xl shadow-xl overflow-hidden grid md:grid-cols-3 hover:shadow-2xl transition duration-300">
      <div className="flex items-center justify-center p-10 bg-gradient-to-br from-orange-50 to-amber-100"><PartnerLogo p={p} /></div>
      <div className="md:col-span-2 p-8 md:p-10">
        <div className="flex flex-wrap gap-2">
          <span className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-100 text-orange-700 text-xs font-bold uppercase tracking-wider"><Handshake size={14} /> {p.role}</span>
          {p.depuis && <span className="px-3 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-semibold">Depuis {p.depuis}</span>}
        </div>

      </div>

// « Ils nous soutiennent » (donateurs ayant accepté d'être cités) et formulaire « Faire un don ».
function DonSection() {
  const vide = { donateur_nom: "", donateur_type: "ancien", contact: "", nature: "argent", montant: "", description: "", affectation: "", citer: false, website: "" };
  const [soutiens, setSoutiens] = useState([]);
  const [open, setOpen] = useState(false);
  const [f, setF] = useState(vide);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [sent, setSent] = useState(false);
  useEffect(() => { sb.rpc("donateurs_publics").then(({ data }) => setSoutiens(data || []), () => {}); }, []);
  const set = (k) => (e) => { setF({ ...f, [k]: e.target.value }); setErr(""); };
  const send = async () => {
    if (f.website) return setSent(true); // champ piège anti-robots
    if (f.donateur_nom.trim().length < 2) return setErr("Indiquez votre nom ou celui de votre structure.");
    if (f.contact.trim().length < 6) return setErr("Indiquez un téléphone ou un email pour que la Trésorerie vous recontacte.");
    const montant = f.montant === "" ? null : toInt(f.montant);
    if (montant !== null && (!Number.isFinite(montant) || montant < 0)) return setErr("Montant invalide (chiffres uniquement).");
    if (f.nature === "nature" && f.description.trim().length < 3) return setErr("Décrivez ce que vous souhaitez offrir.");
    setBusy(true);

            <div key={titre}><p className="text-xs font-bold uppercase tracking-wider text-slate-400">{titre}</p>
              <div className="flex flex-wrap gap-2 mt-2">{list.map((s) => <span key={s.nom} className="px-3 py-1.5 rounded-full bg-orange-50 text-orange-800 text-sm font-semibold">{s.nom}</span>)}</div></div>

      <div className="rounded-3xl p-8 text-white shadow-xl" style={{ background: NAVY }}>

        {sent ? (

        ) : !open ? (
          <>
            <p className="text-slate-300 mt-3">Ancien élève, enseignant, entreprise ou particulier : soutenez les activités des élèves de l'ARSTM, en argent ou en nature (matériel, lots, impressions…). Chaque don reçoit un reçu officiel.</p>

            <input value={f.donateur_nom} onChange={set("donateur_nom")} placeholder="Votre nom ou celui de votre structure" className={inputCls} />
