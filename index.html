const NOUVELLES = {
  retenu: ["Stage / emploi obtenu", "bg-emerald-100 text-emerald-700"],
  poste: ["Nouveau poste", "bg-sky-100 text-sky-700"],
  diplome: ["Diplômé(e)", "bg-violet-100 text-violet-700"],
};
// Prochaine occurrence (aujourd'hui compris) d'une date annuelle « MM-JJ ».
const prochaineDate = (mmjj) => {
  const [m, j] = String(mmjj || "").split("-").map(Number);
  if (!m || !j) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const faire = (y) => { const d = new Date(y, m - 1, j); return m === 2 && j === 29 && d.getMonth() !== 1 ? new Date(y, 1, 28) : d; };
  const d = faire(t.getFullYear());
  return d < t ? faire(t.getFullYear() + 1) : d;
};
const dansJours = (d) => { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((d - t) / 86400000); };
const quand = (n) => (n === 0 ? "Aujourd'hui !" : n === 1 ? "Demain" : `Dans ${n} j`);
const jourMois = (d) => d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "long" });

function AdminCommunication({ notify }) {
  const [d, setD] = useState(null);
  const [err, setErr] = useState("");
  const [jours, setJours] = useState(30);
  const [form, setForm] = useState(null);
  const [busy, setBusy] = useState(false);
  const load = async () => {
    const [a, n, dt, ev, jb, cp] = await Promise.all([
      sb.rpc("com_anniversaires"),
      sb.from("com_nouvelles").select("*").order("created_at", { ascending: false }).limit(300),
      sb.from("com_dates").select("*").order("date"),
      sb.from("events").select("id, title, date, time, place, members_only").gte("date", todayISO()).order("date"),
      sb.from("jobs").select("id, title, company, type, cloture").not("cloture", "is", null).gte("cloture", todayISO()).order("cloture"),
      sb.from("adhesion_campagnes").select("annee, ouverture, cloture").order("ouverture", { ascending: false }),
    ]);
    const e = a.error || n.error || dt.error;
    if (e) { setErr(e.message); return; }
    setErr("");
    setD({ anniv: a.data || [], nouv: n.data || [], dates: dt.data || [], events: ev.data || [], jobs: jb.data || [], camp: cp.data || [] });
  };
  useEffect(() => { load(); }, []);
  if (err) return <div className="rounded-2xl bg-rose-50 border border-rose-200 p-5 text-sm text-rose-800">Agenda indisponible : {err}. Vérifiez que le script SQL « lot 8 » a bien été lancé dans Supabase.</div>;
  if (!d) return <p className="text-slate-500">Chargement de l'agenda...</p>;

  // Anniversaires à venir
  const anniv = d.anniv.map((p) => { const dt = prochaineDate(p.jour); return dt ? { ...p, dt, n: dansJours(dt) } : null; })
    .filter((p) => p && p.n <= jours).sort((a, b) => a.n - b.n || String(a.nom).localeCompare(String(b.nom)));
  // Réussites récentes
  const limite = Date.now() - jours * 86400000;
  const nouv = d.nouv.filter((x) => new Date(x.created_at).getTime() >= limite);
  // Agenda à promouvoir (tout trié par date)
  const agenda = [];
  d.events.forEach((e) => { const dt = new Date(e.date + "T00:00:00"); agenda.push({ k: "e" + e.id, dt, label: "Événement", cls: "bg-orange-100 text-orange-700", titre: e.title, detail: [e.time, e.place, e.members_only && "réservé aux membres CGE"].filter(Boolean).join(" · ") }); });
  d.jobs.forEach((j) => { const dt = new Date(j.cloture + "T00:00:00"); agenda.push({ k: "j" + j.id, dt, label: "Offre : clôture", cls: "bg-sky-100 text-sky-700", titre: j.title, detail: [j.type, j.company].filter(Boolean).join(" · ") }); });
  d.camp.forEach((c) => {
    [["ouverture", "Ouverture des adhésions"], ["cloture", "Clôture des adhésions"]].forEach(([k, l]) => {
      const dt = new Date(c[k] + "T00:00:00");
      if (dansJours(dt) >= 0) agenda.push({ k: `c${c.annee}${k}`, dt, label: "Adhésions", cls: "bg-emerald-100 text-emerald-700", titre: `${l} ${c.annee}`, detail: "" });
    });
  });
  d.dates.forEach((x) => {
    const dt = x.chaque_annee ? prochaineDate(String(x.date).slice(5, 10)) : new Date(x.date + "T00:00:00");
    if (dt && dansJours(dt) >= 0) agenda.push({ k: "d" + x.id, dt, label: "Date à retenir", cls: "bg-violet-100 text-violet-700", titre: x.titre, detail: x.description || "" });
  });
  const aVenir = agenda.map((x) => ({ ...x, n: dansJours(x.dt) })).filter((x) => x.n >= 0 && x.n <= jours).sort((a, b) => a.n - b.n);

  const masquer = async (x) => {
    const { error } = await sb.from("com_nouvelles").delete().eq("id", x.id);
    if (error) return notify("Action impossible : " + error.message, "error");
    load();
  };
  const ajouterDate = async () => {
    if (form.titre.trim().length < 3 || !form.date) return notify("Indiquez un titre et une date.", "error");
    setBusy(true);
    const { error } = await sb.from("com_dates").insert({ titre: form.titre.trim(), date: form.date, chaque_annee: form.chaque_annee, description: form.description.trim() || null });
    setBusy(false);
    if (error) return notify("Enregistrement impossible : " + error.message, "error");
    notify("Date ajoutée."); setForm(null); load();
  };
  const supprimerDate = async (x) => {
    const { error } = await sb.from("com_dates").delete().eq("id", x.id);
    if (error) return notify("Suppression impossible : " + error.message, "error");
    notify("Date supprimée."); load();
  };

  const aujourdhui = anniv.filter((p) => p.n === 0).length;
  const cartes = [[Sparkles, "Anniversaires aujourd'hui", aujourdhui], [Calendar, `Anniversaires (${jours} j)`, anniv.length], [Trophy, `Réussites (${jours} derniers j)`, nouv.length], [Megaphone, `À promouvoir (${jours} j)`, aVenir.length]];
  return (
    <div className="space-y-6">
      <div className="flex flex-wrap items-center gap-2">
        <span className="text-sm font-semibold text-slate-600">Période :</span>
        {[7, 30, 60].map((n) => <button key={n} onClick={() => setJours(n)} className={`px-4 py-2 rounded-full text-sm font-semibold ${jours === n ? "bg-slate-900 text-white" : "bg-white shadow-sm text-slate-600"}`}>{n} jours</button>)}
        <button onClick={load} className="ml-auto px-3 py-2 rounded-xl bg-white border border-slate-300 text-xs font-semibold flex items-center gap-1"><RotateCcw size={14} /> Actualiser</button>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {cartes.map(([I, l, v]) => <div key={l} className={`rounded-3xl shadow-sm p-5 ${l.startsWith("Anniversaires aujourd") && v ? "bg-amber-50 ring-2 ring-amber-300" : "bg-white"}`}><I size={20} className="text-orange-600" /><p className="text-3xl font-extrabold text-slate-900 mt-3">{v}</p><p className="text-sm text-slate-500">{l}</p></div>)}
      </div>

      <div className="grid lg:grid-cols-2 gap-6">
        <Panel title="Anniversaires" Icon={Sparkles}>
          {anniv.length === 0 ? <p className="text-sm text-slate-500">Aucun anniversaire sur la période. Les membres renseignent leur date de naissance dans leur profil.</p> : (
            <ul className="divide-y divide-slate-100">
              {anniv.map((p) => (
                <li key={p.id} className="py-2.5 flex items-center gap-3">
                  <Avatar photo={p.photo} name={p.nom} size="w-10 h-10" text="text-sm" />
                  <div className="flex-1 min-w-0">
                    <p className="font-semibold text-slate-900 text-sm truncate">{p.nom}</p>
                    <p className="text-xs text-slate-500 truncate">{[p.type === "ancien" ? ["Ancien", p.poste].filter(Boolean).join(" · ") : [p.filiere, p.promotion && `Promo ${p.promotion}`].filter(Boolean).join(" · "), p.departement && [p.departement, p.poste_cge].filter(Boolean).join(" · ")].filter(Boolean).join(" — ")}</p>
                  </div>
                  <div className="text-right flex-shrink-0">
                    <p className={`text-xs font-bold ${p.n === 0 ? "text-orange-600" : "text-slate-700"}`}>{quand(p.n)}</p>
                    <p className="text-xs text-slate-500">{jourMois(p.dt)}</p>
                  </div>
                </li>
              ))}
            </ul>
          )}
        </Panel>

        <Panel title="Réussites à féliciter" Icon={Trophy}>
          {nouv.length === 0 ? <p className="text-sm text-slate-500">Rien de nouveau sur la période. Elles apparaissent automatiquement : candidature « Retenue », nouveau poste d'un ancien, élève devenu ancien.</p> : (
            <ul className="divide-y divide-slate-100">
              {nouv.map((x) => (
                <li key={x.id} className="py-2.5 flex items-start justify-between gap-3">
                  <div className="min-w-0">
                    <p className="text-sm text-slate-900 flex flex-wrap items-center gap-2"><strong>{x.nom}</strong><span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${(NOUVELLES[x.type] || [])[1] || ""}`}>{(NOUVELLES[x.type] || [x.type])[0]}</span></p>
                    <p className="text-xs text-slate-600 mt-0.5">{x.texte}</p>
                    <p className="text-xs text-slate-400">{fmtDate(x.created_at)}</p>
                  </div>
                  <ConfirmButton onConfirm={() => masquer(x)} confirmLabel="Masquer ?" ariaLabel="Masquer (déjà publié)" className="px-2 py-1 rounded-lg text-xs font-semibold text-slate-500 hover:text-orange-600 whitespace-nowrap">Fait ✓</ConfirmButton>
                </li>
              ))}
            </ul>
          )}
        </Panel>
      </div>

      <Panel title={`À promouvoir · ${jours} prochains jours`} Icon={Megaphone}>
        {aVenir.length === 0 ? <p className="text-sm text-slate-500">Rien de prévu sur la période.</p> : (
          <ul className="divide-y divide-slate-100">
            {aVenir.map((x) => (
              <li key={x.k} className="py-2.5 flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4">
                <span className="text-xs font-bold text-slate-700 sm:w-40 flex-shrink-0">{jourMois(x.dt)} · <span className={x.n <= 3 ? "text-orange-600" : "text-slate-500"}>{quand(x.n)}</span></span>
                <span className={`self-start text-xs px-2 py-0.5 rounded-full font-semibold whitespace-nowrap ${x.cls}`}>{x.label}</span>
                <span className="text-sm text-slate-900 min-w-0"><strong>{x.titre}</strong>{x.detail && <span className="text-slate-500"> · {x.detail}</span>}</span>
              </li>
            ))}
          </ul>
        )}
      </Panel>

      <Panel title={`Dates à retenir (${d.dates.length})`} Icon={Calendar}
        action={!form && <button onClick={() => setForm({ titre: "", date: "", chaque_annee: true, description: "" })} className="px-4 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold flex items-center gap-1"><Plus size={15} /> Ajouter</button>}>
        {form && (
          <div className="mb-5 p-4 rounded-2xl bg-orange-50 border border-orange-100 space-y-3">
            <div className="grid sm:grid-cols-3 gap-3">
              <label className="block sm:col-span-2"><span className="text-xs font-semibold text-slate-600">Titre</span><input value={form.titre} onChange={(e) => setForm({ ...form, titre: e.target.value })} placeholder="ex. Journée mondiale de la mer" className={inputCls} /></label>
              <label className="block"><span className="text-xs font-semibold text-slate-600">Date</span><input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className={inputCls} /></label>
            </div>
            <input value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} placeholder="Note pour la Communication (facultatif)" className={inputCls} />
            <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={form.chaque_annee} onChange={(e) => setForm({ ...form, chaque_annee: e.target.checked })} className="accent-orange-600" /> Revient chaque année (même jour et même mois)</label>
            <div className="flex justify-end gap-2">
              <button onClick={() => setForm(null)} className="px-4 py-2 rounded-xl bg-white border border-slate-300 text-sm">Annuler</button>
              <button onClick={ajouterDate} disabled={busy} className="px-5 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold disabled:opacity-60">{busy ? "Enregistrement..." : "Enregistrer"}</button>
            </div>
          </div>
        )}
        {d.dates.length === 0 ? <p className="text-sm text-slate-500">Aucune date. Exemples : Journée de l'Ingénieur, Journée mondiale de la mer (dernier jeudi de septembre), anniversaire de la CGE (mai)…</p> : (
          <ul className="divide-y divide-slate-100">
            {d.dates.map((x) => (
              <li key={x.id} className="py-2.5 flex items-center justify-between gap-3 text-sm">
                <span className="min-w-0"><strong className="text-slate-900">{x.titre}</strong><span className="text-slate-500"> · {x.chaque_annee ? `chaque année le ${new Date(x.date + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long" })}` : fmtDate(x.date)}</span>{x.description && <span className="text-slate-400"> · {x.description}</span>}</span>
                <ConfirmButton onConfirm={() => supprimerDate(x)} confirmLabel="Supprimer ?" ariaLabel="Supprimer la date" className="p-1.5 rounded-lg text-rose-600 hover:bg-rose-50"><Trash2 size={15} /></ConfirmButton>
              </li>
            ))}
          </ul>
        )}
      </Panel>
    </div>
  );
}

// Tableau de bord du bureau : les chiffres clés en un coup d'œil.
function AdminDashboard({ members, jobs, applications, registrations, events, messages, temoignages, mentoratAll, sondages, onOpen }) {
  const actifs = members.filter((m) => m.statut === "actif");
  const pending = members.filter((m) => m.statut === "en_attente").length;
  const anciens = actifs.filter((m) => m.type === "ancien").length;
  const mentors = actifs.filter((m) => m.type === "ancien" && m.data?.mentor).length;
  const dispo = actifs.filter((m) => m.type !== "ancien" && m.data?.disponible).length;
  const open = jobs.filter((j) => !isExpired(j));
  const retenues = applications.filter((a) => a.status === "Retenue").length;
  const upcomingIds = new Set(events.filter((e) => daysUntil(e.date) >= 0).map((e) => e.id));
  const insc = registrations.filter((r) => upcomingIds.has(r.eventId)).length;
  const unread = messages.filter((m) => !m.lu).length;
  const temoPending = temoignages.filter((t) => !t.publie).length;
  const mentoratPending = mentoratAll.filter((m) => m.statut === "en_attente").length;
  const pollsOpen = sondages.filter(isOpenPoll).length;
  const closingSoon = open.filter((j) => j.cloture && daysUntil(j.cloture) <= 7).sort(byDeadline);

  const cards = [
    [UserPlus, pending, "Demandes d'inscription", () => onOpen("members"), pending > 0],
    [Mail, unread, "Messages non lus", () => onOpen("messages"), unread > 0],
    [Quote, temoPending, "Témoignages à valider", () => onOpen("temoignages"), temoPending > 0],
    [Users, actifs.length, "Membres actifs", () => onOpen("members")],
    [GraduationCap, anciens, "Anciens inscrits", () => onOpen("members", { type: "ancien" })],
    [Handshake, mentors, "Mentors disponibles", () => onOpen("members", { type: "ancien" })],
    [MessageCircle, mentoratPending, "Demandes de mentorat sans réponse"],
    [Target, dispo, "Élèves disponibles pour un stage", () => onOpen("members", { dispo: true })],
    [Briefcase, open.length, "Opportunités ouvertes", () => onOpen("jobs")],
    [Send, applications.length, "Candidatures reçues", () => onOpen("applications")],
    [Trophy, retenues, "Candidatures retenues", () => onOpen("applications")],
    [Vote, pollsOpen, "Sondages ouverts", () => onOpen("sondages")],
  ];

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {cards.map(([Icon, v, l, fn, alert]) => (
          <button key={l} onClick={fn} disabled={!fn} className={`rounded-3xl shadow-sm p-5 text-left transition ${fn ? "hover:shadow-lg" : "cursor-default"} ${alert ? "bg-amber-50 ring-2 ring-amber-300" : "bg-white"}`}>
            <Icon size={20} className={alert ? "text-amber-600" : "text-orange-600"} />
            <p className="text-3xl font-extrabold text-slate-900 mt-3">{v}</p>
            <p className="text-sm text-slate-500 leading-snug">{l}</p>
          </button>
        ))}
      </div>
      <div className="grid lg:grid-cols-2 gap-6">
        <Panel title="Candidatures par statut" Icon={BarChart3}>
          {applications.length === 0 ? <p className="text-sm text-slate-500">Aucune candidature pour le moment.</p> : (
            <div className="space-y-4">
              {APP_STATUSES.map((s) => {
                const n = applications.filter((a) => a.status === s).length;
                return (
                  <div key={s}>
                    <div className="flex justify-between text-sm"><span className="font-medium text-slate-700">{s}</span><span className="font-bold text-slate-900">{n}</span></div>
                    <div className="mt-1.5 h-2.5 rounded-full bg-slate-100 overflow-hidden"><div className="h-full rounded-full bg-gradient-to-r from-orange-500 to-amber-400" style={{ width: `${(n / applications.length) * 100}%` }} /></div>
                  </div>
                );
              })}
            </div>
          )}
        </Panel>
        <Panel title="À surveiller cette semaine" Icon={Flame}>
          {closingSoon.length === 0 && insc === 0 ? <p className="text-sm text-slate-500">Rien d'urgent : aucune offre ne ferme dans les 7 prochains jours.</p> : (
            <ul className="divide-y divide-slate-100">
              {closingSoon.map((j) => (
                <li key={j.id} className="py-3 flex items-center justify-between gap-3">
                  <span className="text-sm font-semibold text-slate-900">{j.title}</span>
                  <Deadline date={j.cloture} />
                </li>
              ))}
              {insc > 0 && <li className="py-3 text-sm text-slate-700"><strong>{insc}</strong> inscription{insc > 1 ? "s" : ""} aux événements à venir.</li>}
            </ul>
          )}
        </Panel>
      </div>
    </div>
  );
}

// Rubriques de l'administration et droit nécessaire pour y accéder (null = administrateurs uniquement).
const TAB_PERMS = {
  dashboard: null, news: "news", events: "events", jobs: "jobs", documents: "documents", galerie: "galerie", sondages: "sondages",
  temoignages: "temoignages", partenaires: "partenaires", alumni: "alumni", members: null,
  // Une valeur peut être une liste : l'onglet s'affiche si le membre a au moins un de ces droits.
  finances: ["tresorerie", "finances_lecture"], adhesions: ["adhesions", "tresorerie"], communication: "communication",
  applications: "candidatures", messages: "messages",
  reglages: "textes", images: "textes", droits: null, journal: null,
};

function AdminPanel({ news, setNews, events, setEvents, jobs, setJobs, alumni, setAlumni, temoignages, setTemoignages, mentoratAll, documents, setDocuments, photos, setPhotos, partenaires, setPartenaires, sondages, setSondages, countsFor, applications, setApplications, registrations, members, setMembers, messages, setMessages, currentId, notify, reload, isAdmin, can, settings, saveSettings }) {
  const allowed = (k) => isAdmin || [].concat(TAB_PERMS[k] || []).some((p) => can(p));
  const [tab, setTab] = useState(() => Object.keys(TAB_PERMS).find(allowed) || "news");
  const [form, setForm] = useState({});
  const [editingId, setEditingId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [viewing, setViewing] = useState(null);
  const [mq, setMq] = useState("");
  const [mf, setMf] = useState("");
  const [mt, setMt] = useState("");
  const [dispoOnly, setDispoOnly] = useState(false);
  const [bulkPromo, setBulkPromo] = useState("");
  const [postesEdit, setPostesEdit] = useState(null);
  const formRef = useRef(null);

  const store = { news: [news, setNews], events: [events, setEvents], jobs: [jobs, setJobs], documents: [documents, setDocuments], temoignages: [temoignages, setTemoignages], partenaires: [partenaires, setPartenaires], alumni: [alumni, setAlumni] };
  const cfg = ADMIN_SECTIONS[tab];
  const [items, setItems] = store[tab] || [[], () => {}];
  const pending = members.filter((m) => m.statut === "en_attente");
  const active = members.filter((m) => m.statut === "actif");
  const unread = messages.filter((m) => !m.lu).length;
  const temoPending = temoignages.filter((t) => !t.publie).length;
  const shownMembers = active.filter((m) =>
    (!mf || m.filiere === mf) && (!mt || (m.type || "eleve") === mt) && (!dispoOnly || m.data?.disponible)
    && (!mq || [accountName(m), m.email, m.matricule, m.promotion, m.data?.objectif, m.data?.poste, m.data?.entreprise].join(" ").toLowerCase().includes(mq.toLowerCase())));
  const elevePromos = [...new Set(active.filter((m) => m.type !== "ancien" && m.promotion).map((m) => m.promotion))].sort();
  const visibleField = (f) => !f.showIf || f.showIf(form);

  const resetForm = () => { setForm({}); setEditingId(null); };
  const switchTab = (k) => { setTab(k); resetForm(); };
  const openFromDashboard = (k, opts = {}) => { if (opts.dispo) setDispoOnly(true); if (opts.type) setMt(opts.type); switchTab(k); };

  // ----- Contenus génériques -----
  const save = async () => {
    if (saving) return;
    const fields = cfg.fields.filter(visibleField);
    const missing = fields.find((f) => !f.optional && !["checkbox", "select", "image", "file"].includes(f.type) && !String(form[f.k] ?? "").trim());
    if (missing) return notify(`Le champ « ${missing.label} » est obligatoire.`, "error");
    const badUrl = fields.find((f) => f.type === "url" && form[f.k] && !/^https?:\/\//i.test(String(form[f.k]).trim()));
    if (badUrl) return notify(`Le champ « ${badUrl.label} » doit commencer par https://`, "error");
    const custom = cfg.validate && cfg.validate(form);
    if (custom) return notify(custom, "error");
    const defaults = {}; cfg.fields.forEach((f) => { if (f.type === "select") defaults[f.k] = f.opts[0]; });
    const payload = cfg.toDb({ ...defaults, ...form });
    setSaving(true);
    const query = editingId ? sb.from(cfg.table).update(payload).eq("id", editingId) : sb.from(cfg.table).insert(payload);
    const { data, error } = await query.select().single();
    setSaving(false);
    if (error) return notify("Enregistrement impossible : " + error.message, "error");
    const item = cfg.fromDb(data);
    const id = editingId;
    setItems((list) => (id ? list.map((x) => (x.id === id ? item : x)) : [item, ...list]));
    notify(id ? "Modifications enregistrées." : "Ajouté avec succès.");
    resetForm();
  };
  const startEdit = (item) => {
    setForm({ ...item }); setEditingId(item.id);
    if (formRef.current) formRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  const remove = async (item) => {
    const { error } = await sb.from(cfg.table).delete().eq("id", item.id);
    if (error) return notify("Suppression impossible : " + error.message, "error");
    if (cfg.onDelete) await cfg.onDelete(item);
    setItems((list) => list.filter((x) => x.id !== item.id));
    if (editingId === item.id) resetForm();
    notify("Supprimé.");
  };
  const togglePublish = async (t) => {
    const { error } = await sb.from("temoignages").update({ publie: !t.publie }).eq("id", t.id);
    if (error) return notify("Mise à jour impossible : " + error.message, "error");
    setTemoignages((list) => list.map((x) => (x.id === t.id ? { ...x, publie: !t.publie } : x)));
    notify(t.publie ? "Témoignage retiré du site." : "Témoignage publié !");
  };

  // ----- Membres -----
  const updateMember = async (m, patch, msg) => {
    const { data, error } = await sb.from("profiles").update(patch).eq("id", m.id).select().single();
    if (error) return notify("Action impossible : " + error.message, "error");
    setMembers((list) => list.map((x) => (x.id === m.id ? data : x)));
    notify(msg);
  };
  const deleteMember = async (m, msg) => {
    if (m.data?.cv?.path) await sb.storage.from("cvs").remove([m.data.cv.path]);
    const { error } = await sb.rpc("admin_delete_user", { target: m.id });
    if (error) return notify("Suppression impossible : " + error.message, "error");
    setMembers((list) => list.filter((x) => x.id !== m.id));
    setApplications((list) => list.filter((a) => a.userId !== m.id));
    notify(msg);
  };
  const promoteClass = async () => {
    const { data, error } = await sb.from("profiles").update({ type: "ancien" }).eq("statut", "actif").eq("type", "eleve").eq("promotion", bulkPromo).select();
    if (error) return notify("Action impossible : " + error.message, "error");
    setMembers((list) => list.map((x) => data.find((d) => d.id === x.id) || x));
    notify(`${data.length} membre${data.length > 1 ? "s" : ""} de la promotion ${bulkPromo} passé${data.length > 1 ? "s" : ""} en anciens.`);
    setBulkPromo("");
  };
  const openProfile = (userId) => {
    const m = members.find((x) => x.id === userId);
    if (!m) return notify("Ce membre n'existe plus.", "error");
    setViewing({ profile: rowToProfile(m), name: accountName(m) });
  };

  // ----- Candidatures et messages -----
  const setStatus = async (id, status) => {
    const { error } = await sb.from("applications").update({ status }).eq("id", id);
    if (error) return notify("Mise à jour impossible : " + error.message, "error");
    setApplications((list) => list.map((a) => (a.id === id ? { ...a, status } : a)));
    notify(`Statut mis à jour : ${status}`);
  };
  const toggleRead = async (m) => {
    const { error } = await sb.from("messages").update({ lu: !m.lu }).eq("id", m.id);
    if (error) return notify("Mise à jour impossible : " + error.message, "error");
    setMessages((list) => list.map((x) => (x.id === m.id ? { ...x, lu: !m.lu } : x)));
  };
  const deleteMessage = async (m) => {
    const { error } = await sb.from("messages").delete().eq("id", m.id);
    if (error) return notify("Suppression impossible : " + error.message, "error");
    setMessages((list) => list.filter((x) => x.id !== m.id));
    notify("Message supprimé.");
  };

  const sec = (k) => [k, k === "temoignages" && temoPending ? { ...ADMIN_SECTIONS[k], label: `${ADMIN_SECTIONS[k].label} (${temoPending})` } : ADMIN_SECTIONS[k]];
  const tabs = [
    ["dashboard", { label: "Tableau de bord", icon: BarChart3 }],
    sec("news"), sec("events"), sec("jobs"), sec("documents"),
    ["galerie", { label: "Galerie photos", icon: Camera }],
    ["sondages", { label: "Sondages", icon: Vote }],
    sec("temoignages"), sec("partenaires"), sec("alumni"),
    ["members", { label: `Membres${pending.length ? ` (${pending.length} en attente)` : ""}`, icon: Users }],
    ["adhesions", { label: "Adhésions", icon: UserPlus }],
    ["finances", { label: "Finances", icon: BarChart3 }],
    ["communication", { label: "Communication", icon: Megaphone }],
    ["applications", { label: `Candidatures (${applications.length})`, icon: Send }],
    ["messages", { label: `Messages${unread ? ` (${unread})` : ""}`, icon: Inbox }],
    ["reglages", { label: "Textes & réglages", icon: SettingsIcon }],
    ["images", { label: "Images & logos", icon: ImageIcon }],
    ["droits", { label: "Droits & accès", icon: UserCog }],
    ["journal", { label: "Journal & connexions", icon: HistoryIcon }],
  ].filter(([k]) => allowed(k));

  const renderField = (f) => {
    if (!visibleField(f)) return null;
    const val = form[f.k];
    const lab = <span className="text-xs font-semibold text-slate-600">{f.label}{f.optional && <span className="font-normal text-slate-400"> (facultatif)</span>}</span>;
    if (f.type === "image") return <ImageField key={f.k} label={lab} value={val} folder={f.folder} shape={f.shape} notify={notify} onChange={(url) => setForm((prev) => ({ ...prev, [f.k]: url }))} />;
    if (f.type === "file") return <FileField key={f.k} label={lab} form={form} setForm={setForm} notify={notify} />;
    const onChange = (e) => setForm({ ...form, [f.k]: f.type === "checkbox" ? e.target.checked : e.target.value });
    if (f.type === "checkbox") return <label key={f.k} className="flex items-center gap-2 text-sm"><input type="checkbox" checked={!!val} onChange={onChange} className="w-4 h-4 accent-orange-600" /> {f.label}</label>;
    if (f.type === "select") return <label key={f.k} className="block">{lab}<select value={val ?? f.opts[0]} onChange={onChange} className={inputCls}>{f.opts.map((o) => <option key={o} value={o}>{(f.labels && f.labels[o]) || o || "— Non précisé —"}</option>)}</select></label>;
    if (f.type === "textarea") return <label key={f.k} className="block">{lab}<textarea rows={f.k === "texte" ? 6 : 3} value={val ?? ""} onChange={onChange} placeholder={f.placeholder} className={inputCls} /></label>;
    return <label key={f.k} className="block">{lab}<input type={f.type === "url" ? "url" : f.type || "text"} value={val ?? ""} onChange={onChange} placeholder={f.placeholder} className={inputCls} /></label>;
  };

  const hints = {
    temoignages: "Les anciens inscrits peuvent aussi proposer leur témoignage depuis leur espace : il apparaît alors ici, à valider.",
    alumni: "Pour les anciens qui n'ont pas (encore) de compte. Ceux qui s'inscrivent sur le site apparaissent automatiquement dans l'annuaire.",
    documents: "Les fichiers sont privés : chaque téléchargement passe par un lien temporaire. Les documents « réservés aux membres » sont invisibles pour les visiteurs.",
    partenaires: "Les partenaires « officiels » sont mis en avant sur l'accueil ; les autres apparaissent en logos et sur la page Partenaires.",
  };

  return (
    <main className="max-w-6xl mx-auto px-4 py-12">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
        <p className="text-sm text-slate-500">Les modifications sont enregistrées en ligne et visibles immédiatement par tous.</p>
        <button onClick={() => { reload(); notify("Données actualisées."); }} className="self-start px-4 py-2 rounded-xl bg-white shadow-sm text-sm font-semibold text-slate-600 hover:text-orange-600 flex items-center gap-2"><RotateCcw size={15} /> Actualiser</button>
      </div>

      <div className="flex flex-wrap gap-2 mb-6">
        {tabs.map(([k, s]) => { const I = s.icon; return (
          <button key={k} onClick={() => switchTab(k)} className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition ${tab === k ? "bg-orange-600 text-white shadow-md" : "bg-white shadow-sm text-slate-700 hover:text-orange-600"}`}><I size={16} /> {s.label}</button>
        ); })}
      </div>

      {tab === "dashboard" && <AdminDashboard members={members} jobs={jobs} applications={applications} registrations={registrations} events={events} messages={messages} temoignages={temoignages} mentoratAll={mentoratAll} sondages={sondages} onOpen={openFromDashboard} />}
      {tab === "images" && <ImagesManager notify={notify} />}
      {tab === "galerie" && <AdminGallery photos={photos} setPhotos={setPhotos} notify={notify} />}
      {tab === "sondages" && <AdminPolls sondages={sondages} setSondages={setSondages} countsFor={countsFor} notify={notify} />}
      {tab === "reglages" && <SettingsManager settings={settings} saveSettings={saveSettings} notify={notify} />}
      {tab === "droits" && <RightsManager members={members} updateMember={updateMember} />}
      {tab === "journal" && <ActivityLog members={members} />}
      {tab === "adhesions" && <AdminAdhesions can={can} notify={notify} />}
      {tab === "finances" && <AdminFinances can={can} notify={notify} />}
      {tab === "communication" && <AdminCommunication notify={notify} />}

      {tab === "members" && (
        <div className="space-y-6">
          <Panel title={`Demandes d'inscription (${pending.length})`} Icon={UserPlus}>
            {pending.length === 0 ? <p className="text-sm text-slate-500">Aucune demande en attente.</p> : (
              <ul className="divide-y divide-slate-100">
                {pending.map((m) => (
                  <li key={m.id} className="py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div className="flex items-center gap-3">
                      <Avatar name={accountName(m)} size="w-11 h-11" text="text-sm" />
                      <div>
                        <p className="font-bold text-slate-900 flex flex-wrap items-center gap-2">{accountName(m)} {m.type === "ancien" && <span className="text-xs px-2 py-0.5 rounded-full bg-sky-100 text-sky-700">Ancien</span>}</p>
                        <p className="text-sm text-slate-500">Matricule <strong>{m.matricule || "—"}</strong> · {m.filiere || "filière ?"} · Promo {m.promotion || "?"}</p>
                        <p className="text-xs text-slate-500">{m.email} · demande du {fmtDate(m.created_at)}</p>
                        {postesValides(m.data?.postes_cge).length > 0 && <p className="text-xs text-orange-700 font-semibold mt-0.5">Postes CGE déclarés : {postesValides(m.data.postes_cge).map((x) => `${x.intitule} ${periodePoste(x)}`).join(" ; ")}</p>}
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={() => updateMember(m, { statut: "actif" }, `Compte validé : ${accountName(m)}`)} className="px-4 py-2 rounded-xl bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700 flex items-center gap-1"><CheckCircle2 size={15} /> Valider</button>
                      <ConfirmButton onConfirm={() => deleteMember(m, `Demande refusée : ${accountName(m)}`)} confirmLabel="Refuser ?" className="px-4 py-2 rounded-xl bg-white border border-slate-300 text-sm font-semibold text-slate-600 hover:text-rose-600">Refuser</ConfirmButton>
                    </div>
                  </li>
                ))}
              </ul>
            )}
          </Panel>

          {elevePromos.length > 0 && (
            <Panel title="Fin d'année : passer une promotion en anciens" Icon={GraduationCap}>
              <p className="text-sm text-slate-500 -mt-3 mb-4">Les élèves de la promotion choisie deviennent « anciens » : ils apparaissent dans l'annuaire et peuvent devenir mentors. Leur compte, leur profil et leur CV sont conservés. Leur poste au bureau, s'ils en ont un, rejoint leur historique « postes à la CGE », et ils sont retirés de leur département.</p>
              <div className="flex flex-col sm:flex-row gap-2">
                <select value={bulkPromo} onChange={(e) => setBulkPromo(e.target.value)} className={inputCls + " mt-0 sm:w-72"}>
                  <option value="">Choisir une promotion...</option>
                  {elevePromos.map((p) => <option key={p} value={p}>Promotion {p} ({active.filter((m) => m.type !== "ancien" && m.promotion === p).length} élèves)</option>)}
                </select>
                {bulkPromo && <ConfirmButton onConfirm={promoteClass} confirmLabel={`Confirmer pour la promo ${bulkPromo} ?`} className="px-5 py-2.5 rounded-xl bg-orange-600 text-white text-sm font-semibold hover:bg-orange-700">Passer en anciens</ConfirmButton>}
              </div>
            </Panel>
          )}

          <Panel title={`Membres actifs (${active.length})`} Icon={Users}>
            <div className="flex flex-col lg:flex-row gap-2 mb-5">
              <div className="relative flex-1">
                <Search size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
                <input value={mq} onChange={(e) => setMq(e.target.value)} placeholder="Nom, email, matricule, entreprise..." className={inputCls + " mt-0 pl-10"} />
              </div>
              <select value={mt} onChange={(e) => setMt(e.target.value)} className={inputCls + " mt-0 lg:w-40"}>
                <option value="">Tous</option><option value="eleve">Élèves</option><option value="ancien">Anciens</option>
              </select>
              <select value={mf} onChange={(e) => setMf(e.target.value)} className={inputCls + " mt-0 lg:w-52"}>
                <option value="">Toutes les filières</option>{FILIERES.map((f) => <option key={f}>{f}</option>)}
              </select>
              <label className={`flex items-center gap-2 text-sm font-semibold whitespace-nowrap px-4 py-2.5 rounded-xl border cursor-pointer ${dispoOnly ? "border-emerald-400 bg-emerald-50 text-emerald-700" : "border-slate-300 text-slate-600"}`}>
                <input type="checkbox" checked={dispoOnly} onChange={(e) => setDispoOnly(e.target.checked)} className="accent-emerald-600" /> Dispo stage
              </label>
            </div>
            {(mq || mf || mt || dispoOnly) && <p className="text-sm text-slate-500 mb-3">{shownMembers.length} membre{shownMembers.length > 1 ? "s" : ""} correspond{shownMembers.length > 1 ? "ent" : ""} à la recherche.</p>}
            <ul className="divide-y divide-slate-100">
              {shownMembers.map((m) => {
                const self = m.id === currentId;
                const ancien = m.type === "ancien";
                return (
                  <li key={m.id} className="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div className="flex items-center gap-3 min-w-0">
                      <Avatar photo={m.data?.photo} name={accountName(m)} size="w-10 h-10" text="text-sm" />
                      <div className="min-w-0">
                        <p className="font-semibold text-slate-900 flex flex-wrap items-center gap-2">
                          {accountName(m)}
                          {m.role === "admin" && <span className="text-xs px-2 py-0.5 rounded-full bg-slate-900 text-white">Admin</span>}
                          {ancien && <span className="text-xs px-2 py-0.5 rounded-full bg-sky-100 text-sky-700">Ancien</span>}
                          {ancien && m.data?.mentor && <span className="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">Mentor</span>}
                          {!ancien && m.data?.disponible && <span className="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">Dispo stage</span>}
                          {m.role !== "admin" && (m.permissions || []).length > 0 && <span className="text-xs px-2 py-0.5 rounded-full bg-violet-100 text-violet-700">Droits délégués</span>}
                          {m.membre_cge && <span className="text-xs px-2 py-0.5 rounded-full bg-orange-100 text-orange-700">Membre CGE{m.numero_membre ? ` · ${m.numero_membre}` : ""}</span>}
                          {m.membre_cge && <RetardBadge uid={m.id} />}
                          {m.departement && <span className="text-xs px-2 py-0.5 rounded-full bg-violet-100 text-violet-700">{m.departement}{m.poste_cge ? ` · ${m.poste_cge}` : ""}</span>}
                          {self && <span className="text-xs px-2 py-0.5 rounded-full bg-orange-100 text-orange-700">Vous</span>}
                        </p>
                        <p className="text-xs text-slate-500">{[m.email, m.matricule, m.filiere, m.promotion && `Promo ${m.promotion}`].filter(Boolean).join(" · ")}</p>
                        {ancien && (m.data?.poste || m.data?.entreprise) && <p className="text-xs text-slate-600 mt-0.5">{[m.data.poste, m.data.entreprise].filter(Boolean).join(" · ")}</p>}
                        {ancien && postesValides(m.data?.postes_cge).length > 0 && <p className="text-xs text-orange-700 mt-0.5">CGE : {postesValides(m.data.postes_cge).map((x) => `${x.intitule} ${periodePoste(x)}`).join(" ; ")}</p>}
                        {!ancien && m.data?.objectif && <p className="text-xs text-slate-600 mt-0.5 italic">Objectif : {m.data.objectif}</p>}
                      </div>
                    </div>
                    <div className="flex flex-wrap items-center gap-2">
                      <button onClick={() => openProfile(m.id)} className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-xs font-semibold text-slate-700 hover:text-orange-600 flex items-center gap-1"><Eye size={14} /> Profil</button>
                      {ancien && <button onClick={() => setPostesEdit(m)} className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-xs font-semibold text-slate-700 hover:text-orange-600 flex items-center gap-1"><Award size={14} /> Postes CGE</button>}
                      <ConfirmButton onConfirm={() => updateMember(m, { type: ancien ? "eleve" : "ancien" }, ancien ? `${accountName(m)} est de nouveau « élève ».` : `${accountName(m)} est maintenant « ancien ».`)}
                        confirmLabel="Confirmer ?" className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-xs font-semibold text-slate-700 hover:text-orange-600 flex items-center gap-1">
                        <GraduationCap size={14} /> {ancien ? "Repasser élève" : "Passer ancien"}
                      </ConfirmButton>
                      {!self && (
                        <ConfirmButton onConfirm={() => updateMember(m, { role: m.role === "admin" ? "membre" : "admin" }, m.role === "admin" ? `${accountName(m)} n'est plus administrateur.` : `${accountName(m)} est maintenant administrateur.`)}
                          confirmLabel={m.role === "admin" ? "Retirer ?" : "Nommer ?"} className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-xs font-semibold text-slate-700 hover:text-orange-600 flex items-center gap-1">
                          <Shield size={14} /> {m.role === "admin" ? "Retirer admin" : "Nommer admin"}
                        </ConfirmButton>
                      )}
                      {!self && <ConfirmButton onConfirm={() => deleteMember(m, `Membre supprimé : ${accountName(m)}`)} confirmLabel="Supprimer ?" ariaLabel="Supprimer ce membre" className="p-2 rounded-lg text-rose-600 hover:bg-rose-50"><Trash2 size={16} /></ConfirmButton>}
                    </div>
                  </li>
                );
              })}
              {shownMembers.length === 0 && <li className="py-3 text-sm text-slate-500">Aucun membre ne correspond.</li>}
            </ul>
          </Panel>
        </div>
      )}

      {tab === "applications" && (
        <Panel title="Candidatures reçues" Icon={Send}>
          {applications.length === 0 ? <p className="text-sm text-slate-500">Aucune candidature pour le moment.</p> : (
            <ul className="divide-y divide-slate-100">
              {[...applications].reverse().map((a) => (
                <li key={a.id} className="py-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
                  <div>
                    <p className="font-bold text-slate-900 flex flex-wrap items-center gap-2">{a.applicant} <RetardBadge uid={a.userId} /></p>
                    <p className="text-sm text-slate-600">{a.title}{a.company && ` · ${a.company}`}</p>
                    <p className="text-xs text-slate-500 mt-0.5">{a.email || "email non renseigné"} · {a.cvName ? `CV : ${a.cvName}` : "pas de CV déposé"} · {fmtDate(a.date)}</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <select value={a.status} onChange={(e) => setStatus(a.id, e.target.value)} className={`px-3 py-2 rounded-xl text-xs font-bold border-0 focus:ring-2 focus:ring-orange-500 ${STATUS_STYLES[a.status] || ""}`}>
                      {APP_STATUSES.map((s) => <option key={s}>{s}</option>)}
                    </select>
                    <button onClick={() => openProfile(a.userId)} className="px-3 py-2 rounded-xl bg-white border border-slate-300 text-xs font-semibold text-slate-700 hover:text-orange-600 flex items-center gap-1"><Eye size={14} /> Profil & CV</button>
                    <ConfirmButton
                      onConfirm={async () => {
                        const { error } = await sb.from("applications").delete().eq("id", a.id);
                        if (error) return notify("Suppression impossible : " + error.message, "error");
                        setApplications((list) => list.filter((x) => x.id !== a.id));
                        notify("Candidature supprimée.");
                      }}
                      confirmLabel="Supprimer ?" ariaLabel="Supprimer la candidature" className="p-2 rounded-xl text-rose-600 hover:bg-rose-50"><Trash2 size={16} /></ConfirmButton>
                  </div>
                </li>
              ))}
            </ul>
          )}
        </Panel>
      )}

      {tab === "messages" && (
        <Panel title={`Messages reçus (${messages.length})`} Icon={Inbox}>
          {messages.length === 0 ? <p className="text-sm text-slate-500">Aucun message pour le moment.</p> : (
            <ul className="space-y-3">
              {messages.map((m) => (
                <li key={m.id} className={`p-5 rounded-2xl border transition ${m.lu ? "border-slate-200" : "border-orange-300 bg-orange-50"}`}>
                  <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-2">
                    <div>
                      <p className="font-bold text-slate-900 flex flex-wrap items-center gap-2">{m.name} {!m.lu && <NewBadge />}</p>
                      <p className="text-xs text-slate-500">{m.email} · {m.subject} · {fmtDate(m.created_at)}</p>
                    </div>
                    <div className="flex items-center gap-1 flex-shrink-0">
                      <a href={`mailto:${m.email}?subject=${encodeURIComponent("Re : " + m.subject + " — CGE ARSTM")}`} onClick={() => { if (!m.lu) toggleRead(m); }} className="px-3 py-1.5 rounded-lg bg-orange-600 text-white text-xs font-semibold hover:bg-orange-700 flex items-center gap-1"><Send size={13} /> Répondre</a>
                      <button onClick={() => toggleRead(m)} className="p-2 rounded-lg text-slate-500 hover:bg-white" title={m.lu ? "Marquer comme non lu" : "Marquer comme lu"} aria-label={m.lu ? "Marquer comme non lu" : "Marquer comme lu"}>{m.lu ? <Mail size={16} /> : <MailOpen size={16} />}</button>
                      <ConfirmButton onConfirm={() => deleteMessage(m)} confirmLabel="Supprimer ?" ariaLabel="Supprimer le message" className="p-2 rounded-lg text-rose-600 hover:bg-rose-50"><Trash2 size={16} /></ConfirmButton>
                    </div>
                  </div>
                  <p className="text-sm text-slate-700 mt-3 whitespace-pre-line">{m.body}</p>
                </li>
              ))}
            </ul>
          )}
        </Panel>
      )}

      {cfg && (
        <div className="grid lg:grid-cols-2 gap-6">
          <div ref={formRef} className="scroll-mt-24">
            <Panel title={editingId ? "Modifier" : "Ajouter"} Icon={editingId ? Pencil : Plus}>
              {hints[tab] && !editingId && <p className="text-sm text-slate-500 -mt-3 mb-4">{hints[tab]}</p>}
              <div className="space-y-3">
                {cfg.fields.map(renderField)}
                <div className="flex gap-2 pt-1">
                  {editingId && <button onClick={resetForm} className="flex-1 py-3 rounded-xl bg-white border border-slate-300 font-semibold text-slate-700">Annuler</button>}
                  <button onClick={save} disabled={saving} className="flex-1 py-3 rounded-xl bg-orange-600 text-white font-semibold hover:bg-orange-700 disabled:opacity-60">{saving ? "Enregistrement..." : editingId ? "Enregistrer les modifications" : "Ajouter"}</button>
                </div>
              </div>
            </Panel>
          </div>
          <Panel title={`Contenu existant (${items.length})`} Icon={Shield}>
            <ul className="divide-y divide-slate-100">
              {items.map((i) => {
                const count = tab === "events" ? registrations.filter((r) => r.eventId === i.id).length : null;
                const past = (tab === "events" && daysUntil(i.date) < 0) || (tab === "jobs" && isExpired(i));
                return (
                  <li key={i.id} className={`py-3 flex items-center justify-between gap-3 ${editingId === i.id ? "bg-orange-50 -mx-3 px-3 rounded-xl" : ""}`}>
                    <div className="text-sm text-slate-700 min-w-0">
                      {tab === "jobs" && <span className="mr-2"><TypeBadge type={i.type} /></span>}
                      <span className={past ? "text-slate-400" : ""}>{cfg.show(i)}</span>
                      {count !== null && <span className="ml-2 text-xs px-2 py-0.5 rounded-full bg-orange-100 text-orange-700 font-semibold whitespace-nowrap">{count} inscrit{count > 1 ? "s" : ""}</span>}
                      {past && <span className="ml-2 text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 font-semibold">{tab === "jobs" ? "clôturée" : "passé"}</span>}
                      {tab === "documents" && <span className="ml-2 text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-semibold">{{ fichier: "fichier", lien: "lien", video: "vidéo" }[i.type] || i.type}</span>}
                      {tab === "documents" && i.members_only && <span className="ml-2 text-xs px-2 py-0.5 rounded-full bg-slate-900 text-white font-semibold">membres</span>}
                      {tab === "temoignages" && <span className={`ml-2 text-xs px-2 py-0.5 rounded-full font-semibold ${i.publie ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}`}>{i.publie ? "publié" : "à valider"}</span>}
                    </div>
                    <div className="flex items-center gap-1 flex-shrink-0">
                      {tab === "temoignages" && <button onClick={() => togglePublish(i)} className={`px-2.5 py-1.5 rounded-lg text-xs font-semibold ${i.publie ? "bg-white border border-slate-300 text-slate-600" : "bg-emerald-600 text-white hover:bg-emerald-700"}`}>{i.publie ? "Dépublier" : "Publier"}</button>}
                      <button onClick={() => startEdit(i)} className="p-2 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-orange-600" aria-label="Modifier" title="Modifier"><Pencil size={16} /></button>
                      <ConfirmButton onConfirm={() => remove(i)} confirmLabel="Supprimer ?" ariaLabel="Supprimer" className="p-2 rounded-lg text-rose-600 hover:bg-rose-50"><Trash2 size={16} /></ConfirmButton>
                    </div>
                  </li>
                );
              })}
              {items.length === 0 && <li className="py-3 text-sm text-slate-500">Rien pour l'instant.</li>}
            </ul>
          </Panel>
        </div>
      )}

      {viewing && <CVPreview profile={viewing.profile} fullName={viewing.name} notify={notify} onClose={() => setViewing(null)} />}
      {postesEdit && <PostesAdminDialog m={postesEdit} onClose={() => setPostesEdit(null)}
        onSave={(postes) => updateMember(postesEdit, { data: { ...(postesEdit.data || {}), cge_ancien: postes.length ? "oui" : "non", postes_cge: postes } }, `Postes CGE de ${accountName(postesEdit)} enregistrés.`)} />}
    </main>
  );
}

// =====================================================================
// DÉMARRAGE — si une erreur survient, on l'affiche au lieu d'une page blanche.
// =====================================================================
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (!this.state.error) return this.props.children;
    const e = this.state.error;
    return (
      <div style={{ padding: 32, fontFamily: "Inter, sans-serif", maxWidth: 760, margin: "40px auto" }}>
        <h1 style={{ color: "#e67700", fontSize: 22, fontWeight: 800 }}>Le site a rencontré une erreur</h1>
        <p style={{ marginTop: 12 }}>Faites une capture d'écran de ce message et envoyez-la :</p>
        <pre style={{ marginTop: 12, padding: 16, background: "#fee2e2", borderRadius: 12, whiteSpace: "pre-wrap", fontSize: 13 }}>{String(e && e.message) + "\n\n" + String((e && e.stack) || "").split("\n").slice(0, 6).join("\n")}</pre>
        <button onClick={() => window.location.reload()} style={{ marginTop: 16, padding: "10px 18px", borderRadius: 10, background: "#e67700", color: "white", fontWeight: 700, border: 0, cursor: "pointer" }}>Recharger la page</button>
      </div>
    );
  }
}
window.__CGE_STARTED = true;
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>

<script>
  // =====================================================================
  // DÉMARRAGE RAPIDE
  // Au premier passage, Babel traduit le code du site, puis la traduction est gardée dans le navigateur.
  // Aux visites suivantes, le site démarre directement, sans télécharger Babel.
  // Une nouvelle version du site (code différent) est détectée automatiquement et retraduite une fois.
  // =====================================================================
  (function () {
    var src = document.getElementById("app-source").textContent;
    var h = 0;
    for (var i = 0; i < src.length; i++) { h = (h * 31 + src.charCodeAt(i)) | 0; }
    var KEY = "cge-arstm:code", VER = h + ":" + src.length;
    function lancer(code) { var s = document.createElement("script"); s.text = code; document.body.appendChild(s); }
    var garde = null;
    try { var c = JSON.parse(localStorage.getItem(KEY) || "null"); if (c && c.v === VER) garde = c.code; } catch (e) {}
    if (garde) { window.__CGE_CACHE = true; lancer(garde); return; }
    var b = document.createElement("script");
    b.src = "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js";
    b.onload = function () {
      var code = Babel.transform(src, { presets: ["react"] }).code;
      try { localStorage.setItem(KEY, JSON.stringify({ v: VER, code: code })); } catch (e) { /* stockage plein ou désactivé : on traduira à chaque visite */ }
      try { sessionStorage.removeItem("cge-arstm:recharge"); } catch (e) {}
      lancer(code);
    };
    document.head.appendChild(b);
  })();
</script>
