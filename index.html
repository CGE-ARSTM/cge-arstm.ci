function RightsManager({ members, updateMember }) {
  const active = members.filter((m) => m.statut === "actif");
  const admins = active.filter((m) => m.role === "admin");
  const withRights = active.filter((m) => m.role !== "admin" && (m.permissions || []).length > 0);
  const [q, setQ] = useState("");
  const [editing, setEditing] = useState(null);
  const [sel, setSel] = useState([]);
  const [busy, setBusy] = useState(false);
  const start = (m) => { setEditing(m.id); setSel(m.permissions || []); };
  const toggle = (p) => setSel((s) => (s.includes(p) ? s.filter((x) => x !== p) : [...s, p]));
  const save = async (m, list) => {
    setBusy(true);
    await updateMember(m, { permissions: list }, list.length ? `Droits enregistrés pour ${accountName(m)}.` : `Droits retirés à ${accountName(m)}.`);
    setBusy(false); setEditing(null); setQ("");
  };
  const found = q.trim().length >= 2
    ? active.filter((m) => m.role !== "admin" && !(m.permissions || []).length && [accountName(m), m.email, m.matricule].join(" ").toLowerCase().includes(q.trim().toLowerCase())).slice(0, 8)
    : [];
  const editor = (m) => editing === m.id && (
    <div className="mt-3 p-4 rounded-2xl bg-orange-50 border border-orange-100">
      <p className="text-xs font-semibold text-slate-600 mb-2">Modèles rapides (modifiables ensuite case par case) :</p>
      <div className="flex flex-wrap gap-2 mb-4">
        {PERM_PRESETS.map(([n, ps]) => <button key={n} onClick={() => setSel(ps)} className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-xs font-semibold hover:border-orange-500 hover:text-orange-700">{n}</button>)}
      </div>
      <div className="grid sm:grid-cols-2 gap-2">
        {PERMISSIONS.map(([p, l, d]) => (
          <label key={p} className={`flex items-start gap-2 p-3 rounded-xl border cursor-pointer bg-white transition ${sel.includes(p) ? "border-orange-500 ring-1 ring-orange-300" : "border-slate-200"}`}>
            <input type="checkbox" checked={sel.includes(p)} onChange={() => toggle(p)} className="mt-0.5 accent-orange-600" />
            <span><span className="text-sm font-semibold text-slate-900 block">{l}</span><span className="text-xs text-slate-500">{d}</span></span>
          </label>
        ))}
      </div>
      <div className="flex justify-end gap-2 mt-4">
        <button onClick={() => setEditing(null)} className="px-4 py-2 rounded-xl bg-white border border-slate-300 text-sm">Annuler</button>
        <button disabled={busy} onClick={() => save(m, sel)} className="px-5 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold hover:bg-orange-700 disabled:opacity-60">{busy ? "Enregistrement..." : "Enregistrer les droits"}</button>
      </div>
    </div>
  );
  const row = (m, extra, actions) => (
    <li key={m.id} className="py-4">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div className="flex items-center gap-3 min-w-0">
          <Avatar photo={m.data?.photo} name={accountName(m)} size="w-10 h-10" text="text-sm" />
          <div className="min-w-0">
            <p className="font-semibold text-slate-900">{accountName(m)}</p>
            <p className="text-xs text-slate-500">{[m.email, m.filiere, m.promotion && `Promo ${m.promotion}`].filter(Boolean).join(" · ")}</p>
            {extra}
          </div>
        </div>
        {editing !== m.id && <div className="flex flex-wrap gap-2">{actions}</div>}
      </div>
      {editor(m)}
    </li>
  );
  return (
    <div className="space-y-6">
      <div className="rounded-2xl bg-sky-50 border border-sky-200 p-5 flex gap-3 text-sm text-sky-900">
        <Info size={20} className="flex-shrink-0 text-sky-600 mt-0.5" />
        <p>Confiez à un membre la gestion de certaines rubriques sans le nommer administrateur. Il verra un menu « Gestion » limité à ces rubriques. La validation des membres, les droits et le journal restent réservés aux administrateurs. Toutes ses actions apparaissent dans le journal.</p>
      </div>
      <Panel title="Donner des droits à un membre" Icon={UserCog}>
        <div className="relative">
          <Search size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher un membre : nom, email, matricule..." className={inputCls + " mt-0 pl-10"} />
        </div>
        {q.trim().length >= 2 && found.length === 0 && <p className="text-sm text-slate-500 mt-3">Aucun membre sans droits ne correspond.</p>}
        <ul className="divide-y divide-slate-100">
          {found.map((m) => row(m, null, <button onClick={() => start(m)} className="px-4 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold hover:bg-orange-700">Donner des droits</button>))}
        </ul>
      </Panel>
      <Panel title={`Membres ayant des droits (${withRights.length})`} Icon={KeyRound}>
        {withRights.length === 0 ? <p className="text-sm text-slate-500">Aucun membre n'a de droits délégués pour le moment.</p> : (
          <ul className="divide-y divide-slate-100">
            {withRights.map((m) => row(m,
              <div className="flex flex-wrap gap-1 mt-1">{(m.permissions || []).map((p) => <span key={p} className="text-xs px-2 py-0.5 rounded-full bg-violet-100 text-violet-700">{PERM_LABELS[p] || p}</span>)}</div>,
              <>
                <button onClick={() => start(m)} className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-xs font-semibold text-slate-700 hover:text-orange-600 flex items-center gap-1"><Pencil size={14} /> Modifier</button>
                <ConfirmButton onConfirm={() => save(m, [])} confirmLabel="Tout retirer ?" className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-xs font-semibold text-rose-600">Retirer les droits</ConfirmButton>
              </>))}
          </ul>
        )}
      </Panel>
      <Panel title={`Administrateurs (${admins.length})`} Icon={Shield}>
        <p className="text-sm text-slate-500 -mt-3 mb-4">Ils ont tous les droits. Pour nommer ou retirer un administrateur, utilisez l'onglet « Membres ».</p>
        <div className="flex flex-wrap gap-2">
          {admins.map((m) => <span key={m.id} className="px-3 py-1.5 rounded-full bg-slate-900 text-white text-xs font-semibold">{accountName(m)}</span>)}
        </div>
      </Panel>
    </div>
  );
}

function ActivityLog({ members }) {
  const [rows, setRows] = useState(null);
  const [presence, setPresence] = useState([]);
  const [err, setErr] = useState("");
  const [limit, setLimit] = useState(300);
  const [who, setWho] = useState("");
  const [act, setAct] = useState("");
  const [q, setQ] = useState("");
  const [allVisits, setAllVisits] = useState(false);
  const load = async (n) => {
    const [j, p] = await Promise.all([
      sb.from("journal").select("*").order("created_at", { ascending: false }).limit(n),
      sb.from("presence").select("*"),
    ]);
    if (j.error) { setErr(j.error.message); setRows([]); return; }
    setErr(""); setRows(j.data || []); setPresence(p.data || []);
  };
  useEffect(() => {
    load(limit);
    const timer = setInterval(() => load(limit), 60000);
    return () => clearInterval(timer);
  }, [limit]);

  const byId = Object.fromEntries(members.map((m) => [m.id, m]));
  const isOnline = (p) => p.last_seen && Date.now() - new Date(p.last_seen) < 5 * 60000;
  const visits = presence.filter((p) => byId[p.user_id]).sort((a, b) => new Date(b.last_seen) - new Date(a.last_seen));
  const online = visits.filter(isOnline);
  const label = (r) => (r.rubrique === "site_settings" ? settingLabel(r.objet) : r.rubrique === "site_images" ? imageLabel(r.objet) : r.objet);
  const people = [...new Set((rows || []).map((r) => r.user_nom).filter(Boolean))].sort();
  const shown = (rows || []).filter((r) => (!who || r.user_nom === who) && (!act || r.action === act)
    && (!q || [label(r), r.details, RUBRIQUES[r.rubrique], r.user_nom].join(" ").toLowerCase().includes(q.toLowerCase())));

  if (rows === null) return <p className="text-slate-500">Chargement du journal...</p>;
  if (err) return <div className="rounded-2xl bg-rose-50 border border-rose-200 p-5 text-sm text-rose-800">Journal indisponible : {err}. Vérifiez que le script SQL « lot 4 » a bien été lancé dans Supabase.</div>;
  return (
    <div className="space-y-6">
      <div className="rounded-2xl bg-sky-50 border border-sky-200 p-5 flex gap-3 text-sm text-sky-900">
        <Info size={20} className="flex-shrink-0 text-sky-600 mt-0.5" />
        <p>Visible uniquement par les administrateurs. Une « connexion » est notée quand un membre arrive sur le site après plus de 30 minutes d'absence. L'historique est conservé 6 mois et se met à jour chaque minute.</p>
      </div>
      <div className="grid lg:grid-cols-2 gap-6">
        <Panel title={`En ligne maintenant (${online.length})`} Icon={Users}>
          {online.length === 0 ? <p className="text-sm text-slate-500">Aucun membre en ligne.</p> : (
            <ul className="space-y-3">
              {online.map((p) => { const m = byId[p.user_id]; return (
                <li key={p.user_id} className="flex items-center gap-3">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 pulse-dot flex-shrink-0" />
                  <Avatar photo={m.data?.photo} name={accountName(m)} size="w-9 h-9" text="text-xs" />
                  <span className="text-sm font-semibold text-slate-900 flex-1 min-w-0 truncate">{accountName(m)}</span>
                  <span className="text-xs text-slate-500 whitespace-nowrap">actif {ago(p.last_seen)}</span>
                </li>
              ); })}
            </ul>
          )}
        </Panel>
        <Panel title="Dernières visites" Icon={Clock}>
          {visits.length === 0 ? <p className="text-sm text-slate-500">Aucune visite enregistrée pour le moment.</p> : (
            <>
              <ul className="divide-y divide-slate-100">
                {(allVisits ? visits : visits.slice(0, 8)).map((p) => { const m = byId[p.user_id]; return (
                  <li key={p.user_id} className="py-2.5 flex items-center justify-between gap-3 text-sm">
                    <span className="font-semibold text-slate-900 flex items-center gap-2 min-w-0 truncate">{isOnline(p) && <span className="w-2 h-2 rounded-full bg-emerald-500 flex-shrink-0" />}{accountName(m)}</span>
                    <span className="text-xs text-slate-500 text-right">vu {ago(p.last_seen)}{p.derniere_connexion && <><br />arrivé(e) {fmtDateTime(p.derniere_connexion)}</>}</span>
                  </li>
                ); })}
              </ul>
              {visits.length > 8 && <button onClick={() => setAllVisits(!allVisits)} className="mt-3 text-sm text-orange-600 font-semibold">{allVisits ? "Réduire" : `Voir les ${visits.length} membres`}</button>}
            </>
          )}
          <p className="text-xs text-slate-400 mt-3">Les membres qui ne sont pas venus depuis la mise en place du journal n'apparaissent pas encore.</p>
        </Panel>
      </div>
      <Panel title="Journal des actions" Icon={HistoryIcon} action={<button onClick={() => load(limit)} className="px-3 py-2 rounded-xl bg-white border border-slate-300 text-xs font-semibold text-slate-600 hover:text-orange-600 flex items-center gap-1"><RotateCcw size={14} /> Actualiser</button>}>
        <div className="grid sm:grid-cols-3 gap-2 mb-4">
          <select value={who} onChange={(e) => setWho(e.target.value)} className={inputCls + " mt-0"}>
            <option value="">Toutes les personnes</option>{people.map((n) => <option key={n}>{n}</option>)}
          </select>
          <select value={act} onChange={(e) => setAct(e.target.value)} className={inputCls + " mt-0"}>
            <option value="">Toutes les actions</option>{Object.entries(ACTIONS).map(([k, [l]]) => <option key={k} value={k}>{l}</option>)}
          </select>
          <div className="relative">
            <Search size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher..." className={inputCls + " mt-0 pl-10"} />
          </div>
        </div>
        {shown.length === 0 ? <p className="text-sm text-slate-500">Aucune action ne correspond.</p> : (
          <ul className="divide-y divide-slate-100">
            {shown.map((r) => { const [al, ac] = ACTIONS[r.action] || [r.action, "bg-slate-100 text-slate-600"]; const obj = label(r); return (
              <li key={r.id} className="py-3 flex flex-col sm:flex-row sm:items-start gap-1.5 sm:gap-4 text-sm">
                <span className="text-xs text-slate-500 sm:w-40 flex-shrink-0 sm:pt-0.5">{fmtDateTime(r.created_at)}</span>
                <span className={`self-start text-xs px-2 py-0.5 rounded-full font-semibold whitespace-nowrap ${ac}`}>{al}</span>
                <span className="flex-1 min-w-0 text-slate-700">
                  <strong className="text-slate-900">{r.user_nom || "Inconnu"}</strong>
                  {r.action === "connexion" ? " est arrivé(e) sur le site" : <>{" · "}{RUBRIQUES[r.rubrique] || r.rubrique}{obj && <> : « {obj} »</>}</>}
                  {r.details && <span className="text-slate-500"> — {r.details}</span>}
                </span>
              </li>
            ); })}
          </ul>
        )}
        {rows.length >= limit && <button onClick={() => setLimit(limit + 300)} className="mt-4 text-sm text-orange-600 font-semibold">Charger les actions plus anciennes</button>}
      </Panel>
    </div>
  );
}

const LICENCE_ELIGIBLES = ["Sciences nautiques", "Mécanique navale", "Génie thermique", "Télécommunication (RIT)"];
const CAMPAGNE_VIDE = { annee: "", ouverture: "", cloture: "", frais: "", cotisation: "", paiement_infos: "", entretien_date: "", entretien_heure: "", entretien_lieu: "", filieres_licence: LICENCE_ELIGIBLES };
const sansNull = (o) => Object.fromEntries(Object.entries(o || {}).map(([k, v]) => [k, v === null ? "" : v]));

function CampagneForm({ initial, onDone, notify }) {
  const [f, setF] = useState(() => ({ ...CAMPAGNE_VIDE, ...sansNull(initial) }));
  const [busy, setBusy] = useState(false);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const options = [...new Set([...LICENCE_ELIGIBLES, ...FILIERES, ...(f.filieres_licence || [])])];
  const toggle = (x) => setF({ ...f, filieres_licence: f.filieres_licence.includes(x) ? f.filieres_licence.filter((y) => y !== x) : [...f.filieres_licence, x] });
  const save = async () => {
    const annee = String(f.annee).trim();
    if (!/^\d{4}-\d{4}$/.test(annee)) return notify("Indiquez l'année académique au format 2026-2027.", "error");
    if (!f.ouverture || !f.cloture || f.cloture < f.ouverture) return notify("Vérifiez les dates d'ouverture et de clôture.", "error");
    const num = (v) => (String(v).trim() === "" ? null : Number(String(v).replace(/\s/g, "")));
    const payload = {
      annee, ouverture: f.ouverture, cloture: f.cloture, frais: num(f.frais), cotisation: num(f.cotisation),
      paiement_infos: String(f.paiement_infos).trim() || null, entretien_date: f.entretien_date || null,
      entretien_heure: String(f.entretien_heure).trim() || null, entretien_lieu: String(f.entretien_lieu).trim() || null,
      filieres_licence: f.filieres_licence,
    };
    if ([payload.frais, payload.cotisation].some((n) => n !== null && (!Number.isFinite(n) || n < 0))) return notify("Montants invalides : chiffres uniquement, sans « FCFA ».", "error");
    setBusy(true);
    const { error } = initial && initial.id
      ? await sb.from("adhesion_campagnes").update(payload).eq("id", initial.id)
      : await sb.from("adhesion_campagnes").insert(payload);
    setBusy(false);
    if (error) return notify(error.code === "23505" ? "Une campagne existe déjà pour cette année." : "Enregistrement impossible : " + error.message, "error");
    notify("Campagne enregistrée.");
    onDone();
  };
  const L = (label, input) => <label className="block"><span className="text-xs font-semibold text-slate-600">{label}</span>{input}</label>;
  return (
    <div className="space-y-4">
      <div className="grid sm:grid-cols-3 gap-4">
        {L("Année académique", <input value={f.annee} onChange={set("annee")} placeholder="2026-2027" className={inputCls} />)}
        {L("Ouverture des candidatures", <input type="date" value={f.ouverture} onChange={set("ouverture")} className={inputCls} />)}
        {L("Clôture des candidatures", <input type="date" value={f.cloture} onChange={set("cloture")} className={inputCls} />)}
        {L("Frais de dossier (FCFA)", <input value={f.frais} onChange={set("frais")} placeholder="ex. 5000" className={inputCls} />)}
        {L("Cotisation annuelle (FCFA)", <input value={f.cotisation} onChange={set("cotisation")} placeholder="ex. 10000" className={inputCls} />)}
      </div>
      {L("Moyens de paiement (affichés aux candidats)", <textarea rows={3} value={f.paiement_infos} onChange={set("paiement_infos")} placeholder={"ex. Espèces auprès de la Trésorière Générale\nOrange Money : 07 00 00 00 00 (NOM)\nWave : 05 00 00 00 00"} className={inputCls} />)}
      <div className="grid sm:grid-cols-3 gap-4">
        {L("Date de l'entretien", <input type="date" value={f.entretien_date} onChange={set("entretien_date")} className={inputCls} />)}
        {L("Heure", <input value={f.entretien_heure} onChange={set("entretien_heure")} placeholder="ex. 9h00" className={inputCls} />)}
        {L("Lieu", <input value={f.entretien_lieu} onChange={set("entretien_lieu")} placeholder="ex. ARSTM, amphithéâtre A" className={inputCls} />)}
      </div>
      <div>
        <p className="text-xs font-semibold text-slate-600">Filières de Licence éligibles (tous les Masters le sont)</p>
        <div className="flex flex-wrap gap-2 mt-2">
          {options.map((x) => (
            <label key={x} className={`px-3 py-2 rounded-xl border text-sm cursor-pointer flex items-center gap-2 ${f.filieres_licence.includes(x) ? "border-orange-500 bg-orange-50 text-orange-800 font-semibold" : "border-slate-200 text-slate-600"}`}>
              <input type="checkbox" checked={f.filieres_licence.includes(x)} onChange={() => toggle(x)} className="accent-orange-600" /> {x}
            </label>
          ))}
        </div>
        <p className="text-xs text-slate-400 mt-2">Les noms doivent correspondre à ceux de la liste des filières (Textes & réglages → Listes).</p>
      </div>
      <div className="flex justify-end gap-2">
        <button onClick={onDone} className="px-5 py-2.5 rounded-xl bg-white border border-slate-300 text-sm font-semibold">Annuler</button>
        <button onClick={save} disabled={busy} className="px-6 py-2.5 rounded-xl bg-orange-600 text-white text-sm font-semibold hover:bg-orange-700 disabled:opacity-60">{busy ? "Enregistrement..." : "Enregistrer la campagne"}</button>
      </div>
    </div>
  );
}

// Vue « Départements » : une carte par département, avec ses membres et leur poste.
const POSTES_SUGGERES = ["Chef(fe) de département", "Adjoint(e)", "Secrétaire", "Membre"];
const rangPoste = (p) => (/chef/i.test(p || "") ? 0 : /adjoint/i.test(p || "") ? 1 : 2);

// Passation : enregistre le poste de chacun dans son historique, puis libère départements, postes et cases « Bureau ».
function ClotureMandat({ comptes, notify, reload }) {
  const [mandat, setMandat] = useState(MANDAT || "");
  const [busy, setBusy] = useState(false);
  const avecPoste = comptes.filter((p) => String(p.poste_cge || "").trim()).length;
  const occupes = comptes.filter((p) => p.departement || p.poste_cge || p.bureau).length;
  const cloturer = async () => {
    const m = mandat.trim();
    if (!/^\d{4}(-\d{4})?$/.test(m)) return notify("Écrivez le mandat sous la forme 2026-2027.", "error");
    setBusy(true);
    const { data, error } = await sb.rpc("cloturer_mandat", { mandat: m });
    setBusy(false);
    if (error) return notify(error.message, "error");
    notify(`Mandat ${m} clôturé : ${data || 0} poste(s) ajouté(s) aux historiques. Les départements sont libres pour le nouveau bureau.`);
    reload();
  };
  return (
    <Panel title="Passation : clôturer le mandat" Icon={HistoryIcon}>
      <p className="text-sm text-slate-600 -mt-3">À faire une fois par an, à la passation, <strong>avant</strong> de changer le mandat dans Textes & réglages.</p>
      <p className="text-sm text-slate-600 mt-2">Le poste de chaque personne ({avecPoste}) rejoint son historique « postes à la CGE » avec le mandat ci-dessous. Ensuite, les départements, postes et cases « Bureau » sont vidés ({occupes} personne{occupes > 1 ? "s" : ""}) : le nouveau bureau repart d'une page propre.</p>
      <div className="flex flex-col sm:flex-row gap-2 mt-4">
        <input value={mandat} onChange={(e) => setMandat(e.target.value)} placeholder="ex. 2026-2027" className={inputCls + " mt-0 sm:w-48"} />
        <ConfirmButton onConfirm={cloturer} confirmLabel={`Clôturer ${mandat.trim() || "le mandat"} ?`} className="px-5 py-2.5 rounded-xl bg-orange-600 text-white text-sm font-semibold hover:bg-orange-700">{busy ? "Clôture..." : "Clôturer le mandat"}</ConfirmButton>
      </div>
      <p className="text-xs text-slate-500 mt-2">Les mois de cotisation du bureau déjà créés restent dus. Les élèves qui deviennent anciens sont traités automatiquement, sans ce bouton.</p>
    </Panel>
  );
}

function DepartementsView({ comptes, canEdit, canClose, notify, reload }) {
  const [ajout, setAjout] = useState({});
  const membres = comptes.filter((p) => p.membre_cge || p.departement);
  const depts = [...new Set([...DEPARTEMENTS, ...membres.map((p) => p.departement).filter(Boolean)])];
  const sans = membres.filter((p) => p.membre_cge && !p.departement);
  const definir = async (p, dep, poste, msg) => {
    const { error } = await sb.rpc("definir_poste", { cible: p.id, dep: dep || "", poste: poste || "" });
    if (error) return notify(error.message, "error");
    notify(msg || "Enregistré."); reload();
  };
  return (
    <div className="space-y-6">
      <div className="rounded-2xl bg-sky-50 border border-sky-200 p-5 flex gap-3 text-sm text-sky-900">
        <Info size={20} className="flex-shrink-0 text-sky-600 mt-0.5" />
        <p>Rattachez les membres CGE à un département et indiquez leur poste : il s'affiche dans leur espace. C'est indépendant de la case « Bureau » (qui sert à la cotisation mensuelle du bureau). La liste des départements se modifie dans Textes & réglages → Listes.</p>
      </div>
      {canClose && <ClotureMandat comptes={comptes} notify={notify} reload={reload} />}
      <datalist id="postes-dept">{POSTES_SUGGERES.map((x) => <option key={x} value={x} />)}</datalist>
      <div className="grid lg:grid-cols-2 gap-6">
        {depts.map((dep) => {
          const list = membres.filter((p) => p.departement === dep).sort((a, b) => rangPoste(a.poste_cge) - rangPoste(b.poste_cge) || String(a.nom).localeCompare(String(b.nom)));
          const q = ajout[dep] || "";
          const trouves = q.trim().length >= 2 ? membres.filter((p) => p.membre_cge && p.departement !== dep && [p.nom, p.matricule, p.filiere].join(" ").toLowerCase().includes(q.trim().toLowerCase())).slice(0, 6) : [];
          return (
            <Panel key={dep} title={`${dep} (${list.length})`} Icon={Users}>
              {list.length === 0 ? <p className="text-sm text-slate-500 mb-3">Aucun membre pour le moment.</p> : (
                <ul className="divide-y divide-slate-100 mb-3">
                  {list.map((p) => (
                    <li key={p.id + (p.poste_cge || "")} className="py-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                      <div className="min-w-0">
                        <p className="font-semibold text-slate-900 text-sm">{p.nom}</p>
                        <p className="text-xs text-slate-500">{[p.numero_membre, p.filiere].filter(Boolean).join(" · ")}</p>
                      </div>
                      {canEdit ? (
                        <div className="flex items-center gap-1.5">
                          <input list="postes-dept" defaultValue={p.poste_cge || ""} placeholder="Poste" title="Poste (validé en quittant le champ)"
                            onBlur={(e) => { const v = e.target.value.trim(); if (v !== (p.poste_cge || "")) definir(p, dep, v, `Poste de ${p.nom} enregistré.`); }}
                            className="w-44 px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs" />
                          <ConfirmButton onConfirm={() => definir(p, "", "", `${p.nom} retiré(e) de ${dep}.`)} confirmLabel="Retirer ?" ariaLabel="Retirer du département" className="p-1.5 rounded-lg text-rose-600 hover:bg-rose-50"><X size={15} /></ConfirmButton>
                        </div>
                      ) : p.poste_cge && <span className="text-xs px-2 py-0.5 rounded-full bg-violet-100 text-violet-700">{p.poste_cge}</span>}
                    </li>
                  ))}
                </ul>
              )}
              {canEdit && (
                <div>
                  <input value={q} onChange={(e) => setAjout({ ...ajout, [dep]: e.target.value })} placeholder="Ajouter un membre : nom, matricule..." className={inputCls + " mt-0"} />
                  {trouves.length > 0 && (
                    <ul className="mt-2 space-y-1">{trouves.map((p) => (
                      <li key={p.id} className="flex justify-between items-center gap-2 text-sm">
                        <span>{p.nom}{p.departement && <span className="text-xs text-amber-700"> · actuellement : {p.departement}</span>}</span>
                        <button onClick={() => { setAjout({ ...ajout, [dep]: "" }); definir(p, dep, "Membre", `${p.nom} ajouté(e) à ${dep}.`); }} className="px-3 py-1 rounded-lg bg-orange-600 text-white text-xs font-semibold">Ajouter</button>
                      </li>
                    ))}</ul>
                  )}
                </div>
              )}
            </Panel>
          );
        })}
      </div>
      <Panel title={`Membres sans département (${sans.length})`} Icon={UserPlus}>
        {sans.length === 0 ? <p className="text-sm text-slate-500">Tous les membres CGE ont un département.</p> : (
          <div className="flex flex-wrap gap-2">{sans.map((p) => <span key={p.id} className="px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 text-sm">{p.nom}</span>)}</div>
        )}
      </Panel>
    </div>
  );
}

function AdminAdhesions({ can, notify }) {
  const canA = can("adhesions"), canT = can("tresorerie");
  const [campagnes, setCampagnes] = useState([]);
  const [rows, setRows] = useState(null);
  const [comptes, setComptes] = useState([]);
  const [campId, setCampId] = useState(null);
  const [view, setView] = useState("candidats");
  const [editing, setEditing] = useState(null); // null | "new" | campagne
  const [fEtape, setFEtape] = useState("");
  const [q, setQ] = useState("");
  const [mq, setMq] = useState("");
  const [busyId, setBusyId] = useState(null);

  const load = async () => {
    const [c, a, p] = await Promise.all([
      sb.from("adhesion_campagnes").select("*").order("ouverture", { ascending: false }),
      sb.from("adhesions").select("*").order("created_at", { ascending: false }),
      sb.rpc("comptes_adhesion"),
    ]);
    if (c.error) { setRows([]); return notify("Adhésions indisponibles : " + c.error.message + ". Le script SQL du lot 5 a-t-il été lancé ?", "error"); }
    setCampagnes(c.data || []); setRows(a.data || []); setComptes(p.data || []);
    setCampId((id) => id || (c.data && c.data[0] ? c.data[0].id : null));
  };
  useEffect(() => { load(); }, []);

  const act = async (r, action, info = null) => {
    setBusyId(r.id);
    const { data, error } = await sb.rpc("adhesion_action", { a_id: r.id, action, info });
    setBusyId(null);
    if (error) return notify(error.message, "error");
    notify(action === "cotisation_ok" && data ? `${r.nom} est maintenant membre CGE : n° ${data}` : "Étape mise à jour.");
    load();
  };
  const removeRow = async (r) => {
    const { error } = await sb.from("adhesions").delete().eq("id", r.id);
    if (error) return notify("Suppression impossible : " + error.message, "error");
    notify("Candidature supprimée."); load();
  };
  const editMessage = (r) => {
    const m = window.prompt(`Message affiché à ${r.nom} dans son suivi (laisser vide pour effacer) :`, r.message_bureau || "");
    if (m !== null) act(r, "message", m);
  };
  const declarer = async (p, oui) => {
    const { data, error } = await sb.rpc("declarer_membre", { cible: p.id, membre: oui });
    if (error) return notify(error.message, "error");
    notify(oui ? `${p.nom} est membre CGE : n° ${data}` : `${p.nom} n'est plus membre CGE.`);
    load();
  };

  if (rows === null) return <p className="text-slate-500">Chargement des adhésions...</p>;

  const camp = campagnes.find((c) => c.id === campId) || null;
  const list = rows.filter((r) => r.campagne_id === campId);
  const count = (k) => list.filter((r) => r.etape === k).length;
  const shown = list.filter((r) => (!fEtape || r.etape === fEtape)
    && (!q || [r.nom, r.matricule, r.filiere, r.email, r.telephone].join(" ").toLowerCase().includes(q.toLowerCase())));
  const convoques = list.filter((r) => ["formulaire_remis", "admis", "non_retenu"].includes(r.etape)).sort((a, b) => String(a.nom).localeCompare(String(b.nom)));
  const numeroDe = (uid) => (comptes.find((p) => p.id === uid) || {}).numero_membre;
  const membres = comptes.filter((p) => p.membre_cge && (!mq || [p.nom, p.numero_membre, p.matricule, p.filiere].join(" ").toLowerCase().includes(mq.toLowerCase())));
  const aDeclarer = mq.trim().length >= 2 ? comptes.filter((p) => !p.membre_cge && p.type !== "ancien" && [p.nom, p.matricule, p.email].join(" ").toLowerCase().includes(mq.trim().toLowerCase())).slice(0, 8) : [];
  const btn = "px-3 py-1.5 rounded-lg text-xs font-semibold";

  const actions = (r) => {
    const out = [];
    if (r.etape === "envoyee" && canT) out.push(
      <ConfirmButton key="f1" onConfirm={() => act(r, "frais_ok", "Espèces")} confirmLabel="Confirmer ?" className={btn + " bg-emerald-600 text-white"}>Frais payés · espèces</ConfirmButton>,
      <ConfirmButton key="f2" onConfirm={() => act(r, "frais_ok", "Mobile Money")} confirmLabel="Confirmer ?" className={btn + " bg-emerald-600 text-white"}>Frais payés · Mobile Money</ConfirmButton>);
    if (r.etape === "frais_payes" && canA) out.push(<ConfirmButton key="fo" onConfirm={() => act(r, "formulaire")} confirmLabel="Confirmer ?" className={btn + " bg-violet-600 text-white"}>Formulaire remis</ConfirmButton>);
    if (["formulaire_remis", "admis", "non_retenu"].includes(r.etape) && canA) {
      if (r.etape !== "admis") out.push(<ConfirmButton key="ad" onConfirm={() => act(r, "admis")} confirmLabel="Admis ?" className={btn + " bg-emerald-600 text-white"}>Admis(e)</ConfirmButton>);
      if (r.etape !== "non_retenu") out.push(<ConfirmButton key="nr" onConfirm={() => act(r, "non_retenu")} confirmLabel="Non retenu ?" className={btn + " bg-slate-600 text-white"}>Non retenu(e)</ConfirmButton>);
    }
    if (r.etape === "admis" && canT) out.push(
      <ConfirmButton key="c1" onConfirm={() => act(r, "cotisation_ok", "Espèces")} confirmLabel="Confirmer ?" className={btn + " bg-orange-600 text-white"}>Cotisation payée · espèces</ConfirmButton>,
      <ConfirmButton key="c2" onConfirm={() => act(r, "cotisation_ok", "Mobile Money")} confirmLabel="Confirmer ?" className={btn + " bg-orange-600 text-white"}>Cotisation payée · Mobile Money</ConfirmButton>);
    if ((r.etape === "frais_payes" && canT) || (["formulaire_remis", "admis", "non_retenu"].includes(r.etape) && canA))
      out.push(<ConfirmButton key="re" onConfirm={() => act(r, "retour")} confirmLabel="Revenir ?" className={btn + " bg-white border border-slate-300 text-slate-600"}>↩ Étape précédente</ConfirmButton>);
    if (r.frais_recu_path) out.push(<button key="rf" onClick={() => downloadPrivate("recus", r.frais_recu_path, null, notify)} className={btn + " bg-white border border-slate-300 text-slate-700"}>Reçu frais</button>);
    if (r.cotisation_recu_path) out.push(<button key="rc" onClick={() => downloadPrivate("recus", r.cotisation_recu_path, null, notify)} className={btn + " bg-white border border-slate-300 text-slate-700"}>Reçu cotisation</button>);
    if (canA) {
      out.push(<button key="ms" onClick={() => editMessage(r)} className={btn + " bg-white border border-slate-300 text-slate-700"}>Message</button>);
      out.push(<ConfirmButton key="de" onConfirm={() => removeRow(r)} confirmLabel="Supprimer ?" ariaLabel="Supprimer la candidature" className="p-1.5 rounded-lg text-rose-600 hover:bg-rose-50"><Trash2 size={15} /></ConfirmButton>);
    }
    return out;
  };

  const views = [["candidats", "Candidatures", Send], ["membres", "Membres CGE", Award], ["departements", "Départements", Users], ...(canA ? [["campagnes", "Campagnes", Calendar]] : [])];

  return (
    <div className="space-y-6">
      <div className="rounded-2xl bg-sky-50 border border-sky-200 p-5 flex gap-3 text-sm text-sky-900">
        <Info size={20} className="flex-shrink-0 text-sky-600 mt-0.5" />
        <p>Ordre des étapes : <strong>frais de dossier</strong> (Trésorerie) → <strong>formulaire remis</strong> → <strong>entretien</strong> (admis / non retenu) → <strong>cotisation</strong> (Trésorerie) → membre CGE avec son numéro. Le site refuse une étape faite dans le désordre. En cas d'erreur, utilisez « Étape précédente ».</p>
      </div>
      <div className="flex flex-wrap gap-2">
        {views.map(([k, l, I]) => <button key={k} onClick={() => { setView(k); setEditing(null); }} className={`flex items-center gap-2 px-4 py-2 rounded-full text-sm font-semibold transition ${view === k ? "bg-slate-900 text-white" : "bg-white shadow-sm text-slate-600 hover:text-orange-600"}`}><I size={15} /> {l}</button>)}
      </div>

      {view === "candidats" && (campagnes.length === 0 ? (
        <Panel title="Aucune campagne" Icon={Calendar}>
          <p className="text-sm text-slate-500">{canA ? "Créez d'abord la campagne de l'année dans l'onglet « Campagnes »." : "Aucune campagne d'adhésion n'a encore été créée."}</p>
        </Panel>
      ) : (
        <>
          <div className="flex flex-wrap gap-2">
            {campagnes.map((c) => <button key={c.id} onClick={() => setCampId(c.id)} className={`px-4 py-2 rounded-xl text-sm font-semibold ${campId === c.id ? "bg-orange-600 text-white" : "bg-white shadow-sm text-slate-600"}`}>{c.annee}</button>)}
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
            {ETAPES.map(([k, l, cls]) => (
              <button key={k} onClick={() => setFEtape(fEtape === k ? "" : k)} className={`rounded-2xl p-4 text-left shadow-sm transition ${fEtape === k ? "ring-2 ring-orange-500 bg-white" : "bg-white hover:shadow-md"}`}>
                <p className="text-2xl font-extrabold text-slate-900">{count(k)}</p>
                <span className={`inline-block mt-1 px-2 py-0.5 rounded-full text-xs font-semibold ${cls}`}>{l}</span>
              </button>
            ))}
          </div>
          <Panel title={`Candidatures ${camp ? camp.annee : ""} (${list.length})`} Icon={Users}
            action={convoques.length > 0 && <button onClick={() => window.print()} className="px-3 py-2 rounded-xl bg-white border border-slate-300 text-xs font-semibold text-slate-700 hover:text-orange-600 flex items-center gap-1"><Printer size={14} /> Liste des convoqués</button>}>
            <div className="relative mb-4">
              <Search size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
              <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Nom, matricule, filière, téléphone..." className={inputCls + " mt-0 pl-10"} />
            </div>
            {fEtape && <p className="text-sm text-slate-500 mb-3">Filtre : {ETAPE[fEtape].label} · <button onClick={() => setFEtape("")} className="text-orange-600 font-semibold">tout afficher</button></p>}
            {shown.length === 0 ? <p className="text-sm text-slate-500">Aucune candidature.</p> : (
              <ul className="divide-y divide-slate-100">
                {shown.map((r) => (
                  <li key={r.id} className={`py-4 ${busyId === r.id ? "opacity-50 pointer-events-none" : ""}`}>
                    <div className="flex flex-col md:flex-row md:items-start justify-between gap-3">
                      <div className="min-w-0">
                        <p className="font-bold text-slate-900 flex flex-wrap items-center gap-2">{r.nom}
                          <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${(ETAPE[r.etape] || {}).cls || ""}`}>{(ETAPE[r.etape] || {}).label || r.etape}</span>
                          {r.etape === "membre" && numeroDe(r.user_id) && <span className="text-xs px-2 py-0.5 rounded-full bg-slate-900 text-white">{numeroDe(r.user_id)}</span>}
                        </p>
                        <p className="text-sm text-slate-600">{[r.matricule, r.cycle, r.filiere, r.niveau].filter(Boolean).join(" · ")}</p>
                        <p className="text-xs text-slate-500">{[r.telephone, r.email, `envoyée le ${fmtDate(r.created_at)}`].filter(Boolean).join(" · ")}</p>
                        {(r.frais_confirme_le || r.cotisation_confirme_le) && <p className="text-xs text-slate-500 mt-0.5">{r.frais_confirme_le && `Frais : ${r.frais_mode || "payés"} le ${fmtDate(r.frais_confirme_le)}`}{r.frais_confirme_le && r.cotisation_confirme_le && " · "}{r.cotisation_confirme_le && `Cotisation : ${r.cotisation_mode || "payée"} le ${fmtDate(r.cotisation_confirme_le)}`}</p>}
                        {r.motivation && <p className="text-xs text-slate-600 mt-1 italic whitespace-pre-line">« {r.motivation} »</p>}
                        {r.message_bureau && <p className="text-xs text-sky-700 mt-1">Message affiché : {r.message_bureau}</p>}
                      </div>
                      <div className="flex flex-wrap gap-1.5 md:justify-end md:max-w-sm">{actions(r)}</div>
                    </div>
                  </li>
                ))}
              </ul>
            )}
          </Panel>
          {/* Liste imprimable des convoqués (visible uniquement à l'impression) */}
          <div className="cv-print hidden print:block p-8 bg-white text-slate-900">
            <h1 className="text-2xl font-extrabold">CGE section ARSTM · Entretiens d'adhésion {camp && camp.annee}</h1>
            {camp && <p className="mt-1">{entretienTexte(camp)}</p>}
            <table className="w-full mt-6 text-sm border-collapse">

      {view === "membres" && (
        <Panel title={`Membres CGE (${comptes.filter((p) => p.membre_cge).length})`} Icon={Award}>

            <Search size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
            <input value={mq} onChange={(e) => setMq(e.target.value)} placeholder="Rechercher un membre, ou un élève à déclarer membre..." className={inputCls + " mt-0 pl-10"} />
          </div>
          {canA && aDeclarer.length > 0 && (
            <div className="mb-5 p-4 rounded-2xl bg-orange-50 border border-orange-100">
              <p className="text-sm font-semibold text-slate-900">Élèves non membres correspondant à la recherche</p>
              <p className="text-xs text-slate-500 mb-3">Pour les élèves qui étaient déjà adhérents avant le site : ils reçoivent directement leur numéro de membre.</p>
              <ul className="space-y-2">
                {aDeclarer.map((p) => (
                  <li key={p.id} className="flex items-center justify-between gap-3 text-sm">
                    <span><strong>{p.nom}</strong> <span className="text-slate-500">{[p.matricule, p.filiere, p.promotion && `Promo ${p.promotion}`].filter(Boolean).join(" · ")}</span></span>
                    <ConfirmButton onConfirm={() => declarer(p, true)} confirmLabel="Déclarer ?" className={btn + " bg-orange-600 text-white whitespace-nowrap"}>Déclarer membre (déjà adhérent)</ConfirmButton>
                  </li>
                ))}
              </ul>
            </div>
          )}
          {membres.length === 0 ? <p className="text-sm text-slate-500">Aucun membre ne correspond.</p> : (
            <ul className="divide-y divide-slate-100">
              {membres.map((p) => (
                <li key={p.id} className="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <div>
                    <p className="font-semibold text-slate-900 flex flex-wrap items-center gap-2">{p.nom}{p.numero_membre && <span className="text-xs px-2 py-0.5 rounded-full bg-slate-900 text-white">{p.numero_membre}</span>}{p.type === "ancien" && <span className="text-xs px-2 py-0.5 rounded-full bg-sky-100 text-sky-700">Ancien</span>}</p>
                    <p className="text-xs text-slate-500">{[p.matricule, p.filiere, p.promotion && `Promo ${p.promotion}`, p.membre_depuis && `membre depuis le ${fmtDate(p.membre_depuis)}`].filter(Boolean).join(" · ")}</p>
                  </div>
                  <div className="flex flex-wrap items-center gap-2">
                    {(canA || canT) && (
                      <>
                        <select value={p.departement || ""} title="Département"
                          onChange={async (e) => { const { error } = await sb.rpc("definir_orga", { cible: p.id, dep: e.target.value, au_bureau: !!p.bureau }); if (error) return notify(error.message, "error"); notify("Département enregistré."); load(); }}
                          className="px-2 py-1.5 rounded-lg border border-slate-300 text-xs bg-white">
                          <option value="">Sans département</option>{[...new Set([...DEPARTEMENTS, ...(p.departement ? [p.departement] : [])])].map((x) => <option key={x}>{x}</option>)}
                        </select>
                        <label className={`flex items-center gap-1 px-2 py-1.5 rounded-lg border text-xs font-semibold cursor-pointer ${p.bureau ? "border-orange-400 bg-orange-50 text-orange-700" : "border-slate-300 text-slate-600"}`}>
                          <input type="checkbox" checked={!!p.bureau} className="accent-orange-600"
                            onChange={async (e) => { const { error } = await sb.rpc("definir_orga", { cible: p.id, dep: p.departement || "", au_bureau: e.target.checked }); if (error) return notify(error.message, "error"); notify(e.target.checked ? "Ajouté(e) au bureau." : "Retiré(e) du bureau."); load(); }} /> Bureau
                        </label>
                      </>
                    )}
                    {canA && <ConfirmButton onConfirm={() => declarer(p, false)} confirmLabel="Retirer ?" className={btn + " bg-white border border-slate-300 text-rose-600"}>Retirer le statut de membre</ConfirmButton>}

              ))}

      )}

      {view === "departements" && <DepartementsView comptes={comptes} canEdit={canA || canT} canClose={canA} notify={notify} reload={load} />}

      {view === "campagnes" && canA && (
        editing ? (
          <Panel title={editing === "new" ? "Nouvelle campagne" : `Modifier la campagne ${editing.annee}`} Icon={Calendar}>
            <CampagneForm initial={editing === "new" ? null : editing} notify={notify} onDone={() => { setEditing(null); load(); }} />
          </Panel>
        ) : (
          <Panel title={`Campagnes (${campagnes.length})`} Icon={Calendar} action={<button onClick={() => setEditing("new")} className="px-4 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold flex items-center gap-1"><Plus size={16} /> Nouvelle campagne</button>}>
            {campagnes.length === 0 ? <p className="text-sm text-slate-500">Aucune campagne. Créez celle de l'année en cours.</p> : (
              <ul className="divide-y divide-slate-100">
                {campagnes.map((c) => {
                  const ouverte = daysUntil(c.ouverture) <= 0 && daysUntil(c.cloture) >= 0;
                  return (
                    <li key={c.id} className="py-3 flex items-center justify-between gap-3">
                      <div>
                        <p className="font-semibold text-slate-900 flex items-center gap-2">{c.annee}<span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${ouverte ? "bg-emerald-100 text-emerald-700" : "bg-slate-100 text-slate-500"}`}>{ouverte ? "ouverte" : daysUntil(c.ouverture) > 0 ? "à venir" : "terminée"}</span></p>
                        <p className="text-xs text-slate-500">Du {fmtDate(c.ouverture)} au {fmtDate(c.cloture)} · frais {fcfa(c.frais)} · cotisation {fcfa(c.cotisation)} · entretien : {entretienTexte(c)}</p>
                      </div>
                      <div className="flex items-center gap-1 flex-shrink-0">
                        <button onClick={() => setEditing(c)} className="p-2 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-orange-600" aria-label="Modifier" title="Modifier"><Pencil size={16} /></button>
                        <ConfirmButton
                          onConfirm={async () => {
                            const n = rows.filter((r) => r.campagne_id === c.id).length;
                            if (n) {
                              const { error: e1 } = await sb.from("adhesions").delete().eq("campagne_id", c.id);
                              if (e1) return notify("Suppression des candidatures impossible : " + e1.message, "error");
                            }
                            const { error } = await sb.from("adhesion_campagnes").delete().eq("id", c.id);
                            if (error) return notify("Suppression impossible : " + error.message, "error");
                            notify(`Campagne ${c.annee} supprimée${n ? ` avec ses ${n} candidature(s)` : ""}. Les membres déjà admis restent membres.`);
                            setCampId(null); load();
                          }}
                          confirmLabel={rows.some((r) => r.campagne_id === c.id) ? "Supprimer aussi les candidatures ?" : "Supprimer ?"}
                          ariaLabel="Supprimer la campagne" className="p-2 rounded-lg text-rose-600 hover:bg-rose-50"><Trash2 size={16} /></ConfirmButton>
                      </div>
                    </li>
                  );
                })}
              </ul>
            )}
          </Panel>
        )
      )}
    </div>
  );
}

// FINANCES (droit « Trésorerie » ; consultation seule avec « Finances (lecture seule) »)
// =====================================================================
const MODES = ["Espèces", "Mobile Money", "Virement", "Autre"];
const MOIS_NOMS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const moisLabel = (m) => { const [y, mo] = String(m).split("-"); return `${MOIS_NOMS[Number(mo) - 1] || mo} ${y}`; };
// Exercice = année académique, du 1er octobre au 30 septembre.
const exerciceDebut = () => { const t = new Date(); return isoDate(new Date(t.getMonth() >= 9 ? t.getFullYear() : t.getFullYear() - 1, 9, 1)); };
const anneeAcademique = () => { const t = new Date(); const y = t.getMonth() >= 9 ? t.getFullYear() : t.getFullYear() - 1; return `${y}-${y + 1}`; };
const CAT_COTIS = { annuelle: "Cotisations annuelles", bureau: "Cotisations bureau", exceptionnelle: "Cotisations exceptionnelles" };
const FIN_STATUTS = {
  ajour: ["À jour", "bg-emerald-100 text-emerald-700"], partiel: ["Partiel", "bg-amber-100 text-amber-700"],
  attente: ["En attente", "bg-slate-100 text-slate-600"], retard: ["En retard", "bg-rose-100 text-rose-700"], dispense: ["Dispensé", "bg-sky-100 text-sky-700"],
};
const somme = (list) => list.reduce((s, m) => s + (Number(m.montant) || 0), 0);
const toInt = (v) => { const n = Number(String(v ?? "").replace(/[\s\u202f.]/g, "").replace(",", ".")); return Number.isFinite(n) ? Math.round(n) : NaN; };

// Fenêtre : voir les versements d'une somme due, en enregistrer un nouveau ou en supprimer un.
function FinPayDialog({ F, du, onClose }) {
  const cot = F.cot.find((c) => c.id === du.cotisation_id) || {};
  const paye = F.paye(du.id);
  const reste = Math.max(du.montant_du - paye, 0);
  const versements = F.mvt.filter((m) => m.du_id === du.id && m.sens === "entree");
  const [f, setF] = useState({ montant: reste ? String(reste) : "", mode: "Espèces", date: todayISO(), note: "" });
  const [busy, setBusy] = useState(false);
  const save = async () => {
    const montant = toInt(f.montant);
    if (!Number.isFinite(montant) || montant <= 0) return F.notify("Montant invalide (chiffres uniquement).", "error");
    setBusy(true);
    const nom = F.nom(du.user_id);
    const { error } = await sb.from("fin_mouvements").insert({ sens: "entree", montant, mode: f.mode, date: f.date || todayISO(), categorie: CAT_COTIS[cot.type] || "Cotisations",
      libelle: `${cot.titre} · ${nom}`, tiers: nom, user_id: du.user_id, du_id: du.id, note: f.note.trim() || null });
    setBusy(false);
    if (error) return F.notify("Enregistrement impossible : " + error.message, "error");
    F.notify("Versement enregistré."); F.reload(); onClose();
  };
  const remove = async (m) => {
    const { error } = await sb.from("fin_mouvements").delete().eq("id", m.id);
    if (error) return F.notify("Suppression impossible : " + error.message, "error");
    F.notify("Versement supprimé."); F.reload(); onClose();
  };
  return (
    <div className="fixed inset-0 z-50 bg-black bg-opacity-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl fade-up" onClick={(e) => e.stopPropagation()}>
        <div className="flex justify-between items-start gap-3">
          <div><p className="font-bold text-slate-900 text-lg">{F.nom(du.user_id)}</p><p className="text-sm text-slate-500">{cot.titre}</p></div>
          <button onClick={onClose} aria-label="Fermer" className="text-slate-400 hover:text-slate-700"><X size={20} /></button>
        </div>
        <div className="grid grid-cols-3 gap-2 mt-4 text-center text-sm">
          <div className="p-3 rounded-xl bg-slate-50"><p className="text-xs text-slate-500">Dû</p><p className="font-bold">{fcfa(du.montant_du)}</p></div>
          <div className="p-3 rounded-xl bg-emerald-50"><p className="text-xs text-slate-500">Payé</p><p className="font-bold text-emerald-700">{fcfa(paye)}</p></div>
          <div className="p-3 rounded-xl bg-amber-50"><p className="text-xs text-slate-500">Reste</p><p className="font-bold text-amber-700">{fcfa(reste)}</p></div>
        </div>
        {versements.length > 0 && (
          <ul className="mt-4 divide-y divide-slate-100 text-sm">
            {versements.map((m) => (
              <li key={m.id} className="py-2 flex justify-between items-center gap-2">
                <span>{fmtDate(m.date)} · <strong>{fcfa(m.montant)}</strong>{m.mode && ` · ${m.mode}`}</span>
                {F.canW && <ConfirmButton onConfirm={() => remove(m)} confirmLabel="Suppr. ?" ariaLabel="Supprimer ce versement" className="p-1 rounded text-rose-600 hover:bg-rose-50"><Trash2 size={14} /></ConfirmButton>}
              </li>
            ))}
          </ul>
        )}
        {F.canW && reste > 0 && (
          <div className="mt-5 space-y-3">
            <p className="text-sm font-bold text-slate-900">Nouveau versement</p>
            <div className="grid grid-cols-2 gap-2">
              <label className="block"><span className="text-xs font-semibold text-slate-600">Montant (FCFA)</span><input value={f.montant} onChange={(e) => setF({ ...f, montant: e.target.value })} className={inputCls} /></label>
              <label className="block"><span className="text-xs font-semibold text-slate-600">Date</span><input type="date" value={f.date} onChange={(e) => setF({ ...f, date: e.target.value })} className={inputCls} /></label>
            </div>
            <div className="flex flex-wrap gap-2">{MODES.map((m) => <button key={m} type="button" onClick={() => setF({ ...f, mode: m })} className={`px-3 py-1.5 rounded-lg text-xs font-semibold border ${f.mode === m ? "border-orange-500 bg-orange-50 text-orange-700" : "border-slate-300 text-slate-600"}`}>{m}</button>)}</div>
            <input value={f.note} onChange={(e) => setF({ ...f, note: e.target.value })} placeholder="Note (facultatif)" className={inputCls} />
            <button onClick={save} disabled={busy} className="w-full py-3 rounded-xl bg-orange-600 text-white font-semibold hover:bg-orange-700 disabled:opacity-60">{busy ? "Enregistrement..." : "Enregistrer le versement"}</button>
          </div>
        )}
      </div>
    </div>
  );
}

// Tableau des personnes concernées par une cotisation : dû, payé, reste, statut et actions.
function FinDusTable({ F, cot }) {
  const [q, setQ] = useState("");
  const [st, setSt] = useState("");
  const [pay, setPay] = useState(null);
  const rows = F.dus.filter((d) => d.cotisation_id === cot.id).map((d) => {
    const paye = F.paye(d.id), reste = Math.max(d.montant_du - paye, 0);
    const late = reste > 0 && cot.echeance && daysUntil(cot.echeance) < 0;
    const statut = d.montant_du === 0 ? "dispense" : reste === 0 ? "ajour" : late ? "retard" : paye > 0 ? "partiel" : "attente";
    return { d, paye, reste, statut, c: F.compte(d.user_id) || {}, nom: F.nom(d.user_id) };
  }).sort((a, b) => a.nom.localeCompare(b.nom));
  const shown = rows.filter((r) => (!st || r.statut === st) && (!q || [r.nom, r.c.matricule, r.c.filiere, r.c.departement].join(" ").toLowerCase().includes(q.toLowerCase())));
  const ajuster = async (r) => {
    const v = window.prompt(`Montant dû par ${r.nom} (0 = dispensé) :`, String(r.d.montant_du));
    if (v === null) return;
    const n = toInt(v);
    if (!Number.isFinite(n) || n < 0) return F.notify("Montant invalide.", "error");
    const { error } = await sb.from("fin_dus").update({ montant_du: n }).eq("id", r.d.id);
    if (error) return F.notify("Modification impossible : " + error.message, "error");
    F.notify("Montant dû modifié."); F.reload();
  };
  const retirer = async (r) => {
    if (r.paye > 0) return F.notify("Cette personne a déjà versé de l'argent : supprimez d'abord ses versements.", "error");
    const { error } = await sb.from("fin_dus").delete().eq("id", r.d.id);
    if (error) return F.notify("Suppression impossible : " + error.message, "error");
    F.notify("Personne retirée de cette cotisation."); F.reload();
  };
  return (
    <div>
      <div className="grid grid-cols-3 gap-3 mb-4">
        {[["Attendu", somme(rows.map((r) => ({ montant: r.d.montant_du }))), "bg-slate-50 text-slate-900"], ["Encaissé", somme(rows.map((r) => ({ montant: r.paye }))), "bg-emerald-50 text-emerald-700"], ["Reste à encaisser", somme(rows.map((r) => ({ montant: r.reste }))), "bg-amber-50 text-amber-700"]].map(([l, v, cls]) => (
          <div key={l} className={`rounded-2xl p-4 ${cls}`}><p className="text-xs font-semibold opacity-70">{l}</p><p className="text-xl font-extrabold">{fcfa(v)}</p></div>
        ))}
      </div>
      <div className="flex flex-col sm:flex-row gap-2 mb-4">
        <div className="relative flex-1">
          <Search size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Nom, matricule, filière, département..." className={inputCls + " mt-0 pl-10"} />
        </div>
        <select value={st} onChange={(e) => setSt(e.target.value)} className={inputCls + " mt-0 sm:w-48"}>
          <option value="">Tous les statuts</option>{Object.entries(FIN_STATUTS).map(([k, [l]]) => <option key={k} value={k}>{l} ({rows.filter((r) => r.statut === k).length})</option>)}
        </select>
      </div>
      {shown.length === 0 ? <p className="text-sm text-slate-500">{rows.length ? "Personne ne correspond." : "Aucune personne concernée pour le moment."}</p> : (
        <ul className="divide-y divide-slate-100">
          {shown.map((r) => (
            <li key={r.d.id} className="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div className="min-w-0">
                <p className="font-semibold text-slate-900 flex flex-wrap items-center gap-2">{r.nom}<span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${FIN_STATUTS[r.statut][1]}`}>{FIN_STATUTS[r.statut][0]}</span></p>
                <p className="text-xs text-slate-500">{[r.c.matricule, r.c.filiere, r.c.departement].filter(Boolean).join(" · ")}</p>
                <p className="text-xs text-slate-600 mt-0.5">Dû {fcfa(r.d.montant_du)} · payé {fcfa(r.paye)}{r.reste > 0 && ` · reste ${fcfa(r.reste)}`}</p>
              </div>
              <div className="flex flex-wrap items-center gap-1.5">
                <button onClick={() => setPay(r.d)} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-orange-600 text-white hover:bg-orange-700">{F.canW && r.reste > 0 ? "Enregistrer un versement" : "Voir les versements"}</button>
                {F.canW && <button onClick={() => ajuster(r)} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white border border-slate-300 text-slate-700">Montant dû</button>}
                {F.canW && <ConfirmButton onConfirm={() => retirer(r)} confirmLabel="Retirer ?" ariaLabel="Retirer de cette cotisation" className="p-1.5 rounded-lg text-rose-600 hover:bg-rose-50"><Trash2 size={15} /></ConfirmButton>}
              </div>
            </li>
          ))}
        </ul>
      )}
      {pay && <FinPayDialog F={F} du={pay} onClose={() => setPay(null)} />}
    </div>
  );
}

function FinTableau({ F }) {
  const deb = exerciceDebut();
  const ex = F.mvt.filter((m) => m.date >= deb);
  const entrees = somme(ex.filter((m) => m.sens === "entree")), sorties = somme(ex.filter((m) => m.sens === "sortie"));
  const solde = (Number(F.params.solde_initial) || 0) + somme(F.mvt.filter((m) => m.sens === "entree")) - somme(F.mvt.filter((m) => m.sens === "sortie"));
  const retards = {};
  F.dus.forEach((d) => {
    const c = F.cot.find((x) => x.id === d.cotisation_id);
    if (!c || !c.echeance || daysUntil(c.echeance) >= 0) return;
    const r = Math.max(d.montant_du - F.paye(d.id), 0);
    if (r > 0) retards[d.user_id] = (retards[d.user_id] || 0) + r;
  });
  const totalRetard = Object.values(retards).reduce((a, b) => a + b, 0);
  const parCat = (sens) => Object.entries(ex.filter((m) => m.sens === sens).reduce((acc, m) => { const k = m.categorie || "Autre"; acc[k] = (acc[k] || 0) + m.montant; return acc; }, {})).sort((a, b) => b[1] - a[1]);
  const cartes = [
    [HistoryIcon, "Solde de la caisse", fcfa(solde), solde < 0 ? "text-rose-600" : "text-slate-900"],
    [ArrowUp, `Entrées depuis le ${fmtDate(deb)}`, fcfa(entrees), "text-emerald-700"],
    [ArrowDown, "Sorties sur l'exercice", fcfa(sorties), "text-rose-600"],
    [Clock, `Retards (${Object.keys(retards).length} personne${Object.keys(retards).length > 1 ? "s" : ""})`, fcfa(totalRetard), totalRetard ? "text-amber-700" : "text-slate-900"],
  ];
  const barres = (titre, list, couleur) => (
    <Panel title={titre} Icon={BarChart3}>
      {list.length === 0 ? <p className="text-sm text-slate-500">Rien sur l'exercice en cours.</p> : (
        <div className="space-y-3">{list.map(([k, v]) => (
          <div key={k}><div className="flex justify-between text-sm"><span className="text-slate-700">{k}</span><span className="font-bold">{fcfa(v)}</span></div>
            <div className="mt-1 h-2 rounded-full bg-slate-100 overflow-hidden"><div className={`h-full rounded-full ${couleur}`} style={{ width: `${(v / list[0][1]) * 100}%` }} /></div></div>
        ))}</div>
      )}
    </Panel>
  );
  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {cartes.map(([I, l, v, cls]) => <div key={l} className="bg-white rounded-3xl shadow-sm p-5"><I size={20} className="text-orange-600" /><p className={`text-2xl font-extrabold mt-3 ${cls}`}>{v}</p><p className="text-sm text-slate-500 leading-snug">{l}</p></div>)}
      </div>
      <div className="grid lg:grid-cols-2 gap-6">
        {barres("Entrées par catégorie (exercice)", parCat("entree"), "bg-emerald-500")}
        {barres("Sorties par catégorie (exercice)", parCat("sortie"), "bg-rose-500")}
      </div>

    const montant = toInt(form.montant);
    if (!/^\d{4}-\d{4}$/.test(form.annee.trim())) return F.notify("Année au format 2026-2027.", "error");
    if (!Number.isFinite(montant) || montant < 0) return F.notify("Montant invalide.", "error");
    setBusy(true);
    const { data, error } = await sb.rpc("fin_creer_annuelle", { an: form.annee.trim(), montant_annuel: montant, ech: form.echeance || null });
    setBusy(false);
    if (error) return F.notify(error.message, "error");
    F.notify("Cotisation annuelle enregistrée, membres ajoutés."); setForm(null); setSel(data); F.reload();
  };
  const synchro = async () => {
    const { data, error } = await sb.rpc("fin_synchroniser", { c_id: cot.id });
    if (error) return F.notify(error.message, "error");
    F.notify(data ? `${data} membre(s) ajouté(s).` : "La liste était déjà à jour."); F.reload();
  };
  return (
    <div className="space-y-6">

            <label className="block"><span className="text-xs font-semibold text-slate-600">Montant (FCFA)</span><input value={form.montant} onChange={(e) => setForm({ ...form, montant: e.target.value })} className={inputCls} /></label>
            <label className="block"><span className="text-xs font-semibold text-slate-600">Date limite de paiement</span><input type="date" value={form.echeance} onChange={(e) => setForm({ ...form, echeance: e.target.value })} className={inputCls} /></label>
          </div>
          <div className="flex justify-end gap-2 mt-4">
            <button onClick={() => setForm(null)} className="px-4 py-2.5 rounded-xl bg-white border border-slate-300 text-sm">Annuler</button>

function FinBureau({ F }) {
  const mois = F.cot.filter((c) => c.type === "bureau").sort((a, b) => String(a.mois).localeCompare(String(b.mois)));
  const ids = [...new Set([...F.comptes.filter((p) => p.bureau).map((p) => p.id), ...F.dus.filter((d) => mois.some((c) => c.id === d.cotisation_id)).map((d) => d.user_id)])]
    .sort((a, b) => F.nom(a).localeCompare(F.nom(b)));
  const [gen, setGen] = useState(null);
  const [pay, setPay] = useState(null);
  const [busy, setBusy] = useState(false);
  const generer = async () => {
    const n = Number(gen.nb), montant = toInt(gen.montant);
    if (!/^\d{4}-\d{2}$/.test(gen.debut) || !(n >= 1 && n <= 24)) return F.notify("Indiquez le premier mois et un nombre de mois (1 à 24).", "error");
    if (!Number.isFinite(montant) || montant < 0) return F.notify("Montant invalide.", "error");
    const [y, m] = gen.debut.split("-").map(Number);
    const liste = Array.from({ length: n }, (_, i) => { const d = new Date(y, m - 1 + i, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; });
    setBusy(true);
    const { error } = await sb.rpc("fin_generer_bureau", { liste_mois: liste, montant_mensuel: montant });
    if (!error && toInt(F.params.bureau_montant) !== montant) await sb.from("fin_parametres").update({ bureau_montant: montant }).eq("id", 1);
    setBusy(false);
    if (error) return F.notify(error.message, "error");
    F.notify("Mois créés, membres du bureau ajoutés."); setGen(null); F.reload();
  };
  const synchro = async () => {
    let total = 0;
    for (const c of mois) { const { data, error } = await sb.rpc("fin_synchroniser", { c_id: c.id }); if (error) return F.notify(error.message, "error"); total += data || 0; }
    F.notify(total ? `${total} ligne(s) ajoutée(s).` : "Tout était déjà à jour."); F.reload();
  };
  const cell = (c, uid) => {
    const du = F.dus.find((d) => d.cotisation_id === c.id && d.user_id === uid);
    if (!du) return <span className="text-slate-300">—</span>;
    const reste = Math.max(du.montant_du - F.paye(du.id), 0);
    const late = reste > 0 && c.echeance && daysUntil(c.echeance) < 0;
    const cls = du.montant_du === 0 ? "bg-sky-100 text-sky-700" : reste === 0 ? "bg-emerald-500 text-white" : late ? "bg-rose-100 text-rose-700" : reste < du.montant_du ? "bg-amber-100 text-amber-700" : "bg-slate-100 text-slate-400";
    return <button onClick={() => setPay(du)} title={`${F.nom(uid)} · ${c.titre}`} className={`w-9 h-9 rounded-lg text-sm font-bold ${cls}`}>{du.montant_du === 0 ? "D" : reste === 0 ? "✓" : late ? "!" : reste < du.montant_du ? "½" : "·"}</button>;
  };
  return (
    <div className="space-y-6">
      {gen ? (
        <Panel title="Créer des mois de cotisation" Icon={Calendar}>
          <div className="grid sm:grid-cols-3 gap-4">
            <label className="block"><span className="text-xs font-semibold text-slate-600">Premier mois</span><input type="month" value={gen.debut} onChange={(e) => setGen({ ...gen, debut: e.target.value })} className={inputCls} /></label>
            <label className="block"><span className="text-xs font-semibold text-slate-600">Nombre de mois</span><input value={gen.nb} onChange={(e) => setGen({ ...gen, nb: e.target.value })} className={inputCls} /></label>
            <label className="block"><span className="text-xs font-semibold text-slate-600">Montant par mois (FCFA)</span><input value={gen.montant} onChange={(e) => setGen({ ...gen, montant: e.target.value })} className={inputCls} /></label>
          </div>
          <p className="text-xs text-slate-500 mt-2">Les mois déjà créés ne sont pas modifiés. Chaque mois est dû avant son dernier jour.</p>
          <div className="flex justify-end gap-2 mt-4">
            <button onClick={() => setGen(null)} className="px-4 py-2.5 rounded-xl bg-white border border-slate-300 text-sm">Annuler</button>
            <button onClick={generer} disabled={busy} className="px-5 py-2.5 rounded-xl bg-orange-600 text-white text-sm font-semibold disabled:opacity-60">{busy ? "Création..." : "Créer les mois"}</button>
          </div>
        </Panel>
      ) : F.canW && (
        <div className="flex flex-wrap gap-2">
          <button onClick={() => setGen({ debut: `${anneeAcademique().slice(0, 4)}-10`, nb: "12", montant: F.params.bureau_montant ? String(F.params.bureau_montant) : "" })} className="px-4 py-2 rounded-xl bg-orange-600 text-white text-sm font-semibold flex items-center gap-1"><Plus size={15} /> Créer des mois</button>
          {mois.length > 0 && <button onClick={synchro} className="px-4 py-2 rounded-xl bg-white border border-slate-300 text-sm font-semibold flex items-center gap-1"><RotateCcw size={14} /> Ajouter les nouveaux membres du bureau</button>}
        </div>
      )}
      <Panel title={`Cotisation du bureau${F.params.bureau_montant ? ` · ${fcfa(F.params.bureau_montant)} par mois` : ""}`} Icon={Users}>
        <p className="text-sm text-slate-500 -mt-3 mb-4">Les membres du bureau se cochent dans Adhésions → Membres CGE. Cliquez sur une case pour voir ou enregistrer un paiement. ✓ payé · ½ partiel · ! en retard · D dispensé.</p>
        {mois.length === 0 || ids.length === 0 ? <p className="text-sm text-slate-500">{mois.length === 0 ? "Aucun mois créé." : "Aucun membre du bureau n'est coché."}</p> : (
          <div className="overflow-x-auto">
            <table className="text-sm border-separate border-spacing-1">
              <thead><tr><th className="text-left px-2 text-xs text-slate-500 font-semibold sticky left-0 bg-white">Membre</th>{mois.map((c) => (
                <th key={c.id} className="text-xs text-slate-500 font-semibold whitespace-nowrap px-1">
                  <div className="flex flex-col items-center gap-0.5">
                    {moisLabel(c.mois)}
                    {F.canW && (
                      <ConfirmButton
                        onConfirm={async () => {
                          if (F.dus.some((d) => d.cotisation_id === c.id && F.paye(d.id) > 0)) return F.notify("Des paiements existent pour ce mois : supprimez-les d'abord (cliquez sur les cases).", "error");
                          const { error } = await sb.from("fin_cotisations").delete().eq("id", c.id);
                          if (error) return F.notify("Suppression impossible : " + error.message, "error");
                          F.notify(`Mois ${moisLabel(c.mois)} supprimé.`); F.reload();
                        }}
                        confirmLabel="Suppr. ?" ariaLabel={`Supprimer le mois ${moisLabel(c.mois)}`} className="text-slate-300 hover:text-rose-600"><X size={12} /></ConfirmButton>
                    )}
                  </div>
                </th>
              ))}</tr></thead>
              <tbody>
                {ids.map((uid) => (
                  <tr key={uid}><td className="pr-3 font-semibold text-slate-900 whitespace-nowrap sticky left-0 bg-white">{F.nom(uid)}</td>{mois.map((c) => <td key={c.id} className="text-center">{cell(c, uid)}</td>)}</tr>
                ))}
                <tr><td className="pr-3 text-xs text-slate-500 sticky left-0 bg-white">Encaissé</td>{mois.map((c) => <td key={c.id} className="text-center text-xs font-semibold text-emerald-700 whitespace-nowrap">{somme(F.mvt.filter((m) => m.sens === "entree" && F.dus.some((d) => d.id === m.du_id && d.cotisation_id === c.id))).toLocaleString("fr-FR")}</td>)}</tr>
              </tbody>
            </table>
          </div>
        )}
      </Panel>
      {pay && <FinPayDialog F={F} du={pay} onClose={() => setPay(null)} />}
    </div>
  );
}

// Export vers Excel (fichier CSV, point-virgule, accents conservés).
const exportCSV = (nom, lignes) => {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = "\ufeff" + lignes.map((l) => l.map(esc).join(";")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
};
// Reste à payer par personne, sur les cotisations dont la date limite est passée.
const finRetards = (F) => {
  const r = {};
  F.dus.forEach((d) => {
    const c = F.cot.find((x) => x.id === d.cotisation_id);
    if (!c || !c.echeance || daysUntil(c.echeance) >= 0) return;
    const reste = Math.max(d.montant_du - F.paye(d.id), 0);
    if (reste > 0) r[d.user_id] = (r[d.user_id] || 0) + reste;
  });
  return r;
};
const CIBLES = { membres: "Tous les membres élèves", bureau: "Le bureau", departements: "Un ou plusieurs départements", evenement: "Les inscrits à un événement", selection: "Une sélection à la main" };

function FinExceptionnelles({ F }) {

  useEffect(() => { sb.from("events").select("id, title, date").order("date", { ascending: false }).then(({ data }) => setEvents(data || [])); }, []);
  const cot = list.find((c) => c.id === sel) || null;
  const creer = async () => {
    const montant = toInt(form.montant);
    if (form.titre.trim().length < 3) return F.notify("Donnez un titre à la cotisation.", "error");
    if (!Number.isFinite(montant) || montant < 0) return F.notify("Montant invalide.", "error");
    if (form.cible === "departements" && !form.valeurs.length) return F.notify("Choisissez au moins un département.", "error");
    if (form.cible === "evenement" && !form.valeurs.length) return F.notify("Choisissez l'événement.", "error");
    setBusy(true);
    const { data, error } = await sb.from("fin_cotisations").insert({ type: "exceptionnelle", titre: form.titre.trim(), montant, echeance: form.echeance || null,
      description: form.description.trim() || null, cible: form.cible, cible_valeurs: form.valeurs }).select().single();
    if (!error && form.cible !== "selection") await sb.rpc("fin_synchroniser", { c_id: data.id });
    setBusy(false);
    if (error) return F.notify("Création impossible : " + error.message, "error");
    F.notify(form.cible === "selection" ? "Cotisation créée : ajoutez maintenant les personnes concernées." : "Cotisation créée, personnes concernées ajoutées.");
    setForm(null); setSel(data.id); F.reload();
  };
  const synchro = async () => {
    const { data, error } = await sb.rpc("fin_synchroniser", { c_id: cot.id });
    if (error) return F.notify(error.message, "error");
    F.notify(data ? `${data} personne(s) ajoutée(s).` : "La liste était déjà à jour."); F.reload();
  };
  const ajouter = async (p) => {

  return (
